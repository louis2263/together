<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方包包包剪揼 V60 Debug</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:monospace,sans-serif}
body{background:#FFE66D}
.wrap{position:relative;width:100%;max-width:480px;margin:0 auto;min-height:100vh;background:url('background01.jpg') no-repeat top center;background-size:100% auto;background-color:#FFE66D}
.black-card{position:absolute;left:16px;right:16px;bottom:20px;background:#111;border-radius:28px;padding:20px}
.yellow{color:#FFE66D;font-weight:900;font-size:14px}
.input-box{width:100%;background:#2A2A2A;border:2px solid #3A3A3A;border-radius:14px;padding:14px;color:#fff;margin-top:8px}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;border:3px solid #111;border-radius:16px;padding:13px;text-align:center;font-weight:1000}
.btn-y{background:#FFD93D}.btn-g{background:#34C759}
.screen{display:none;max-width:480px;margin:0 auto;min-height:100vh;padding:10px;background:#FFE66D}
.screen.active{display:block}
#debugToggle{position:fixed;top:10px;right:10px;z-index:99999;background:#000;color:#0f0;border:2px solid #0f0;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
#debugPanel{position:fixed;bottom:0;left:0;right:0;max-height:60vh;background:rgba(20,20,20,.95);color:#0f0;border-top:3px solid #0f0;border-radius:18px 18px 0 0;padding:12px;z-index:99998;overflow:auto;display:none}
#debugPanel.open{display:block}
.log-line{color:#0f0;font-size:13px;line-height:1.6;word-break:break-all}
</style>
</head>
<body>
<div id="debugToggle" onclick="toggleDebug()">🐛</div>
<div id="debugPanel">
  <div style="display:flex;justify-content:space-between"><b>🐛 DEBUG V60</b><button onclick="toggleDebug()" style="background:#FFE66D;border:none;padding:4px 10px;border-radius:8px">X 收起</button></div>
  <div id="dbgLog"></div>
</div>

<div id="s1" class="screen active" style="background:transparent;padding:0"><div class="wrap"><div class="black-card"><div class="yellow">與朋友一起對決！準備好了嗎？</div><div class="yellow" style="margin-top:12px">輸入你個名</div><input id="nameInput" class="input-box" placeholder="Louis"><div class="btn-row"><div class="btn btn-y" onclick="createRoom()">開始房間</div><div class="btn btn-g" onclick="joinRoom()">進入房間</div></div><div class="yellow" style="margin-top:12px"># 房號</div><input id="roomInput" class="input-box" placeholder="4位房號 例如 4829" maxlength="4"></div></div></div>

<div id="s2" class="screen"><div class="yellow" style="color:#111;background:#fff;border-radius:12px;padding:8px">房號 <span id="roomNo2"></span> | 玩家準備好</div><div style="margin-top:20px" class="yellow">① 包剪揼 2.5秒 <span id="st1" style="background:#FFE66D;color:#111;border-radius:999px;padding:2px 8px">未錄</span></div><div class="btn btn-y" style="margin-top:8px" onclick="toggleRec(1)">● 錄音①</div><audio id="aud1" controls style="display:none"></audio><div class="yellow" style="margin-top:12px">② 勝利宣言 3秒 <span id="st2" style="background:#FFE66D;color:#111;border-radius:999px;padding:2px 8px">未錄</span></div><div class="btn btn-y" style="margin-top:8px" onclick="toggleRec(2)">● 錄音②</div><audio id="aud2" controls style="display:none"></audio><div class="btn btn-g" style="margin-top:20px" onclick="startGame()">開始遊戲</div></div>

<div id="s3" class="screen"><div class="yellow" style="color:#111;background:#111;color:#FFE66D;padding:8px;border-radius:10px">第<span id="roundInfo">1</span>輪 | 存活 <span id="aliveInfo">5</span>人</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px"><div onclick="choose('paper')"><div style="background:#FFF9C4;border:3px solid #111;border-radius:16px;padding:20px;text-align:center">✋包</div></div><div onclick="choose('scissors')"><div style="background:#FFF9C4;border:3px solid #111;border-radius:16px;padding:20px;text-align:center">✌️剪</div></div><div onclick="choose('rock')"><div style="background:#FFF9C4;border:3px solid #111;border-radius:16px;padding:20px;text-align:center">✊揼</div></div></div><div id="status" style="margin-top:12px;text-align:center;font-weight:900">等待出拳</div></div>

<script>
let state={room:'',name:'',round:1,players:[],c1:undefined,c2:undefined,status:'waitingChoose',log:[]}
function log(msg){
  let t=new Date().toLocaleTimeString('zh-HK',{hour12:true});
  let line=`[${t}] ${msg}`;
  state.log.push(line);
  let el=document.getElementById('dbgLog');
  el.innerHTML = state.log.slice(-30).reverse().map(l=>{
    let cls='log-line';
    if(l.includes('✅')||l.includes('✔')) return `<div class="${cls}" style="color:#0f0">${l}</div>`;
    return `<div class="${cls}">${l}</div>`;
  }).join('');
  console.log(line);
}
function toggleDebug(){document.getElementById('debugPanel').classList.toggle('open')}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function createRoom(){state.name=document.getElementById('nameInput').value||'Louis';state.room=Math.floor(1000+Math.random()*9000)+'';log(`開房 房號=${state.room} 名=${state.name}`);log(`回合狀態:waitingChoose,c1:undefined,c2:undefined`);log(`✅可以揀包/剪/揼`);document.getElementById('roomNo2').textContent=state.room;show('s2')}
function joinRoom(){state.name=document.getElementById('nameInput').value||'Louis';state.room=document.getElementById('roomInput').value||'4829';log(`入房 房號=${state.room}`);log(`回合狀態:waitingChoose,c1:undefined,c2:undefined`);log(`✅可以揀包/剪/揼`);document.getElementById('roomNo2').textContent=state.room;show('s2')}
function startGame(){state.round=1;state.c1=undefined;state.c2=undefined;state.status='waitingChoose';log(`回合狀態:${state.status},c1:${state.c1},c2:${state.c2}`);log(`✅可以揀包/剪/揼`);show('s3')}
function choose(c){
  if(!state.c1){state.c1=c;log(`我揀咗:${c}`);state.status='waitingChoose';log(`回合狀態:${state.status},c1:${state.c1},c2:${state.c2}`);log(`✅可以揀包/剪/揼`);document.getElementById('status').textContent=`你出咗 ${c}，等對手...`;setTimeout(()=>{state.c2=['rock','paper','scissors'][Math.floor(Math.random()*3)];log(`回合狀態:waitingChoose,c1:${state.c1},c2:${state.c2}`);log(`✅可以揀包/剪/揼`);log(`我揀咗:${c}`);log(`回合狀態:waitingChoose,c1:${state.c1},c2:${state.c2}`);log(`✅可以揀包/剪/揼`);log(`✅雙方已經出拳，進入賽果判斷`);state.status='judge';log(`回合狀態:${state.status},c1:${state.c1},c2:${state.c2}`);log(`✅開始計賽果 + 大合唱`);let win='p1';if(state.c1!==state.c2){if((state.c1=='paper'&&state.c2=='rock')||(state.c1=='scissors'&&state.c2=='paper')||(state.c1=='rock'&&state.c2=='scissors')) win='p1'; else win='p2'} log(`賽果:${win}`);document.getElementById('status').textContent=`賽果:${win} | ${state.c1} vs ${state.c2}`},800);}
}
let mediaRecorder,chunks=[];
function toggleRec(t){log(`錄音${t}開始`);navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{chunks=[];mediaRecorder=new MediaRecorder(s);mediaRecorder.ondataavailable=e=>chunks.push(e.data);mediaRecorder.onstop=()=>{let url=URL.createObjectURL(new Blob(chunks));document.getElementById('aud'+t).src=url;document.getElementById('aud'+t).style.display='block';document.getElementById('st'+t).textContent='已錄 ✅';log(`錄音${t}完成`);s.getTracks().forEach(tr=>tr.stop())};mediaRecorder.start();setTimeout(()=>mediaRecorder.state=='recording'&&mediaRecorder.stop(),t==1?2500:3000)})}
log('回合狀態:waitingChoose,c1:undefined,c2:undefined');log('✅可以揀包/剪/揼');
</script>
</body>
</html>
