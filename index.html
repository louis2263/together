<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>包剪揼大合唱 V53</title>
<style>
:root{--y:#FFE66D;--yb:#FFD93D;--b:#111;--w:#fff;--r:#FF4A4A;--g:#4ADE80}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK",sans-serif}
body{background:var(--y);color:var(--b)}
.screen{display:none;min-height:100vh;padding:14px 14px 90px}
.screen.active{display:block}
.black{background:var(--b);color:var(--w);border-radius:20px;padding:14px 16px;border:3px solid var(--b);margin-bottom:12px}
.pill{background:var(--y);color:var(--b);border:2px solid var(--b);border-radius:999px;padding:4px 12px;font-weight:900;display:inline-block}
.roomNo{font-size:42px;font-weight:1000;-webkit-text-stroke:3px var(--b);color:var(--w);text-shadow:4px 4px 0 var(--b)}
.btn{border:3px solid var(--b);border-radius:18px;padding:14px 18px;font-weight:900;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-yellow{background:var(--yb)} .btn-red{background:var(--r);color:var(--w)} .btn-green{background:var(--g)} .btn-black{background:var(--b);color:var(--w)} .btn-grey{background:#ccc}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.hand{width:100%;aspect-ratio:1;background:var(--w);border:3px solid var(--b);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:48px;cursor:pointer}
.hand.selected{outline:4px solid var(--b);background:var(--yb)}
.hand-label{background:var(--b);color:var(--y);border-radius:999px;padding:4px 10px;font-weight:900;text-align:center;margin-top:6px}
.wave{height:18px;background:#222;border-radius:10px;overflow:hidden}
.countdown{font-size:42px;font-weight:1000;letter-spacing:8px}
input{width:100%;border:3px solid var(--b);border-radius:14px;padding:12px;font-size:16px;font-weight:700}
audio{width:100%}
</style>
</head>
<body>
<div id="s1" class="screen active">
  <div style="height:16vh"></div>
  <div class="black" style="text-align:center">
    <div style="font-size:56px">✊✌️🖐️</div><h1>包剪揼大合唱 V53</h1>
    <div style="margin:16px 0"><input id="nameInput" placeholder="輸入你個名"></div>
    <div class="grid2"><div class="btn btn-yellow" onclick="createRoom()">開始房間</div><div class="btn btn-black" onclick="joinRoom()">進入房間 #</div></div>
    <div style="margin-top:12px"><input id="roomInput" placeholder="4位房號 例如 4829" maxlength="4"></div>
  </div>
</div>
<div id="s2" class="screen">
  <div class="black"><span class="pill" id="readyPill">2 players ready</span><div id="playersReady" style="margin-top:8px"></div></div>
  <div style="text-align:center;margin:14px 0"><div class="roomNo" id="roomNo2">房號 4829</div></div>
  <div class="black"><div style="color:var(--y);font-weight:900">③ 遊戲玩法</div><div class="grid2" style="margin-top:10px" id="modeGrid"></div></div>
  <div class="black"><div style="color:var(--y);font-weight:900">① 包剪揼 2.5秒</div><div style="margin:8px 0"><span id="st1" class="pill">未錄</span></div><div class="btn btn-red" id="rec1Btn" onclick="toggleRec(1)">● 錄音① 2.5秒</div><audio id="aud1" controls style="display:none;margin-top:8px"></audio></div>
  <div class="black"><div style="color:var(--y);font-weight:900">② 勝利宣言 3秒</div><div style="margin:8px 0"><span id="st2" class="pill">未錄</span></div><div class="btn btn-red" id="rec2Btn" onclick="toggleRec(2)">● 錄音② 3秒</div><audio id="aud2" controls style="display:none;margin-top:8px"></audio></div>
  <div class="btn btn-yellow" onclick="startGame()">⑦ 開始遊戲</div><div class="btn btn-grey" style="margin-top:10px" id="waitAudio">等所有人上傳2段音</div>
</div>
<div id="s3" class="screen">
  <div class="black" style="display:flex;justify-content:space-between"><span id="s3info"></span><span id="aliveInfo"></span></div>
  <div style="text-align:center;margin:12px"><span class="pill" id="roundInfo">第1輪 - 請出拳</span></div>
  <div class="grid3">
    <div onclick="choose('包')"><div class="hand" id="hBao">🖐️</div><div class="hand-label">包</div></div>
    <div onclick="choose('剪')"><div class="hand" id="hJian">✌️</div><div class="hand-label">剪</div></div>
    <div onclick="choose('揼')"><div class="hand" id="hBeng">✊</div><div class="hand-label">揼</div></div>
  </div>
  <div style="background:#fff;border:3px solid #111;border-radius:18px;padding:14px;margin-top:12px;text-align:center">
    <div id="countdown" class="countdown">3 2 1</div>
    <div id="choiceLog" style="font-weight:900;margin-top:8px">Choice log：你未揀</div>
    <div id="choiceStatus" class="grid2" style="margin-top:10px"></div>
    <div id="waitAll" style="margin-top:8px;font-weight:900"></div>
  </div>
  <div id="chorusArea" class="black" style="display:none;text-align:center">
    <div id="chorusTitle" style="color:#FFE66D;font-weight:1000;font-size:20px">5人大合唱播放中...</div>
    <div class="wave" style="margin:10px 0"><div id="progress" style="height:100%;width:0%;background:#FFE66D"></div></div>
    <div id="chorusWaves" class="grid2"></div>
  </div>
</div>
<div id="s4" class="screen">
  <div class="black" style="display:flex;justify-content:space-between"><span id="rRoom"></span><span id="rTitle" style="color:#FFE66D"></span></div>
  <div style="text-align:center;margin:12px"><span class="pill">大家出拳情況</span></div>
  <div class="grid2" id="resultGrid"></div>
  <div style="background:#fff;border:3px solid #111;border-radius:18px;padding:14px;margin-top:12px;text-align:center">
    <div>剩餘人數</div><div id="remainCount" style="font-size:36px;font-weight:1000">剩餘 2人</div>
    <div id="remainAvatars"></div>
    <div class="black" style="margin-top:8px"><div>+ 淘汰名單</div><div id="elimList" style="color:#FF4A4A;font-weight:900"></div></div>
  </div>
  <div class="grid2" style="margin-top:12px"><div class="btn btn-green" onclick="nextRound()">▶ 下一輪</div><div class="btn btn-black" onclick="resetAll()">↺ 全新遊戲</div></div>
</div>
<div id="s5" class="screen">
  <div class="black" style="text-align:center">房號 4829 | 🎉最終勝利</div>
  <div style="text-align:center;margin:20px 0"><div style="font-size:60px">👑</div><div style="font-size:28px;font-weight:1000">最終勝利者</div><div id="winnerName" style="font-size:38px;font-weight:1000;background:#fff;border:3px solid #111;border-radius:16px;padding:6px 18px;display:inline-block;margin-top:8px">Player A</div><div id="winnerHand" style="font-size:80px;margin-top:10px">🖐️</div><div id="winnerHandText"></div></div>
  <div style="background:#fff;border:3px solid #111;border-radius:18px;padding:14px"><div>勝利宣言</div><audio id="winAudio" controls style="margin-top:8px"></audio></div>
  <div class="grid2" style="margin-top:12px"><div class="btn btn-yellow" onclick="celebrate()">🎉 慶祝</div><div class="btn btn-black" onclick="resetAll()">↺ 全新遊戲</div></div>
</div>
<script>
let state={name:'玩家A',room:'4829',mode:'一鋪定勝負',modes:['一鋪定勝負','贏兩鋪','贏三鋪','連贏兩鋪'],rec1Url:null,rec2Url:null,players:[],round:1,myChoice:null}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function createRoom(){state.name=document.getElementById('nameInput').value||'玩家A';state.room=(Math.floor(1000+Math.random()*9000)).toString();initPlayers();show('s2');renderS2()}
function joinRoom(){state.name=document.getElementById('nameInput').value||'玩家B';let r=document.getElementById('roomInput').value;if(r)state.room=r;initPlayers();show('s2');renderS2()}
function initPlayers(){state.players=[{id:'me',name:state.name+'(你)',choice:null,alive:true,wins:0,streak:0},{id:'B',name:'玩家B',choice:null,alive:true,wins:0,streak:0},{id:'C',name:'玩家C',choice:null,alive:true,wins:0,streak:0},{id:'D',name:'玩家D',choice:null,alive:true,wins:0,streak:0},{id:'E',name:'玩家E',choice:null,alive:true,wins:0,streak:0}]}
function renderS2(){document.getElementById('roomNo2').textContent='房號 '+state.room;document.getElementById('playersReady').textContent=state.players.map(p=>p.name).join(' | ');let grid=document.getElementById('modeGrid');grid.innerHTML='';state.modes.forEach(m=>{let d=document.createElement('div');d.className='btn';d.style.background=m===state.mode?'#FFD93D':'#fff';d.textContent=m;d.onclick=()=>{state.mode=m;renderS2()};grid.appendChild(d)});checkReady()}
function checkReady(){document.getElementById('waitAudio').textContent=(state.rec1Url&&state.rec2Url)?'已準備好，按開始遊戲':'等所有人上傳2段音 - 你仲未錄齊'}
let mediaRecorder,chunks=[];
function toggleRec(t){if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();return}
navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{chunks=[];mediaRecorder=new MediaRecorder(s);mediaRecorder.ondataavailable=e=>chunks.push(e.data);
mediaRecorder.onstop=()=>{let blob=new Blob(chunks,{type:'audio/webm'});let url=URL.createObjectURL(blob);if(t===1){state.rec1Url=url;document.getElementById('aud1').src=url;document.getElement
