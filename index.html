<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>包剪揼多人同步 v2.5</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;padding:12px;background:#ffe666;font-size:17px}
.page{display:none}
.page.active{display:block}
button{padding:12px 16px;margin:6px;font-size:16px;border-radius:8px;border:none;background:#fff}
input{padding:11px;width:100%;margin:6px 0;font-size:17px;border-radius:6px;border:1px solid #aaa}
#eventLogBox{width:100%;min-height:140px;background:#fff;padding:10px;border-radius:8px;white-space:pre-wrap;overflow-y:auto;margin-bottom:12px}
#debugWindow{position:fixed;left:0;right:0;bottom:0;background:#000;color:#3f3;padding:8px;font-size:12px;max-height:160px;overflow-y:auto}
.versionTag{position:fixed;top:8px;right:8px;background:#444;color:#fff;padding:4px 8px;border-radius:6px}
.ready-mark{color:green;font-weight:bold}
.rec-indicator{margin:4px 0}
</style>
</head>
<body>
<div class="versionTag">v2.5</div>

<!-- Page1 -->
<div id="page1" class="page active">
<h2>第一頁：輸入姓名 / 建立或加入房間</h2>
<input id="playerNameInput" placeholder="輸入你的名字"/>
<br/>
<button id="btnCreateRoom">房主：開啟全新房間</button>
<br/>
<input id="roomIdJoinInput" placeholder="輸入4位數房間號碼"/>
<button id="btnJoinRoom">房客：進入房間</button>
</div>

<!-- Page2 -->
<div id="page2" class="page">
<h2>房間號碼：<span id="roomTitleShow"></span></h2>
<div id="eventLogBox"></div>
<div class="rec-indicator">
<span id="rec1Status">第一段包剪揼：未錄音</span><br>
<span id="rec2Status">第二段勝利宣言：未錄音</span>
</div>

<h3>錄製音訊 & 設定遊戲</h3>
<input id="p2PlayerName" readonly/>

<h4>第一段：包剪揼（大合唱用）</h4>
<button id="rec1Start">開始錄第一段</button>
<button id="rec1Stop">停止錄第一段</button>

<h4>第二段：勝利宣言</h4>
<button id="rec2Start">開始錄第二段</button>
<button id="rec2Stop">停止錄第二段</button>

<h4>房主選擇遊戲規則</h4>
<div>
<button data-rule="oneRound">一鋪定勝負</button>
<button data-rule="win2">贏兩鋪</button>
<button data-rule="win3">贏三鋪</button>
<button data-rule="consec2">連贏兩鋪</button>
</div>
</div>

<div id="debugWindow"></div>

<script>
const debugDiv = document.querySelector("#debugWindow");
const log = (txt)=>{
  const t = new Date().toLocaleString("zh-HK");
  debugDiv.innerText += `[${t}] ${txt}\n`;
  debugDiv.scrollTop = debugDiv.scrollHeight;
};
log("✅ v2.5 腳本開始執行");

let fbDb, roomRef, playersRef, roomEventsRef;
let myName = "";
let currentRoomId = "";

// 錄音全域狀態
let mediaRec1 = null, mediaRec2 = null;
let stream1 = null, stream2 = null;
let chunks1=[],chunks2=[];
let audioBlob1 = null, audioBlob2 = null;

const setPage = (id)=>{
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
};

// ========== Firebase Init ==========
try{
  log("Step0：準備初始化 Firebase");
  const cfg = {
    apiKey:"在此填入你的apiKey",
    authDomain:"game-ad81e.firebaseapp.com",
    databaseURL:"https://game-ad81e-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:"game-ad81e",
    storageBucket:"game-ad81e.appspot.com"
  };
  const app = firebase.initializeApp(cfg);
  fbDb = firebase.database(app);
  log("✅ Step1 Firebase 初始化成功");
}catch(err){
  log("❌ Firebase初始化錯誤:" + err.message);
}

const pushRoomEvent = async (msg)=>{
  await roomEventsRef.push({msg, ts:Date.now()});
};

const renderRoomEvents = (snap)=>{
  const box = document.querySelector("#eventLogBox");
  box.innerText = "";
  if(!snap.exists()) return;
  const arr = Object.values(snap.val()).sort((a,b)=>a.ts - b.ts);
  arr.forEach(e=> box.innerText += e.msg + "\n");
};

// 建立房間
document.querySelector("#btnCreateRoom").onclick = async ()=>{
  try{
    log("Step4 房主點擊開啟房間");
    myName = document.querySelector("#playerNameInput").value.trim();
    if(!myName){alert("請輸入姓名");return;}

    currentRoomId = String(Math.floor(1000 + Math.random()*9000));
    log(`Step5 生成房號=${currentRoomId}`);

    roomRef = fbDb.ref(`rooms/${currentRoomId}`);
    playersRef = fbDb.ref(`rooms/${currentRoomId}/players`);
    roomEventsRef = fbDb.ref(`rooms/${currentRoomId}/roomEvents`);

    await roomRef.child("host").set(myName);
    await playersRef.child(myName).set({name:myName, ready:false});
    await pushRoomEvent(`${myName} 進入房間`);

    roomEventsRef.on("value", renderRoomEvents);

    document.querySelector("#roomTitleShow").innerText = currentRoomId;
    document.querySelector("#p2PlayerName").value = myName;
    log("➡ 切換 page2");
    setPage("page2");
  }catch(ex){
    log("❌ 建立房間異常：" + ex.message);
  }
};

// 加入房間，新增校驗：房間是否存在、防止同名
document.querySelector("#btnJoinRoom").onclick = async ()=>{
  try{
    log("房客點擊進入房間");
    myName = document.querySelector("#playerNameInput").value.trim();
    currentRoomId = document.querySelector("#roomIdJoinInput").value.trim();
    if(!myName || currentRoomId.length!==4){alert("請填寫姓名及4位房號");return;}

    roomRef = fbDb.ref(`rooms/${currentRoomId}`);
    playersRef = fbDb.ref(`rooms/${currentRoomId}/players`);
    roomEventsRef = fbDb.ref(`rooms/${currentRoomId}/roomEvents`);

    // 檢查房間是否存在
    const roomSnap = await roomRef.once("value");
    if(!roomSnap.exists()){
      alert("該房間不存在！");
      log("❌ 輸入咗不存在嘅房號");
      return;
    }
    // 檢查有冇同名玩家
    const playerSnap = await playersRef.once("value");
    if(playerSnap.exists() && playerSnap.val()[myName]){
      alert("呢個名字已經有人喺房間入面！請換名");
      return;
    }

    await playersRef.child(myName).set({name:myName, ready:false});
    await pushRoomEvent(`${myName} 進入房間`);

    roomEventsRef.on("value", renderRoomEvents);

    document.querySelector("#roomTitleShow").innerText = currentRoomId;
    document.querySelector("#p2PlayerName").value = myName;
    log("➡ 房客切換 page2");
    setPage("page2");
  }catch(ex){
    log("❌ 加入房間異常："+ex.message);
  }
};

// -----錄音 修復：停止關閉咪、異步處理
document.querySelector("#rec1Start").onclick=async ()=>{
  try{
    stream1 = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRec1 = new MediaRecorder(stream1);
    chunks1=[];
    mediaRec1.ondataavailable=e=>chunks1.push(e.data);
    mediaRec1.onstop = ()=>{
      audioBlob1 = new Blob(chunks1, {type:"audio/webm"});
      document.querySelector("#rec1Status").innerText = "第一段包剪揼：✅已錄畢";
      log("第一段錄音完成");
    };
    mediaRec1.start();
    document.querySelector("#rec1Status").innerText = "第一段包剪揼：🔴錄音中";
    log("開始錄第一段");
  }catch(e){log("錄音1錯誤:"+e.message)}
};

document.querySelector("#rec1Stop").onclick=()=>{
  if(!mediaRec1) return;
  mediaRec1.stop();
  stream1.getTracks().forEach(t=>t.stop());
  stream1=null;
  mediaRec1=null;
  log("停止錄第一段，關閉麥克風");
};

document.querySelector("#rec2Start").onclick=async ()=>{
  try{
    stream2 = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRec2 = new MediaRecorder(stream2);
    chunks2=[];
    mediaRec2.ondataavailable=e=>chunks2.push(e.data);
    mediaRec2.onstop = async ()=>{
      audioBlob2 = new Blob(chunks2, {type:"audio/webm"});
      document.querySelector("#rec2Status").innerText = "第二段勝利宣言：✅已錄畢";
      // 兩段都錄好就標準玩家準備
      if(audioBlob1 && audioBlob2){
        await playersRef.child(`${myName}`).update({ready:true});
        await pushRoomEvent(`${myName} 已準備`);
        log(myName + "標記已準備");
      }
    };
    mediaRec2.start();
    document.querySelector("#rec2Status").innerText = "第二段勝利宣言：🔴錄音中";
    log("開始錄第二段");
  }catch(e){log("錄音2錯誤:"+e.message)}
};

document.querySelector("#rec2Stop").onclick=()=>{
  if(!mediaRec2) return;
  mediaRec2.stop();
  stream2.getTracks().forEach(t=>t.stop());
  stream2=null;
  mediaRec2=null;
  log("停止錄第二段，關閉麥克風");
};

// 設定遊戲規則
document.querySelectorAll("[data-rule]").forEach(btn=>{
  btn.onclick = async ()=>{
    try{
      const rule = btn.dataset.rule;
      await roomRef.child("gameRule").set(rule);
      log("房主設定規則:"+rule);
    }catch(e){log("設定規則錯誤:"+e.message)}
  }
})

log("v2.5 JS全部載入完畢，等待玩家開房");
</script>
</body>
</html>
