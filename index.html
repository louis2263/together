<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>包剪揼多人遊戲</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
.page{display:none;padding:20px;text-align:center}
.page.active{display:block}
.page-start{
  background-image: url("background01.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  min-height: 100vh;
}
h1{margin:30px 0;color:#222}
input,button{padding:12px;margin:8px;font-size:16px;border-radius:8px}
button{background:#2563eb;color:white;border:none}
#debug{position:fixed;bottom:0;left:0;width:100%;background:rgba(0,0,0,0.85);color:#9f9;max-height:180px;overflow:auto;font-size:12px;padding:6px;text-align:left}
</style>
</head>
<body>

<!-- 第一頁（有背景） -->
<div id="page1" class="page page-start active">
  <h1>包剪揼多人遊戲</h1>
  <p>輸入玩家名稱</p>
  <input id="playerName" placeholder="你的名字">
  <br>
  <button id="createRoom">開新房間</button>
  <br>
  <p>或者加入房間</p>
  <input id="roomCode" placeholder="四位房號">
  <button id="joinRoom">加入房間</button>
</div>

<!-- 第二頁（等候區，無背景） -->
<div id="page2" class="page">
  <h2>等候房間</h2>
  <p id="roomInfo"></p>
  <p id="playerList"></p>
  <button id="readyBtn">已準備</button>
  <button id="startGameBtn" style="display:none">開始遊戲</button>
</div>

<!-- 第三頁（遊戲頁，無背景） -->
<div id="page3" class="page">
  <h2>包剪揼對戰</h2>
  <p id="gameStatus"></p>
  <div>
    <button class="playBtn" data-choice="包">包</button>
    <button class="playBtn" data-choice="剪">剪</button>
    <button class="playBtn" data-choice="揼">揼</button>
  </div>
</div>

<!-- Debug 視窗永久顯示 -->
<div id="debug"></div>

<script>
const debug = document.getElementById("debug");
function log(msg){
  debug.innerText += "\n" + msg;
  debug.scrollTop = debug.scrollHeight;
}
log("系統載入完成，第一頁背景：background01.jpg");

// 頁面切換
function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// 簡單房間模擬（之後你可以換返 Firebase）
let room = null;
let playerName = "";

document.getElementById("createRoom").onclick = ()=>{
  playerName = document.getElementById("playerName").value.trim();
  if(!playerName) return log("請輸入名稱");
  const code = Math.floor(1000 + Math.random()*9000).toString();
  room = { code, players:[{name:playerName,ready:false}], host:playerName };
  log("房主開房，房號：" + code);
  showPage("page2");
  document.getElementById("roomInfo").innerText = "房號：" + code;
  renderPlayerList();
};

document.getElementById("joinRoom").onclick = ()=>{
  playerName = document.getElementById("playerName").value.trim();
  const inputCode = document.getElementById("roomCode").value.trim();
  if(!playerName || !inputCode) return log("請填名稱同房號");
  if(!room){
    log("暫時模擬，要 Firebase 先可以跨機搜房");
    return;
  }
  if(room.code === inputCode){
    room.players.push({name:playerName,ready:false});
    log(playerName + " 加入房間");
    showPage("page2");
    document.getElementById("roomInfo").innerText = "房號：" + room.code;
    renderPlayerList();
  }
};

function renderPlayerList(){
  const list = document.getElementById("playerList");
  list.innerText = "";
  room.players.forEach(p=>{
    list.innerText += p.name + (p.ready ? " ✅已準備" : " ❌未準備") + "\n";
  });
  if(room.host === playerName){
    document.getElementById("startGameBtn").style.display = "block";
  }
}

document.getElementById("readyBtn").onclick = ()=>{
  const me = room.players.find(p=>p.name === playerName);
  if(me){
    me.ready = true;
    log(playerName + " 已準備");
    renderPlayerList();
  }
};

document.getElementById("startGameBtn").onclick = ()=>{
  const allReady = room.players.every(p=>p.ready === true);
  if(allReady){
    log("全部人準備好，進入遊戲");
    showPage("page3");
  }else{
    log("仲有人未準備好");
  }
};

document.querySelectorAll(".playBtn").forEach(btn=>{
  btn.onclick = ()=>{
    const choice = btn.dataset.choice;
    log(playerName + " 出：" + choice);
    document.getElementById("gameStatus").innerText = "你出咗：" + choice;
  };
});
</script>

</body>
</html>
