<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>方包包包剪揼 V62</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei",sans-serif}
body{background:#FFE66D}
.wrap1{position:relative;width:100%;max-width:480px;margin:0 auto;min-height:100vh;background:url('background01.jpg') no-repeat top center;background-size:100% auto;background-color:#FFE66D}
.wrap2{position:relative;width:100%;max-width:480px;margin:0 auto;min-height:100vh;background:url('background02.jpg') no-repeat top center;background-size:cover;background-color:#FFE66D;padding:14px 14px 120px}
.card-black{background:#111;border-radius:22px;padding:14px;border:3px solid #111;margin-bottom:12px}
/* 房號6659 橙色實心粗字 */
.room-orange{
  font-size:52px;font-weight:1000;color:#FF7A00;
  -webkit-text-stroke:4px #111;
  text-shadow:5px 5px 0 #111;
  text-align:center;margin:8px 0 14px;letter-spacing:2px;
  font-family:"Arial Black","PingFang HK",sans-serif;
}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mode-btn{background:#fff;border:3px solid #111;border-radius:16px;padding:14px 8px;text-align:center;font-weight:1000;font-size:13px;cursor:pointer}
.mode-btn.selected{background:#FFD93D;outline:3px solid #111}
.btn-red{background:#FF1A1A;color:#fff;border:3px solid #111;border-radius:999px;padding:13px;text-align:center;font-weight:1000;font-size:15px;cursor:pointer;display:block;width:100%}
.btn-yellow{background:#FFD93D;color:#111;border:3px solid #111;border-radius:16px;padding:14px;text-align:center;font-weight:1000;font-size:18px;cursor:pointer;margin-top:8px}
.btn-grey{background:#C4C4C4;color:#333;border:3px solid #111;border-radius:16px;padding:10px;text-align:center;font-weight:900;margin-top:8px}
.input-card{position:absolute;left:16px;right:16px;bottom:20px;background:#111;border-radius:28px;padding:20px}
.yellow{color:#FFE66D;font-weight:900;font-size:13px}
.input-box{width:100%;background:#2A2A2A;border:2px solid #3A3A3A;border-radius:14px;padding:14px;color:#fff;margin-top:6px}
#debugToggle{position:fixed;top:10px;right:10px;z-index:99999;background:#111;color:#0f0;border:2px solid #0f0;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
#debugPanel{position:fixed;bottom:0;left:0;right:0;max-height:60vh;background:rgba(20,20,20,.96);color:#0f0;border-top:3px solid #0f0;border-radius:18px 18px 0 0;padding:10px;z-index:99998;overflow:auto;display:none;font-family:monospace;font-size:12px}
#debugPanel.open{display:block}
</style>
</head>
<body>
<div id="debugToggle" onclick="document.getElementById('debugPanel').classList.toggle('open')">🐛</div>
<div id="debugPanel"><div style="display:flex;justify-content:space-between"><b>🐛 DEBUG V62</b><button onclick="this.parentElement.parentElement.classList.remove('open')" style="background:#FFE66D;border:none;padding:4px 10px;border-radius:8px">X</button></div><div id="dbgLog"></div></div>

<div id="s1" style="display:block"><div class="wrap1"><div class="input-card"><div class="yellow">與朋友一起對決！準備好了嗎？</div><div class="yellow" style="margin-top:10px">輸入你個名</div><input id="nameInput" class="input-box" placeholder="Louis"><div style="display:flex;gap:10px;margin-top:12px"><div class="mode-btn" style="flex:1;background:#FFD93D" onclick="createRoom()">開始房間</div><div class="mode-btn" style="flex:1;background:#34C759" onclick="joinRoom()">進入房間</div></div><div class="yellow" style="margin-top:12px"># 房號</div><input id="roomInput" class="input-box" placeholder="4位房號 例如 6659" maxlength="4"></div></div></div>

<div id="s2" style="display:none"><div class="wrap2">
  <div class="card-black" style="display:flex;justify-content:space-between;align-items:center">
    <div><span style="background:#FFD93D;color:#111;border-radius:6px;padding:2px 7px;font-weight:900">2</span> <span style="color:#FFE66D;font-weight:900;font-size:12px">players ready:</span></div>
    <div style="color:#fff;font-size:11px"><span id="pA">Louis</span>✅準備好 <span id="pB" style="margin-left:6px">玩家B✅已進房</span></div>
  </div>

  <div class="room-orange" id="roomNum">房號 6659</div>

  <!-- 遊戲玩法 - 已刪走③ -->
  <div class="card-black">
    <div style="color:#FFE66D;font-weight:900">遊戲玩法 / Game Mode</div>
    <div class="mode-grid">
      <div class="mode-btn selected" onclick="setMode(this)">一鋪定勝負</div>
      <div class="mode-btn" onclick="setMode(this)">贏兩鋪<br><span style="font-size:10px">(Best of 3)</span></div>
      <div class="mode-btn" onclick="setMode(this)">贏三鋪<br><span style="font-size:10px">(Best of 5)</span></div>
      <div class="mode-btn" onclick="setMode(this)">連贏兩鋪<br><span style="font-size:10px">(Win 2 in a row)</span></div>
    </div>
  </div>

  <!-- 包剪揼 - 已刪走①, 改3秒 -->
  <div class="card-black">
    <div style="color:#FFE66D;font-weight:900">包剪揼 / Rock Paper Scissors Shoot</div>
    <div style="display:flex;justify-content:space-between;color:#fff;font-size:11px;margin:8px 0"><span>請講：包剪揼！</span><span id="st1" style="background:#FFE66D;color:#111;border-radius:999px;padding:2px 8px">狀態：未錄</span></div>
    <div class="btn-red" onclick="toggleRec(1)">🔴 錄音 3秒</div>
    <audio id="aud1" controls style="display:none;width:100%;margin-top:8px"></audio>
  </div>

  <!-- 贏咗講咩 - 已刪走②, 按鈕同第一段一樣 -->
  <div class="card-black">
    <div style="color:#FFE66D;font-weight:900">贏咗你會講咩 - 勝利宣言</div>
    <div style="display:flex;justify-content:space-between;color:#fff;font-size:11px;margin:8px 0"><span>錄低你的勝利宣言！</span><span id="st2" style="background:#FFE66D;color:#111;border-radius:999px;padding:2px 8px">狀態：未錄</span></div>
    <div class="btn-red" onclick="toggleRec(2)">🔴 錄音 3秒</div>
    <audio id="aud2" controls style="display:none;width:100%;margin-top:8px"></audio>
  </div>

  <!-- 開始遊戲 - 已刪走⑦ -->
  <div class="btn-yellow" onclick="startGame()">開始遊戲</div>
  <div class="btn-grey" id="waitBtn">等所有人上傳2段音</div>
</div></div>

<script>
let logEl=document.getElementById('dbgLog');
function dlog(m){let t=new Date().toLocaleTimeString('zh-HK');logEl.innerHTML=`[${t}] ${m}<br>`+logEl.innerHTML}
function createRoom(){let n=document.getElementById('nameInput').value||'Louis';let r=document.getElementById('roomInput').value||'6659';if(r.length!=4) r='6659';document.getElementById('roomNum').textContent='房號 '+r;dlog(`開房 房號=${r} 名=${n}`);dlog(`回合狀態:waitingChoose,c1:undefined,c2:undefined`);dlog(`✅可以揀包/剪/揼`);document.getElementById('s1').style.display='none';document.getElementById('s2').style.display='block';document.getElementById('pA').textContent=n}
function joinRoom(){let n=document.getElementById('nameInput').value||'Louis';let r=document.getElementById('roomInput').value||'6659';document.getElementById('roomNum').textContent='房號 '+r;dlog(`入房 房號=${r} 名=${n}`);document.getElementById('s1').style.display='none';document.getElementById('s2').style.display='block';document.getElementById('pA').textContent=n}
function setMode(el){document.querySelectorAll('.mode-grid .mode-btn').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');dlog(`玩法->${el.innerText.split('\n')[0]}`)}
let mr,chunks=[];
function toggleRec(t){
  dlog(`錄音${t}開始 3秒`);
  navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
    chunks=[];mr=new MediaRecorder(s);
    mr.ondataavailable=e=>chunks.push(e.data);
    mr.onstop=()=>{
      let url=URL.createObjectURL(new Blob(chunks));
      document.getElementById('aud'+t).src=url;
      document.getElementById('aud'+t).style.display='block';
      document.getElementById('st'+t).textContent='已錄 ✅';
      document.getElementById('st'+t).style.background='#34C759';
      dlog(`錄音${t}完成 3秒`);
      if(document.getElementById('st1').textContent.includes('已錄')&&document.getElementById('st2').textContent.includes('已錄')){
        document.getElementById('waitBtn').textContent='✅已準備好 可以開始';
        document.getElementById('waitBtn').style.background='#FFE66D';
      }
      s.getTracks().forEach(tr=>tr.stop())
    };
    mr.start();
    setTimeout(()=>mr.state=='recording'&&mr.stop(),3000)
  }).catch(e=>{dlog(`錄音失敗 ${e}`)})
}
function startGame(){dlog(`✅雙方已經出拳，進入賽果判斷`);dlog(`回合狀態:judge,c1:paper,c2:scissors`);dlog(`✅開始計賽果 + 大合唱`);dlog(`賽果:p2`);alert('房號 6659 開始遊戲')}
dlog('V62 ready 房號6659 橙色實心粗字');dlog('錄音改3秒 按鈕統一');
</script>
</body>
</html>
