<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>包剪揼多人對戰</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;margin:0;padding:0}
body{background:#f3f4f6;padding:16px}
.debug{
  background:#000;
  color:#39ff14;
  padding:10px;
  border-radius:10px;
  margin-bottom:16px;
  font-size:12px;
  line-height:1.4;
  white-space:pre-wrap;
  word-break:break-all;
  position:sticky;
  top:0;
  z-index:999;
  max-height:180px;
  overflow-y:auto;
}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px #00000015;margin-bottom:16px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin:8px 0}
button{width:100%;padding:16px;border:none;border-radius:10px;font-size:18px;color:white;background:#2b78e4;margin:8px 0}
button:disabled{background:#999}
button:disabled img{opacity:0.35;pointer-events:none}
.score{text-align:center;margin-top:12px;font-size:20px;font-weight:bold}
.title-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.title-row img{width:44px;height:44px;object-fit:contain}
.choice-row{display:flex;gap:10px;width:100%}
.choice-row button{flex:1;padding:10px;margin:0;border-radius:10px}
.choice-row button img{width:100%;height:90px;object-fit:contain}
.wait-info{
  background:#eef6ff;
  padding:14px;
  border-radius:10px;
  text-align:center;
  font-size:17px;
  margin-bottom:16px;
}
.room-number{
  font-size:22px;
  font-weight:bold;
  color:#d02828;
}
</style>
</head>
<body>
<div class="debug" id="debugLog">版本 v4.6 | 包=paper，剪=scissors，揼=rock | Firebase傳音頻 | 心跳檢測斷線</div>

<!-- 預載圖片 -->
<img id="imgRock" src="rock.jpg" style="display:none">
<img id="imgScissors" src="scissors.jpg" style="display:none">
<img id="imgPaper" src="paper.jpg" style="display:none">

<!-- 首頁 開房/加入房 -->
<div id="pageLobby" class="card">
  <div class="title-row">
    <img src="paper.jpg" alt="包">
    <img src="scissors.jpg" alt="剪">
    <img src="rock.jpg" alt="揼">
    <h1>包剪揼多人對戰</h1>
  </div>
  <input id="playerName" placeholder="輸入你嘅名字">
  <input id="roomIdInput" placeholder="房號（開新房間就留空）">
  <button id="btnCreate">開新房間</button>
  <button id="btnJoin">加入房間</button>
</div>

<!-- 遊戲等候 + 出拳頁 -->
<div id="pageRoom" class="card" style="display:none">
  <!-- 房號 + 等候狀態 -->
  <div class="wait-info">
    <div>🏠 房號：<span class="room-number" id="showRoomId"></span></div>
    <div id="waitStatusText" style="margin-top:8px;"></div>
  </div>

  <p style="margin-bottom:16px">錄製完成自動上傳到Firebase，對方自動接收</p>

  <button id="recGame">🎙️ 錄包剪揼聲（大合唱）</button>
  <button id="recWin">🎙️ 錄勝利語音</button>

  <button id="btnReady">✅ 我準備好</button>
  <button id="btnLeave">🚪 離開房間</button>

  <div style="margin-top:20px">
    <h3 style="text-align:center;margin-bottom:10px">請選擇：包 / 剪 / 揼</h3>
    <div class="choice-row">
      <button id="selPaper" disabled>
        <img src="paper.jpg" alt="包">
      </button>
      <button id="selScissors" disabled>
        <img src="scissors.jpg" alt="剪">
      </button>
      <button id="selRock" disabled>
        <img src="rock.jpg" alt="揼">
      </button>
    </div>
    <div class="score">我分數:<span id="myScore">0</span> | 對手分數:<span id="oppScore">0</span></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
// Firebase 配置
const firebaseConfig = {
  apiKey: "AIzaSyBUI5N2IZO_2erP6nNHuWB-Q6T7Mrjl_m0",
  authDomain: "game-ad81e.firebaseapp.com",
  databaseURL: "https://game-ad81e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "game-ad81e",
  storageBucket: "game-ad81e.appspot.com",
  messagingSenderId: "732826720201",
  appId: "1:732826720201:web:xxxxxxxxxxxxxx"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let roomRef, playerRef, opponentRef;
let myName = "";
let roomId = "";
let isHost = false;
let myReady = false;
let oppReady = false;
let myHand = null;
let oppHand = null;
let myScore = 0;
let oppScore = 0;
let heartbeatTimer;
let myAudioWin = null;
let myAudioGame = null;

const debug = document.getElementById("debugLog");
const pageLobby = document.getElementById("pageLobby");
const pageRoom = document.getElementById("pageRoom");
const playerNameInp = document.getElementById("playerName");
const roomIdInp = document.getElementById("roomIdInput");
const btnCreate = document.getElementById("btnCreate");
const btnJoin = document.getElementById("btnJoin");
const btnReady = document.getElementById("btnReady");
const btnLeave = document.getElementById("btnLeave");
const selPaper = document.getElementById("selPaper");
const selScissors = document.getElementById("selScissors");
const selRock = document.getElementById("selRock");
const myScoreEl = document.getElementById("myScore");
const oppScoreEl = document.getElementById("oppScore");
const recGameBtn = document.getElementById("recGame");
const recWinBtn = document.getElementById("recWin");
const showRoomId = document.getElementById("showRoomId");
const waitStatusText = document.getElementById("waitStatusText");

function log(msg){
  const t = new Date().toLocaleTimeString();
  debug.textContent += `\n[${t}] ${msg}`;
  debug.scrollTop = debug.scrollHeight;
}

// 開新房間【重點：唔寫 guest:null】
btnCreate.onclick = async ()=>{
  myName = playerNameInp.value.trim();
  if(!myName){alert("請輸入名字");return}
  roomId = Math.floor(1000+Math.random()*9000).toString();
  isHost = true;
  log(`房主，建立房號 ${roomId}`);
  roomRef = db.ref(`rooms/${roomId}`);
  await roomRef.set({
    host:myName,
    round:"idle",
    p1:{ready:false,hand:null,audioGame:null,audioWin:null},
    p2:{ready:false,hand:null,audioGame:null,audioWin:null}
  });
  enterRoom();
}

// 加入房間【重點：檢查 guest 有冇存在】
btnJoin.onclick = async ()=>{
  myName = playerNameInp.value.trim();
  roomId = roomIdInp.value.trim();
  if(!myName || !roomId){alert("填寫名字+房號");return}
  isHost = false;
  roomRef = db.ref(`rooms/${roomId}`);
  const snap = await roomRef.once("value");
  const roomData = snap.val();
  // 判斷：房間唔存在 或者 guest 已經有玩家
  if(!roomData || roomData.guest){
    alert("房間滿或不存在");
    return;
  }
  await roomRef.child("guest").set(myName);
  enterRoom();
}

function enterRoom(){
  pageLobby.style.display = "none";
  pageRoom.style.display = "block";
  showRoomId.textContent = roomId;
  playerRef = isHost ? roomRef.child("p1") : roomRef.child("p2");
  opponentRef = isHost ? roomRef.child("p2") : roomRef.child("p1");
  log(`【開房】已清空本房舊音訊檔案`);
  heartbeatTimer = setInterval(()=>{
    playerRef.child("heartbeat").set(Date.now());
  },1500);
  log(`已註冊斷線監聽 + 心跳檢測`);

  roomRef.on("value",snap=>{
    const d = snap.val();
    if(!d)return;
    const p1 = d.p1||{};
    const p2 = d.p2||{};
    myReady = isHost ? p1.ready : p2.ready;
    oppReady = isHost ? p2.ready : p1.ready;
    btnReady.textContent = myReady ? "✅ 已準備" : "✅ 我準備好";

    // 等候區文字
    let hostName = d.host;
    let guestName = d.guest || "等待玩家加入...";
    let hostReady = p1.ready ? "✅已準備" : "❌未準備";
    let guestReady = p2.ready ? "✅已準備" : "❌未準備";
    waitStatusText.innerHTML =
`房主：${hostName} ${hostReady}<br>
玩家：${guestName} ${guestReady}`;

    if(myReady && oppReady && d.round==="idle"){
      selPaper.disabled = false;
      selScissors.disabled = false;
      selRock.disabled = false;
      log("雙方準備完成，可以出拳！");
    }
    const h1 = p1.hand;
    const h2 = p2.hand;
    if(h1 && h2 && d.round==="fight"){
      calcResult(h1,h2,d);
    }
    myScoreEl.textContent = isHost ? p1.score||0 : p2.score||0;
    oppScoreEl.textContent = isHost ? p2.score||0 : p1.score||0;
  })
}

selPaper.onclick = ()=>submitHand("paper");
selScissors.onclick = ()=>submitHand("scissors");
selRock.onclick = ()=>submitHand("rock");

async function submitHand(handStr){
  myHand = handStr;
  await playerRef.child("hand").set(handStr);
  await roomRef.child("round").set("fight");
  selPaper.disabled = true;
  selScissors.disabled = true;
  selRock.disabled = true;
  log(`我揀咗：${handStr}`);
}

function calcResult(h1,h2,roomData){
  let win = 0;
  if(h1===h2) win=0;
  else if(
    (h1==="paper" && h2==="rock") ||
    (h1==="rock" && h2==="scissors") ||
    (h1==="scissors" && h2==="paper")
  ) win=1;
  else win=2;
  log(`賽果：P1:${h1} VS P2:${h2} | winner=${win}`);
  let winnerAudio = null;
  if(win===1) winnerAudio = roomData.p1.audioWin;
  if(win===2) winnerAudio = roomData.p2.audioWin;
  if(win===0) winnerAudio = roomData.p1.audioGame;
  if(winnerAudio){
    const audio = new Audio(winnerAudio);
    audio.play().catch(e=>log("播放音頻失敗:"+e));
  }
  if(win===1){
    roomRef.child("p1/score").transaction(s=>(s||0)+1);
  }else if(win===2){
    roomRef.child("p2/score").transaction(s=>(s||0)+1);
  }
  setTimeout(async ()=>{
    await playerRef.update({hand:null,ready:false});
    await opponentRef.update({hand:null,ready:false});
    await roomRef.child("round").set("idle");
    log("回合重置，可以重新準備");
  },3500)
}

btnReady.onclick = async ()=>{
  await playerRef.child("ready").set(!myReady);
}

// 離開房間【重點：玩家離開時刪除guest欄位，唔寫null】
btnLeave.onclick = async ()=>{
  clearInterval(heartbeatTimer);
  roomRef.off();
  if(isHost){
    await roomRef.remove();
  }else{
    await roomRef.child("guest").remove();
  }
  pageRoom.style.display = "none";
  pageLobby.style.display = "block";
  log("離開房間");
}

let recorderGame,recorderWin;
let streamGame,streamWin;

recGameBtn.onclick = recordGameAudio;
recWinBtn.onclick = recordWinAudio;

async function recordGameAudio(){
  const btn = document.getElementById("recGame");
  btn.style.background="red";
  streamGame = await navigator.mediaDevices.getUserMedia({audio:true});
  recorderGame = new MediaRecorder(streamGame);
  let chunks=[];
  recorderGame.ondataavailable=e=>chunks.push(e.data);
  recorderGame.onstop = async ()=>{
    const blob = new Blob(chunks,{type:"audio/mp3"});
    const url = URL.createObjectURL(blob);
    await playerRef.child("audioGame").set(url);
    btn.style.background="#2b78e4";
    log("包剪揼錄音完成，已上傳");
    streamGame.getTracks().forEach(t=>t.stop());
  }
  recorderGame.start();
  setTimeout(()=>recorderGame.stop(),3000);
}
async function recordWinAudio(){
  const btn = document.getElementById("recWin");
  btn.style.background="red";
  streamWin = await navigator.mediaDevices.getUserMedia({audio:true});
  recorderWin = new MediaRecorder(streamWin);
  let chunks=[];
  recorderWin.ondataavailable=e=>chunks.push(e.data);
  recorderWin.onstop = async ()=>{
    const blob = new Blob(chunks,{type:"audio/mp3"});
    const url = URL.createObjectURL(blob);
    await playerRef.child("audioWin").set(url);
    btn.style.background="#2b78e4";
    log("勝利錄音完成，已上傳");
    streamWin.getTracks().forEach(t=>t.stop());
  }
  recorderWin.start();
  setTimeout(()=>recorderWin.stop(),3000);
}
</script>
</body>
</html>
