<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>包剪揼多人對戰</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;margin:0;padding:0}
body{background:#f3f4f6;padding:16px}
.debug{
  background:#000;
  color:#39ff14;
  padding:10px;
  border-radius:10px;
  margin-bottom:16px;
  font-size:12px;
  line-height:1.4;
  white-space:pre-wrap;
  word-break:break-all;
  position:sticky;
  top:0;
  z-index:999;
  max-height:180px;
  overflow-y:auto;
}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px #00000015;margin-bottom:16px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin:8px 0}
button{width:100%;padding:16px;border:none;border-radius:10px;font-size:18px;color:white;background:#2b78e4;margin:8px 0}
button:disabled{background:#999}
.choice-row{display:flex;gap:10px;width:100%}
.choice-row button{flex:1;padding:10px;margin:0;border-radius:10px}
.choice-row button img{width:100%;height:90px;object-fit:contain}
.wait-info{
  background:#eef6ff;
  padding:14px;
  border-radius:10px;
  text-align:center;
  font-size:17px;
  margin-bottom:16px;
}
.rule-box{
  background:#fff8dc;
  padding:12px;
  border-radius:10px;
  margin-bottom:16px;
  font-size:15px;
  line-height:1.5;
}
.mode-box{
  background:#e8f4ff;
  padding:12px;
  border-radius:10px;
  margin-bottom:16px;
}
.room-number{
  font-size:22px;
  font-weight:bold;
  color:#d02828;
}
.audio-row{
  display:flex;
  gap:8px;
}
.audio-row button{
  flex:1;
  font-size:15px;
  padding:12px;
}
.win-banner{
  background:#22bb22;
  color:white;
  font-size:22px;
  font-weight:bold;
  text-align:center;
  padding:16px;
  border-radius:12px;
  margin:12px 0;
}
</style>
</head>
<body>
<div class="debug" id="debugLog">版本 v5.0 | 新增4種勝負模式 | 4條遊戲規則 | 修復重複播放 | Base64音頻傳輸 | Firebase</div>

<img id="imgRock" src="rock.jpg" style="display:none">
<img id="imgScissors" src="scissors.jpg" style="display:none">
<img id="imgPaper" src="paper.jpg" style="display:none">

<div id="pageLobby" class="card">
  <div class="title-row" style="display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
    <img src="paper.jpg" alt="包" style="width:44px;height:44px;object-fit:contain">
    <img src="scissors.jpg" alt="剪" style="width:44px;height:44px;object-fit:contain">
    <img src="rock.jpg" alt="揼" style="width:44px;height:44px;object-fit:contain">
    <h1>包剪揼多人對戰</h1>
  </div>
  <input id="playerName" placeholder="輸入你嘅名字">
  <div class="mode-box">
    <b>🎮 選擇勝利模式（房主設定）</b>
    <select id="gameModeSel" style="width:100%;padding:10px;margin-top:8px;font-size:16px">
      <option value="oneRound">一鋪定勝負</option>
      <option value="win2">贏兩鋪</option>
      <option value="win3">贏三鋪</option>
      <option value="consec2">連贏兩鋪</option>
    </select>
  </div>
  <input id="roomIdInput" placeholder="房號（開新房間就留空）">
  <button id="btnCreate">開新房間</button>
  <button id="btnJoin">加入房間</button>
</div>

<div id="pageRoom" class="card" style="display:none">
  <div class="wait-info">
    <div>🏠 房號：<span class="room-number" id="showRoomId"></span></div>
    <div>📌 對戰模式：<span id="modeText"></span></div>
    <div id="waitStatusText" style="margin-top:8px;"></div>
  </div>

  <div class="rule-box">
    <b>📜 遊戲規則：</b>
    <div>1. 包（布）贏揼（石頭）</div>
    <div>2. 揼（石頭）贏剪（剪刀）</div>
    <div>3. 剪（剪刀）贏包（布）</div>
    <div>4. 雙方出一樣就和局，唔計分</div>
  </div>
  <div id="finalWinBanner" class="win-banner" style="display:none"></div>

  <p style="margin-bottom:12px">錄製完成自動上傳到Firebase，對方自動接收</p>

  <button id="recGame">🎙️ 錄包剪揼聲（大合唱）</button>
  <button id="previewGame" disabled>🔊 試聽大合唱</button>

  <button id="recWin">🎙️ 錄勝利語音</button>
  <button id="previewWin" disabled>🔊 試聽勝利語音</button>

  <button id="btnReady">✅ 我準備好</button>
  <button id="btnLeave">🚪 離開房間</button>

  <div style="margin-top:20px">
    <h3 style="text-align:center;margin-bottom:10px">請選擇：包 / 剪 / 揼</h3>
    <div class="choice-row">
      <button id="selPaper" disabled>
        <img src="paper.jpg" alt="包">
      </button>
      <button id="selScissors" disabled>
        <img src="scissors.jpg" alt="剪">
      </button>
      <button id="selRock" disabled>
        <img src="rock.jpg" alt="揼">
      </button>
    </div>
    <div class="score" style="text-align:center;margin-top:12px;font-size:20px;font-weight:bold">
      我分數:<span id="myScore">0</span> | 對手分數:<span id="oppScore">0</span>
      <div style="font-size:16px;margin-top:4px">連勝：<span id="streak">0</span></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBUI5N2IZO_2erP6nNHuWB-Q6T7Mrjl_m0",
  authDomain: "game-ad81e.firebaseapp.com",
  databaseURL: "https://game-ad81e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "game-ad81e",
  storageBucket: "game-ad81e.appspot.com",
  messagingSenderId: "732826720201",
  appId: "1:732826720201:web:xxxxxxxxxxxxxx"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let roomRef, playerRef, opponentRef;
let myName = "";
let roomId = "";
let isHost = false;
let myReady = false;
let oppReady = false;
let myHand = null;
let oppHand = null;
let myScore = 0;
let oppScore = 0;
let currentStreak = 0;
let streakOwner = null;
let heartbeatTimer;
let roundProcessed = false;
let gameOver = false;
let gameMode = "oneRound";

let localAudioGameBlob = null;
let localAudioWinBlob = null;
let remoteAudioGame = null;
let remoteAudioWin = null;

const debug = document.getElementById("debugLog");
const pageLobby = document.getElementById("pageLobby");
const pageRoom = document.getElementById("pageRoom");
const playerNameInp = document.getElementById("playerName");
const roomIdInp = document.getElementById("roomIdInput");
const btnCreate = document.getElementById("btnCreate");
const btnJoin = document.getElementById("btnJoin");
const btnReady = document.getElementById("btnReady");
const btnLeave = document.getElementById("btnLeave");
const selPaper = document.getElementById("selPaper");
const selScissors = document.getElementById("selScissors");
const selRock = document.getElementById("selRock");
const myScoreEl = document.getElementById("myScore");
const oppScoreEl = document.getElementById("oppScore");
const streakEl = document.getElementById("streak");
const recGameBtn = document.getElementById("recGame");
const recWinBtn = document.getElementById("recWin");
const previewGameBtn = document.getElementById("previewGame");
const previewWinBtn = document.getElementById("previewWin");
const showRoomId = document.getElementById("showRoomId");
const waitStatusText = document.getElementById("waitStatusText");
const gameModeSel = document.getElementById("gameModeSel");
const modeText = document.getElementById("modeText");
const finalWinBanner = document.getElementById("finalWinBanner");

function log(msg){
  const t = new Date().toLocaleTimeString();
  debug.textContent += `\n[${t}] ${msg}`;
  debug.scrollTop = debug.scrollHeight;
}

function getModeName(modeKey){
  switch(modeKey){
    case "oneRound": return "一鋪定勝負";
    case "win2": return "贏兩鋪";
    case "win3": return "贏三鋪";
    case "consec2": return "連贏兩鋪";
    default: return modeKey;
  }
}

// Blob 轉 Base64
function blobToBase64(blob) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  });
}
// Base64 轉翻 Audio
async function base64ToAudio(base64Str){
  const res = await fetch(base64Str);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}

btnCreate.onclick = async ()=>{
  myName = playerNameInp.value.trim();
  gameMode = gameModeSel.value;
  if(!myName){alert("請輸入名字");return}
  roomId = Math.floor(1000+Math.random()*9000).toString();
  isHost = true;
  log(`房主，建立房號 ${roomId}，模式：${getModeName(gameMode)}`);
  roomRef = db.ref(`rooms/${roomId}`);
  await roomRef.set({
    host:myName,
    mode:gameMode,
    round:"idle",
    gameOver:false,
    streak:{count:0,owner:null},
    p1:{ready:false,hand:null,audioGameB64:null,audioWinB64:null,score:0},
    p2:{ready:false,hand:null,audioGameB64:null,audioWinB64:null,score:0}
  });
  enterRoom();
}

btnJoin.onclick = async ()=>{
  myName = playerNameInp.value.trim();
  roomId = roomIdInp.value.trim();
  if(!myName || !roomId){alert("填寫名字+房號");return}
  isHost = false;
  roomRef = db.ref(`rooms/${roomId}`);
  const snap = await roomRef.once("value");
  const roomData = snap.val();
  if(!roomData || roomData.guest){
    alert("房間滿或不存在");
    return;
  }
  await roomRef.child("guest").set(myName);
  enterRoom();
}

function enterRoom(){
  pageLobby.style.display = "none";
  pageRoom.style.display = "block";
  showRoomId.textContent = roomId;
  playerRef = isHost ? roomRef.child("p1") : roomRef.child("p2");
  opponentRef = isHost ? roomRef.child("p2") : roomRef.child("p1");
  log(`【開房】已清空本房舊音訊`);
  heartbeatTimer = setInterval(()=>{
    playerRef.child("heartbeat").set(Date.now());
  },1500);
  log(`已註冊斷線監聽 + 心跳檢測`);

  roomRef.on("value",async snap=>{
    const d = snap.val();
    if(!d)return;
    const p1 = d.p1||{};
    const p2 = d.p2||{};
    gameMode = d.mode;
    gameOver = d.gameOver === true;
    currentStreak = d.streak?.count||0;
    streakOwner = d.streak?.owner;
    modeText.textContent = getModeName(gameMode);
    streakEl.textContent = currentStreak;
    finalWinBanner.style.display = "none";

    myReady = isHost ? p1.ready : p2.ready;
    oppReady = isHost ? p2.ready : p1.ready;
    btnReady.textContent = myReady ? "✅ 已準備" : "✅ 我準備好";

    let hostName = d.host;
    let guestName = d.guest || "等待玩家加入...";
    let hostReady = p1.ready ? "✅已準備" : "❌未準備";
    let guestReady = p2.ready ? "✅已準備" : "❌未準備";
    waitStatusText.innerHTML =
`房主：${hostName} ${hostReady}<br>
玩家：${guestName} ${guestReady}`;

    if(gameOver){
      selPaper.disabled = true;
      selScissors.disabled = true;
      selRock.disabled = true;
    }else if(myReady && oppReady && d.round==="idle"){
      selPaper.disabled = false;
      selScissors.disabled = false;
      selRock.disabled = false;
      roundProcessed = false;
      log("雙方準備完成，可以出拳！");
    }else{
      selPaper.disabled = true;
      selScissors.disabled = true;
      selRock.disabled = true;
    }

    const oppAudioGameB64 = isHost ? p2.audioGameB64 : p1.audioGameB64;
    const oppAudioWinB64 = isHost ? p2.audioWinB64 : p1.audioWinB64;
    if(oppAudioGameB64 && oppAudioGameB64 !== remoteAudioGame){
      remoteAudioGame = oppAudioGameB64;
      log("✅收到對方【大合唱】錄音");
    }
    if(oppAudioWinB64 && oppAudioWinB64 !== remoteAudioWin){
      remoteAudioWin = oppAudioWinB64;
      log("✅收到對方【勝利語音】錄音");
    }

    const h1 = p1.hand;
    const h2 = p2.hand;
    if(h1 && h2 && d.round==="fight" && !roundProcessed && !gameOver){
      roundProcessed = true;
      calcResult(h1,h2,d);
    }
    myScoreEl.textContent = isHost ? p1.score||0 : p2.score||0;
    oppScoreEl.textContent = isHost ? p2.score||0 : p1.score||0;
  })
}

selPaper.onclick = ()=>submitHand("paper");
selScissors.onclick = ()=>submitHand("scissors");
selRock.onclick = ()=>submitHand("rock");

async function submitHand(handStr){
  if(gameOver)return;
  myHand = handStr;
  await playerRef.child("hand").set(handStr);
  await roomRef.child("round").set("fight");
  selPaper.disabled = true;
  selScissors.disabled = true;
  selRock.disabled = true;
  log(`我揀咗：${handStr}`);
}

async function calcResult(h1,h2,roomData){
  let win = 0;
  if(h1===h2) win=0;
  else if(
    (h1==="paper" && h2==="rock") ||
    (h1==="rock" && h2==="scissors") ||
    (h1==="scissors" && h2==="paper")
  ) win=1;
  else win=2;
  log(`賽果：P1:${h1} VS P2:${h2} | winner=${win}`);

  let winnerB64 = null;
  if(win===1) winnerB64 = roomData.p1.audioWinB64;
  if(win===2) winnerB64 = roomData.p2.audioWinB64;
  if(win===0) winnerB64 = roomData.p1.audioGameB64;

  if(winnerB64){
    const audioUrl = await base64ToAudio(winnerB64);
    const audio = new Audio(audioUrl);
    audio.play().catch(e=>log("播放音頻失敗:"+e));
  }

  let newP1Score = roomData.p1.score||0;
  let newP2Score = roomData.p2.score||0;
  let newStreakCount = 0;
  let newStreakOwner = null;

  if(win === 1){
    newP1Score += 1;
    newStreakCount = (roomData.streak?.owner === "p1") ? (roomData.streak.count+1) : 1;
    newStreakOwner = "p1";
  }else if(win ===2){
    newP2Score +=1;
    newStreakCount = (roomData.streak?.owner === "p2") ? (roomData.streak.count+1) :1;
    newStreakOwner = "p2";
  }else{
    newStreakCount = 0;
    newStreakOwner = null;
  }

  await roomRef.update({
    "p1/score":newP1Score,
    "p2/score":newP2Score,
    "streak/count":newStreakCount,
    "streak/owner":newStreakOwner
  });

  // 檢查總局勝利條件
  let matchWinner = null;
  switch(roomData.mode){
    case "oneRound":
      if(win!==0) matchWinner = win===1 ? roomData.host : roomData.guest;
      break;
    case "win2":
      if(newP1Score >=2) matchWinner = roomData.host;
      if(newP2Score >=2) matchWinner = roomData.guest;
      break;
    case "win3":
      if(newP1Score >=3) matchWinner = roomData.host;
      if(newP2Score >=3) matchWinner = roomData.guest;
      break;
    case "consec2":
      if(newStreakCount >=2){
        matchWinner = newStreakOwner==="p1" ? roomData.host : roomData.guest;
      }
      break;
  }

  if(matchWinner){
    log(`🏆 總對戰完結！勝者：${matchWinner}`);
    await roomRef.update({gameOver:true});
    finalWinBanner.textContent = `🏆 ${matchWinner} 贏咗成場對戰！`;
    finalWinBanner.style.display = "block";
  }

  setTimeout(async ()=>{
    if(!gameOver){
      await playerRef.update({hand:null,ready:false});
      await opponentRef.update({hand:null,ready:false});
      await roomRef.child("round").set("idle");
      log("回合重置，可以重新準備");
    }
  },3500)
}

btnReady.onclick = async ()=>{
  if(gameOver)return;
  await playerRef.child("ready").set(!myReady);
}

btnLeave.onclick = async ()=>{
  clearInterval(heartbeatTimer);
  roomRef.off();
  if(isHost){
    await roomRef.remove();
  }else{
    await roomRef.child("guest").remove();
  }
  pageRoom.style.display = "none";
  pageLobby.style.display = "block";
  log("離開房間");
}

let recorderGame,recorderWin;
let streamGame,streamWin;

recGameBtn.onclick = recordGameAudio;
recWinBtn.onclick = recordWinAudio;
previewGameBtn.onclick = playPreviewGame;
previewWinBtn.onclick = playPreviewWin;

async function recordGameAudio(){
  const btn = recGameBtn;
  btn.style.background="red";
  streamGame = await navigator.mediaDevices.getUserMedia({audio:true});
  recorderGame = new MediaRecorder(streamGame);
  let chunks=[];
  recorderGame.ondataavailable=e=>chunks.push(e.data);
  recorderGame.onstop = async ()=>{
    const blob = new Blob(chunks,{type:"audio/webm"});
    localAudioGameBlob = blob;
    const b64 = await blobToBase64(blob);
    await playerRef.child("audioGameB64").set(b64);
    previewGameBtn.disabled = false;
    btn.style.background="#2b78e4";
    log("包剪揼錄音完成，Base64上傳Firebase，可試聽");
    streamGame.getTracks().forEach(t=>t.stop());
  }
  recorderGame.start();
  setTimeout(()=>recorderGame.stop(),3000);
}
async function recordWinAudio(){
  const btn = recWinBtn;
  btn.style.background="red";
  streamWin = await navigator.mediaDevices.getUserMedia({audio:true});
  recorderWin = new MediaRecorder(streamWin);
  let chunks=[];
  recorderWin.ondataavailable=e=>chunks.push(e.data);
  recorderWin.onstop = async ()=>{
    const blob = new Blob(chunks,{type:"audio/webm"});
    localAudioWinBlob = blob;
    const b64 = await blobToBase64(blob);
    await playerRef.child("audioWinB64").set(b64);
    previewWinBtn.disabled = false;
    btn.style.background="#2b78e4";
    log("勝利錄音完成，Base64上傳Firebase，可試聽");
    streamWin.getTracks().forEach(t=>t.stop());
  }
  recorderWin.start();
  setTimeout(()=>recorderWin.stop(),3000);
}

function playPreviewGame(){
  if(!localAudioGameBlob)return;
  const audUrl = URL.createObjectURL(localAudioGameBlob);
  const aud = new Audio(audUrl);
  aud.play().catch(e=>log("試聽大合唱失敗："+e));
}
function playPreviewWin(){
  if(!localAudioWinBlob)return;
  const audUrl = URL.createObjectURL(localAudioGameBlob);
  const aud = new Audio(audUrl);
  aud.play().catch(e=>log("試聽勝利語音失敗："+e));
}
</script>
</body>
</html>
