<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>包剪揼大合唱</title>
    <style>
        /* ================= 基礎樣式與全螢幕背景 ================= */
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: Arial, sans-serif; 
            overflow: hidden; 
            background-color: #333;
        }
        .page { 
            display: none; width: 100%; height: 100%; 
            position: absolute; top: 0; left: 0; 
            background-size: cover; background-position: center; background-repeat: no-repeat; 
            box-sizing: border-box; padding: 20px; 
        }
        .page.active { 
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
        }
        
        /* 頁面背景圖設定 */
        #page1 { background-image: url('background01.jpg'); }
        #page2 { background-image: url('background02.jpg'); }
        #page3 { background-image: url('background03.jpg'); }
        #page4 { background-image: url('background04.jpg'); }
        #page5 { background-image: url('background05.jpg'); }

        /* ================= UI 元件樣式 ================= */
        .panel { 
            background: rgba(255, 255, 255, 0.9); 
            padding: 20px; border-radius: 15px; 
            width: 90%; max-width: 400px; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
            max-height: 90vh; overflow-y: auto;
        }
        input, button, select { 
            width: 100%; padding: 12px; margin: 8px 0; 
            border-radius: 8px; border: 1px solid #ccc; 
            box-sizing: border-box; font-size: 16px; 
        }
        button { 
            background: #007bff; color: white; 
            border: none; cursor: pointer; font-weight: bold; 
            transition: background 0.2s;
        }
        button:active { background: #0056b3; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        .btn-danger { background: #dc3545; }
        .btn-success { background: #28a745; }
        .btn-success:active { background: #1e7e34; }
        
        /* ================= 遊戲頁面專用 ================= */
        #player-list, #resultList { list-style: none; padding: 0; margin: 0; text-align: left; max-height: 180px; overflow-y: auto; }
        #player-list li, #resultList li { padding: 8px 0; border-bottom: 1px solid #ddd; font-size: 16px; }
        
        /* 出拳按鈕 */
        .rps-buttons { display: flex; justify-content: space-around; margin-top: 20px; }
        .rps-buttons img { 
            width: 80px; height: 80px; object-fit: contain; 
            cursor: pointer; border-radius: 50%; transition: transform 0.1s; 
            border: 4px solid transparent; background: rgba(255,255,255,0.5); padding: 5px;
        }
        .rps-buttons img:active { transform: scale(0.9); }
        .rps-buttons img.selected { border-color: gold; box-shadow: 0 0 15px gold; }

        /* 隱藏元素 */
        .hidden { display: none !important; }
        
        /* 倒數計時器 */
        #countdown { font-size: 60px; color: #dc3545; margin: 10px 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    </style>
    
    <!-- 引入 Firebase SDK (v9 compat 版本，適合直接寫在 HTML) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- ================= 第一頁：大廳 ================= -->
    <div id="page1" class="page active">
        <div class="panel">
            <h2>✊✌️✋ 包剪揼大合唱</h2>
            <input type="text" id="playerName" placeholder="輸入你的名字 (最多10字)" maxlength="10">
            <button class="btn-success" onclick="createRoom()">建立房間 (成為房主)</button>
            <hr style="margin: 20px 0; border: 1px solid #ddd;">
            <input type="text" id="roomCodeInput" placeholder="輸入4位數字房間號碼" maxlength="4" inputmode="numeric">
            <button onclick="joinRoom()">加入房間 (成為房客)</button>
        </div>
    </div>

    <!-- ================= 第二頁：等待大廳與錄音 ================= -->
    <div id="page2" class="page">
        <div class="panel">
            <h2>房間號碼: <span id="displayRoomCode" style="color: #dc3545; font-size: 32px;"></span></h2>
            
            <h3>玩家列表 (上限8人)</h3>
            <ul id="player-list"></ul>
            
            <hr style="margin: 15px 0; border: 1px solid #ddd;">
            <h3>🎤 錄製你的專屬音效</h3>
            
            <div style="margin-bottom: 15px;">
                <p style="margin: 5px 0; font-weight: bold;">1. 包剪揼音效 (強制3秒)</p>
                <button id="btnRecordRPS" onclick="startRecording('rps')">開始錄音</button>
                <audio id="audioRPS" controls class="hidden" style="width: 100%; margin-top: 5px;"></audio>
            </div>
            
            <div style="margin-bottom: 15px;">
                <p style="margin: 5px 0; font-weight: bold;">2. 勝利宣言 (強制3秒)</p>
                <button id="btnRecordVictory" onclick="startRecording('victory')">開始錄音</button>
                <audio id="audioVictory" controls class="hidden" style="width: 100%; margin-top: 5px;"></audio>
            </div>
            
            <hr style="margin: 15px 0; border: 1px solid #ddd;">
            
            <!-- 只有房主睇得到 -->
            <div id="hostControls" class="hidden">
                <h3>房主設定</h3>
                <label>遊戲模式：</label>
                <select id="gameMode">
                    <option value="1">一鋪定勝負</option>
                    <option value="2">贏兩鋪</option>
                    <option value="3">贏三鋪</option>
                    <option value="streak2">連贏兩鋪</option>
                </select>
                <button class="btn-danger" onclick="startGame()" style="margin-top: 15px;">🚀 開始遊戲</button>
            </div>
            <p id="waitingMsg" class="hidden" style="color: #007bff; font-weight: bold;">等待房主開始遊戲...</p>
        </div>
    </div>

    <!-- ================= 第三頁：遊戲出拳頁面 ================= -->
    <div id="page3" class="page">
        <div class="panel">
            <h3 style="margin-top: 0;">模式: <span id="displayGameMode" style="color: #007bff;"></span></h3>
            <div style="font-size: 14px; margin-bottom: 10px; background: #eee; padding: 10px; border-radius: 8px;">
                分數：<br><span id="scoreBoard">無</span>
            </div>
            <h3>請出拳！</h3>
            <div class="rps-buttons">
                <img src="paper.jpg" onclick="makeChoice('paper')" id="btn-paper" alt="包">
                <!-- 已修正為 scissors.jpg -->
                <img src="scissors.jpg" onclick="makeChoice('scissors')" id="btn-scissors" alt="剪">
                <img src="rock.jpg" onclick="makeChoice('rock')" id="btn-rock" alt="揼">
            </div>
            <p id="statusText" style="margin-top: 20px; font-weight: bold; color: #dc3545; min-height: 24px;"></p>
        </div>
    </div>

    <!-- ================= 第四頁：結算與大合唱 ================= -->
    <div id="page4" class="page">
        <div class="panel">
            <h2 style="margin-top: 0;">📢 本回合結果</h2>
            <ul id="resultList"></ul>
            <div id="countdown">3</div>
            <p style="color: #666;">準備進入下一輪...</p>
        </div>
    </div>

    <!-- ================= 第五頁：最終勝利 ================= -->
    <div id="page5" class="page">
        <div class="panel">
            <h1 style="margin-top: 0;">🏆 最終勝利者 🏆</h1>
            <h2 id="winnerName" style="color: #d4af37; font-size: 36px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);"></h2>
            <p>正在播放勝利宣言...</p>
            <button onclick="location.reload()" style="margin-top: 20px;">回到首頁</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. Firebase 初始化 (⚠️ 請替換成你的設定)
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // 初始化 Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // ==========================================
        // 2. 全局變數
        // ==========================================
        let myName = "";
        let roomCode = "";
        let isHost = false;
        let playersData = {};
        let currentGameMode = "1";
        let currentScores = {};
        let currentStreak = {};
        let roomListener = null; // 用於取消監聽

        // ==========================================
        // 3. 第一頁：房間邏輯
        // ==========================================
        function createRoom() {
            myName = document.getElementById('playerName').value.trim();
            if (!myName) return alert("請輸入名字");
            
            // 生成 4 位數房間號
            roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            isHost = true;
            
            // 初始化房間資料
            db.ref('rooms/' + roomCode).set({
                status: 'waiting',
                mode: '1',
                host: myName,
                players: { 
                    [myName]: { ready: false, rpsAudio: null, victoryAudio: null } 
                }
            }).then(() => {
                enterRoom();
            }).catch(err => alert("建立房間失敗: " + err.message));
        }

        function joinRoom() {
            myName = document.getElementById('playerName').value.trim();
            roomCode = document.getElementById('roomCodeInput').value.trim();
            if (!myName || roomCode.length !== 4) return alert("請輸入名字及4位數字房間號碼");
            
            const roomRef = db.ref('rooms/' + roomCode);
            roomRef.once('value').then(snapshot => {
                if (!snapshot.exists()) return alert("房間不存在");
                const data = snapshot.val();
                if (data.status !== 'waiting') return alert("遊戲已經開始或房間已關閉");
                if (Object.keys(data.players || {}).length >= 8) return alert("房間已滿 (上限8人)");
                
                // 加入房間
                roomRef.child('players/' + myName).set({
                    ready: false, rpsAudio: null, victoryAudio: null
                }).then(() => {
                    enterRoom();
                });
            });
        }

        function enterRoom() {
            document.getElementById('page1').classList.remove('active');
            document.getElementById('page2').classList.add('active');
            document.getElementById('displayRoomCode').innerText = roomCode;
            
            if (isHost) {
                document.getElementById('hostControls').classList.remove('hidden');
            } else {
                document.getElementById('waitingMsg').classList.remove('hidden');
            }
            
            // 監聽整個房間的資料變化
            roomListener = db.ref('rooms/' + roomCode).on('value', snapshot => {
                const data = snapshot.val();
                if (!data) return; // 房間被刪除
                
                playersData = data.players || {};
                updatePlayerList();
                
                // 同步房主的遊戲模式選擇
                if (isHost === false && data.mode) {
                    // 房客不需要顯示 select，但可以記錄
                }

                // 判斷遊戲是否開始
                if (data.status === 'playing' && !document.getElementById('page3').classList.contains('active')) {
                    currentGameMode = data.mode;
                    currentScores = data.scores || {};
                    currentStreak = data.streak || {};
                    
                    document.getElementById('displayGameMode').innerText = getModeText(currentGameMode);
                    updateScoreBoard();
                    
                    document.getElementById('page2').classList.remove('active');
                    document.getElementById('page3').classList.add('active');
                }
            });
        }

        function updatePlayerList() {
            const ul = document.getElementById('player-list');
            ul.innerHTML = '';
            for (let p in playersData) {
                let isMe = (p === myName) ? "(你)" : "";
                let status = playersData[p].ready ? "✅ 已準備" : "⏳ 未準備";
                ul.innerHTML += `<li>👤 ${p} ${isMe} - ${status}</li>`;
            }
        }

        // ==========================================
        // 4. 錄音邏輯 (強制 3 秒)
        // ==========================================
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        
        async function startRecording(type) {
            if (isRecording) return;
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                isRecording = true;

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    isRecording = false;
                    // 將音訊轉為 Base64 (為了方便直接存 Firebase Database)
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        const base64Audio = reader.result;
                        
                        // 上傳到 Firebase
                        db.ref(`rooms/${roomCode}/players/${myName}/${type}Audio`).set(base64Audio);
                        
                        // 顯示試聽播放器
                        const audioEl = document.getElementById(type === 'rps' ? 'audioRPS' : 'audioVictory');
                        audioEl.src = base64Audio;
                        audioEl.classList.remove('hidden');
                        
                        checkReadyStatus();
                    };
                };

                // 開始錄音
                mediaRecorder.start();
                const btn = document.getElementById(type === 'rps' ? 'btnRecordRPS' : 'btnRecordVictory');
                let timeLeft = 3;
                btn.innerText = `錄音中... ${timeLeft}s`;
                btn.disabled = true;

                // 3秒倒數
                const timer = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        btn.innerText = `錄音中... ${timeLeft}s`;
                    } else {
                        clearInterval(timer);
                        mediaRecorder.stop();
                        btn.innerText = "重新錄音";
                        btn.disabled = false;
                        // 關閉麥克風
                        stream.getTracks().forEach(track => track.stop());
                    }
                }, 1000);

            } catch (err) {
                alert("無法錄音，請確認瀏覽器已允許麥克風權限！");
                console.error(err);
            }
        }

        function checkReadyStatus() {
            const p = playersData[myName];
            if (p && p.rpsAudio && p.victoryAudio) {
                db.ref(`rooms/${roomCode}/players/${myName}/ready`).set(true);
            }
        }

        // ==========================================
        // 5. 房主開始遊戲
        // ==========================================
        function startGame() {
            const mode = document.getElementById('gameMode').value;
            
            // 檢查是否所有人都準備好
            for (let p in playersData) {
                if (!playersData[p].ready) return alert(`玩家 ${p} 尚未準備好！`);
            }
            
            // 初始化分數與連勝紀錄
            let initScores = {};
            let initStreak = {};
            for (let p in playersData) { 
                initScores[p] = 0; 
                initStreak[p] = 0; 
            }

            db.ref('rooms/' + roomCode).update({
                status: 'playing',
                mode: mode,
                scores: initScores,
                streak: initStreak,
                choices: null // 清空出拳紀錄
            });
        }

        function getModeText(mode) {
            if (mode === '1') return "一鋪定勝負";
            if (mode === '2') return "贏兩鋪";
            if (mode === '3') return "贏三鋪";
            if (mode === 'streak2') return "連贏兩鋪";
        }

        // ==========================================
        // 6. 第三頁：出拳邏輯
        // ==========================================
        function updateScoreBoard() {
            let str = Object.keys(currentScores).map(p => `${p}: ${currentScores[p]}分`).join(' | ');
            document.getElementById('scoreBoard').innerText = str;
        }

        function makeChoice(choice) {
            // UI 鎖定
            document.querySelectorAll('.rps-buttons img').forEach(img => img.classList.remove('selected'));
            document.getElementById('btn-' + choice).classList.add('selected');
            document.getElementById('statusText').innerText = "等待其他玩家出拳...";
            
            // 寫入 Firebase
            db.ref(`rooms/${roomCode}/choices/${myName}`).set(choice).then(() => {
                // 檢查是否所有人已出拳
                db.ref(`rooms/${roomCode}/choices`).once('value', snapshot => {
                    const choices = snapshot.val();
                    if (Object.keys(choices).length === Object.keys(playersData).length) {
                        // 所有人已出拳，房主觸發計算
                        if (isHost) {
                            db.ref(`rooms/${roomCode}/status`).set('calculating');
                        }
                    }
                });
            });
        }

        // 監聽遊戲狀態變化 (所有手機都會監聽並各自運算)
        db.ref('rooms/').on('child_changed', snapshot => {
            const room = snapshot.val();
            if (!room || room.status === undefined) return;
            
            // 只處理自己房間的變化
            if (snapshot.key !== roomCode) return;

            if (room.status === 'calculating') {
                calculateResults(room);
            } else if (room.status === 'playing' && document.getElementById('page4').classList.contains('active')) {
                // 結算完畢，回到第三頁進行下一輪
                document.getElementById('page4').classList.remove('active');
                document.getElementById('page3').classList.add('active');
                document.getElementById('statusText').innerText = "";
                document.querySelectorAll('.rps-buttons img').forEach(img => img.classList.remove('selected'));
                
                currentScores = room.scores;
                updateScoreBoard();
            }
        });

        // ==========================================
        // 7. 第四頁：結算與大合唱
        // ==========================================
        function calculateResults(room) {
            const choices = room.choices;
            const players = Object.keys(choices);
            // 包剪揼相剋表
            const rpsBeats = { 'rock': 'scissors', 'scissors': 'paper', 'paper': 'rock' };
            
            // 【大合唱】所有音訊疊加同時播放
            players.forEach(p => {
                if (room.players[p].rpsAudio) {
                    const audio = new Audio(room.players[p].rpsAudio);
                    audio.volume = 0.8;
                    audio.play().catch(e => console.log("音訊播放被瀏覽器阻擋", e));
                }
            });

            // 判斷勝負 (各自手機本地運算)
            let roundWinners = [];
            let roundLosers = [];
            let uniqueChoices = [...new Set(playe
