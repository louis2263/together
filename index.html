<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V30 同房再戰版</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:10px}
.verBadge{position:fixed;top:0;left:0;right:0;background:linear-gradient(90deg,#FFEB00,#00FF88);color:#000;text-align:center;padding:6px;font-weight:900;font-size:14px;z-index:9999}
.verTag{position:fixed;top:38px;right:8px;background:#FFEB00;color:#000;padding:4px 10px;border-radius:99px;font-weight:900;font-size:11px;z-index:9999}
.card{width:96%;max-width:500px;background:#1a1a1a;border:1px solid #333;border-radius:18px;padding:12px;margin-top:48px}
.btn{padding:13px;border-radius:99px;border:0;font-weight:900;cursor:pointer}.btnY{background:#FFEB00;color:#000;width:100%;margin-top:8px}.btnG{background:#00FF88;color:#000;width:100%;margin-top:8px}
.btnDark{background:#222;color:#fff;width:100%;margin-top:8px;border:1px solid #444}
.item{padding:10px;background:#151515;border:2px solid #222;border-radius:12px;margin-top:6px;display:flex;justify-content:space-between}.item.ok{border-color:#00FF88;background:#0e2018}
.log{font-size:12px;color:#FFEB00;background:#222;border-radius:8px;padding:8px;margin-top:8px;text-align:center}.code{font-size:32px;font-weight:900;letter-spacing:6px;color:#00FF88;text-align:center}
.choiceBtn{flex:1;padding:8px;border-radius:16px;border:3px solid #333;background:#fff;color:#000;font-weight:900;display:flex;flex-direction:column;align-items:center}.choiceBtn img{width:70px;height:70px}.choiceBtn.sel{border-color:#FFEB00;box-shadow:0 0 10px #FFEB00}
.progress{width:100%;height:14px;background:#333;border-radius:99px;margin-top:8px;overflow:hidden}.bar{height:100%;width:0%;background:linear-gradient(90deg,#FFEB00,#00FF88)}
.footerVer{margin-top:20px;color:#555;font-size:10px;text-align:center}
</style>
</head><body>
<div class="verBadge">方包包包剪揼 V30 - 同房再戰版 - 2026/05/13</div>
<div class="verTag">V30</div>

<div class="card">
<b>1. 輸入名字登入房間 [V30]</b>
<div style="display:flex;gap:6px;margin-top:8px">
<input id="nameInput" value="Louis" style="flex:1;padding:12px;border-radius:99px;border:2px solid #444;background:#000;color:#fff">
<button class="btn" style="background:#FFEB00;color:#000;flex:1" onclick="createRoom()">開房</button>
<input id="codeInput" placeholder="房號" style="width:80px;padding:12px;border-radius:99px;border:2px solid #444;background:#000;color:#fff">
<button class="btn" style="background:#00FF88;color:#000;flex:1" onclick="joinRoom()">入房</button>
</div>
<div class="code" id="roomCode">----</div>
<div id="logRoom" class="log">[V30] 未入房</div>
<div id="playerList"></div>
<button id="startBtn" class="btn btnY" style="display:none">🎤 房主按：一齊開始 [V30]</button>
<div id="count" class="log" style="display:none;font-size:18px;background:#FFEB00;color:#000"></div>
</div>

<div class="card" id="gameCard" style="display:none">
<b>🎤 V30 包剪揼！放聲中快揀！</b>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="soundLog" class="log">[V30] 🔊 準備播放...</div>
<div style="display:flex;gap:8px;margin-top:10px">
<button class="choiceBtn" id="btnChui" onclick="choose('揼')"><img src="https://raw.githubusercontent.com/louis2263/together/main/Rock.jpg"><span>揼</span></button>
<button class="choiceBtn" id="btnJian" onclick="choose('剪')"><img src="https://raw.githubusercontent.com/louis2263/together/main/scissors.jpg"><span>剪</span></button>
<button class="choiceBtn" id="btnBao" onclick="choose('包')"><img src="https://raw.githubusercontent.com/louis2263/together/main/paper.jpg"><span>包</span></button>
</div>
<div id="choiceLog" class="log">[V30] 已預設：揼</div>
<div id="result" style="display:none;margin-top:10px"></div>
</div>

<div class="footerVer">Version V30 | Build 20260513-0410 | 同房再戰 | PeerID: <span id="peerId">-</span></div>

<script>
const VERSION='V30';
console.log('%c '+VERSION+' 同房再戰版 ', 'background:#FFEB00;color:#000;font-size:22px;font-weight:900');
let IMG={ '揼':'https://raw.githubusercontent.com/louis2263/together/main/Rock.jpg','剪':'https://raw.githubusercontent.com/louis2263/together/main/scissors.jpg','包':'https://raw.githubusercontent.com/louis2263/together/main/paper.jpg' };
let peer=null, conns={}, myName='', roomCode='', players=[], readyMap={}, isHost=false, myChoice='揼', audioCtx=null, gameAt=0;
function log(t){document.getElementById('logRoom').textContent='['+VERSION+'] '+t}
function sendAll(m){ Object.values(conns).forEach(c=>{ try{if(c.open) c.send(m)}catch{} }); }
function sendAllRetry(m){ for(let i=0;i<15;i++) setTimeout(()=>sendAll(m), i*200); }

function createRoom(){
 myName=document.getElementById('nameInput').value.trim()||'Louis'; roomCode=Math.random().toString(36).substring(2,6).toUpperCase(); document.getElementById('codeInput').value=roomCode; isHost=true;
 peer=new Peer(VERSION+'-'+roomCode); peer.on('open',(id)=>{ document.getElementById('peerId').textContent=id; document.getElementById('roomCode').textContent=roomCode; players=[myName]; readyMap[myName]=true; updatePlayers(); log('已開房 '+roomCode); });
 peer.on('connection',c=>{ conns[c.peer]=c; c.on('open',()=>c.send({type:'sync',players,readyMap,roomCode,gameAt,ver:VERSION})); c.on('data',onData); });
}
function joinRoom(){
 let code=document.getElementById('codeInput').value.trim().toUpperCase(); if(!code) return alert('房號'); myName=document.getElementById('nameInput').value.trim()||'Bella'; roomCode=code; isHost=false;
 peer=new Peer(); peer.on('open',(id)=>{ document.getElementById('peerId').textContent=id; let conn=peer.connect(VERSION+'-'+roomCode,{reliable:true}); conns['host']=conn; conn.on('open',()=>{ conn.send({type:'join',name:myName,ver:VERSION}); log('已入房 '+roomCode); document.getElementById('roomCode').textContent=roomCode; }); conn.on('data',onData); });
}
function onData(d){
 if(d.ver && d.ver!==VERSION){ log('版本唔同 對面'+d.ver+' 你'+VERSION); }
 if(d.type==='join'){ if(!players.includes(d.name)){ players.push(d.name); readyMap[d.name]=true; } updatePlayers(); sendAllRetry({type:'sync',players,readyMap,roomCode,gameAt,ver:VERSION}); if(gameAt>0) sendAllRetry({type:'forceStart', at:gameAt,ver:VERSION}); }
 if(d.type==='sync'){ players=d.players||players; readyMap=d.readyMap||readyMap; if(d.roomCode) document.getElementById('roomCode').textContent=d.roomCode; if(d.gameAt) gameAt=d.gameAt; updatePlayers(); if(gameAt>0 && document.getElementById('gameCard').style.display==='none'){ doStart(gameAt); } }
 if(d.type==='forceStart' || d.type==='startGame'){ gameAt=d.at; doStart(d.at); }
 if(d.type==='choice'){ window.remoteChoices=window.remoteChoices||{}; window.remoteChoices[d.name]=d.choice; }
 if(d.type==='end'){ showResult(); }
 if(d.type==='restart'){ resetForNewRound(); }
}
function updatePlayers(){
 let h='', cnt=players.length; for(let p of players){ let r=readyMap[p]; h+=`<div class="item ${r?'ok':''}"><span>${p}${p===myName?' (你)':''} [${VERSION}]</span><span>${r?'✅ 已準備':'⏳'}</span></div>`; }
 document.getElementById('playerList').innerHTML=h;
 if(cnt>=2 && isHost && document.getElementById('gameCard').style.display==='none'){ document.getElementById('startBtn').style.display='block'; document.getElementById('startBtn').onclick=hostStart; log(cnt+'人已入房，可以一齊開始'); }
}
function hostStart(){
 if(!isHost) return; gameAt=Date.now()+3000; document.getElementById('count').style.display='block';
 let iv=setInterval(()=>{ let s=Math.ceil((gameAt-Date.now())/1000); document.getElementById('count').textContent='['+VERSION+'] 一齊入：'+s; if(s<=0){ clearInterval(iv); document.getElementById('count').style.display='none'; } },200);
 sendAllRetry({type:'forceStart', at:gameAt,ver:VERSION}); doStart(gameAt);
}
async function doStart(at){
 if(document.getElementById('gameCard').style.display==='block' && at===gameAt) return;
 document.getElementById('gameCard').style.display='block'; document.getElementById('startBtn').style.display='none';
 myChoice='揼'; window.remoteChoices={}; document.querySelectorAll('.choiceBtn').forEach(b=>{b.classList.remove('sel'); b.style.pointerEvents='auto';}); document.getElementById('btnChui').classList.add('sel');
 document.getElementById('result').style.display='none';
 if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); await audioCtx.resume();
 let delay=Math.max(0,(at-Date.now())/1000); let when=audioCtx.currentTime+delay;
 for(let i=0;i<3;i++){ let osc=audioCtx.createOscillator(), g=audioCtx.createGain(); osc.frequency.value=i==0?400:i==1?600:900; g.gain.setValueAtTime(0.6,when+i*0.8); g.gain.exponentialRampToValueAtTime(0.01,when+i*0.8+0.4); osc.connect(g).connect(audioCtx.destination); osc.start(when+i*0.8); osc.stop(when+i*0.8+0.4); }
 document.getElementById('soundLog').textContent='['+VERSION+'] 🔊 包！剪！揼！一齊揀！';
 let bar=document.getElementById('bar'); bar.style.width='0%'; let start=Date.now()+delay*1000; let dur=3000;
 let t=setInterval(()=>{ let e=Date.now()-start; bar.style.width=Math.min(e/dur*100,100)+'%'; if(e>=dur){ clearInterval(t); lock(); } },50);
}
function choose(c){ myChoice=c; document.querySelectorAll('.choiceBtn').forEach(b=>b.classList.remove('sel')); if(c==='揼')btnChui.classList.add('sel'); if(c==='剪')btnJian.classList.add('sel'); if(c==='包')btnBao.classList.add('sel'); document.getElementById('choiceLog').textContent='['+VERSION+'] 你揀：'+c; sendAllRetry({type:'choice',name:myName,choice:c,ver:VERSION}); }
function lock(){ document.getElementById('choiceLog').textContent='['+VERSION+'] ⏰ 鎖定：'+myChoice; document.querySelectorAll('.choiceBtn').forEach(b=>b.style.pointerEvents='none'); sendAllRetry({type:'choice',name:myName,choice:myChoice,ver:VERSION}); setTimeout(()=>{ sendAllRetry({type:'end',ver:VERSION}); showResult(); },500); }

function showResult(){
 let area=document.getElementById('result'); area.style.display='block'; let all={}; all[myName]=myChoice; Object.assign(all,window.remoteChoices||{}); let h='<b>['+VERSION+'] 結果</b>'; for(let p of players){ let ch=all[p]||'未收到'; h+=`<div class="item"><span>${p}</span><span><img src="${IMG[ch]||''}" style="width:24px"> ${ch}</span></div>`; } let v=Object.values(all); let win=v.length<players.length?'等緊人...': (new Set(v).size===1||new Set(v).size===3)?'平手！': v.includes('包')&&v.includes('剪')?'剪贏包':v.includes('包')&&v.includes('揼')?'包贏揼':'揼贏剪'; h+=`<div class="log">🏆 ${win} [${VERSION}]</div>
 <button class="btn btnY" onclick="restartRound()">🔄 再玩一次（同房再戰） [${VERSION}]</button>
 <button class="btn btnDark" onclick="location.reload()">🚪 離開房間 / 開新房</button>`;
 area.innerHTML=h;
}
function restartRound(){
 sendAllRetry({type:'restart',ver:VERSION});
 resetForNewRound();
}
function resetForNewRound(){
 // 清空結果，回到大廳但保留房號同玩家
 document.getElementById('result').style.display='none';
 document.getElementById('gameCard').style.display='none';
 document.getElementById('bar').style.width='0%';
 document.getElementById('choiceLog').textContent='['+VERSION+'] 已預設：揼';
 myChoice='揼'; window.remoteChoices={}; gameAt=0;
 log('已重置，房主可以再按開始');
 if(isHost){ document.getElementById('startBtn').style.display='block'; }
}
</script>
</body></html>
