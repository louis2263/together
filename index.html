<!DOCTYPE html>
<html lang="zh‑Hant">
<head>
<meta charset="UTF‑8" />
<meta name="viewport" content="width=device‑width, initial‑scale=1.0"/>
<title>包剪揼多人同步 v3.1｜全問題修復版</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase‑app‑compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase‑database‑compat.js"></script>
<style>
*{box‑sizing:border‑box;font‑family:system‑ui}
body{margin:0;padding:12px;background:#ffe666;font‑size:17px;padding‑bottom:160px;}
.page{display:none;}
.page.active{display:block !important;}
button{padding:12px 16px;margin:6px;font‑size:16px;border‑radius:8px;border:none;background:#fff}
button:disabled{background:#ccc;}
input{padding:11px;width:100%;margin:6px 0;font‑size:17px;border‑radius:6px;border:1px solid #aaa}
#eventLogBox{width:100%;min‑height:140px;background:#fff;padding:10px;border‑radius:8px;white‑space:pre‑wrap;overflow‑y:auto;margin‑bottom:12px}
#debugWrap{position:fixed;left:0;right:0;bottom:0;height:140px;background:#111;color:#4f4;font‑size:11px;z‑index:999;}
#debugWindow{width:100%;height:100%;padding:6px;overflow‑y:auto;}
.versionTag{position:fixed;top:8px;right:8px;background:#444;color:#fff;padding:4px 8px;border‑radius:6px;z‑index:100;}
.rec‑indicator{margin:8px 0}
.countdown‑text{font‑size:26px;font‑weight:bold;color:red;margin:4px 0;}
.fistBtn{width:30%;font‑size:22px;padding:20px 0;margin:8px}
</style>
</head>
<body>
<div class="versionTag">v3.1</div>

<!-- Page1 -->
<div id="page1" class="page active">
<h2>第一頁：輸入姓名 / 建立或加入房間</h2>
<input id="playerNameInput" placeholder="輸入你的名字"/>
<br/>
<button id="btnCreateRoom">房主：開啟全新房間</button>
<br/>
<input id="roomIdJoinInput" placeholder="輸入4位數房間號碼"/>
<button id="btnJoinRoom">房客：進入房間</button>
</div>

<!-- Page2 -->
<div id="page2" class="page">
<h2>房間號碼：<span id="roomTitleShow"></span></h2>
<div id="eventLogBox"></div>
<div class="rec‑indicator">
<span id="rec1Status">第一段包剪揼：未錄音</span>
<div id="cd1" class="countdown‑text"></div>
<button id="rec1Start">錄第一段(包剪揼)</button>
<button id="play1" disabled>試聽第一段</button>

<br><br>
<span id="rec2Status">第二段勝利宣言：未錄音</span>
<div id="cd2" class="countdown‑text"></div>
<button id="rec2Start">錄第二段(勝利宣言)</button>
<button id="play2" disabled>試聽第二段</button>

<h4>房主選擇遊戲規則</h4>
<div id="ruleBtnWrap">
<button data‑rule="oneRound">一鋪定勝負</button>
<button data‑rule="win2">贏兩鋪</button>
<button data‑rule="win3">贏三鋪</button>
<button data‑rule="consec2">連贏兩鋪</button>
</div>
</div>

<!-- Page3 第三頁：選擇出拳 -->
<div id="page3" class="page">
<h2>第三頁：請選擇本輪出拳</h2>
<div style="display:flex;justify‑content:space‑around;flex‑wrap:wrap;">
<button class="fistBtn" data‑fist="rock">石</button>
<button class="fistBtn" data‑fist="scissors">剪</button>
<button class="fistBtn" data‑fist="paper">包</button>
</div>
<div id="p3Tip" style="margin‑top:20px">等待全部選手提交出拳...</div>
</div>

<!-- Page4 第四頁：結果、排行榜、5秒倒數 -->
<div id="page4" class="page">
<h2>第四頁：本輪戰果</h2>
<div id="rankView"></div>
<button id="manualChorusBtn">手動播放本輪大合唱</button>
<div id="roundCountDown" style="font‑size:40px;color:red;text‑align:center;margin:20px 0"></div>
</div>

<!-- Debug 永久常開 -->
<div id="debugWrap">
<div id="debugWindow"></div>
</div>

<script>
const debugDiv = document.querySelector("#debugWindow");
let currentPage = "page1";
let audioUnlock = false;

const log = (txt)=>{
  const t = new Date().toLocaleString("zh‑HK");
  debugDiv.innerText += `[${t}] ${txt}\n`;
  debugDiv.scrollTop = debugDiv.scrollHeight;
};
log("✅ v3.1 全部已知bug修復完畢");

let fbDb, roomRef, playersRef, roomEventsRef;
let myName = "";
let myPlayerId = "";
let isHost = false;
let currentRoomId = "";
let roomGlobalListener = null;

let allPlayersAudio = {};
let gameState = {};

let mediaRec1 = null, mediaRec2 = null;
let stream1 = null, stream2 = null;
let chunks1=[],chunks2=[];
let audioBlob1 = null, audioBlob2 = null;
let audioUrl1=null, audioUrl2=null;

// 預解鎖瀏覽器音頻限制
function unlockAudio(){
  if(audioUnlock) return;
  const dummy = new Audio();
  dummy.play().catch(()=>{});
  audioUnlock = true;
  log("🔓 Audio播放權限已解鎖");
}

// 唯一玩家ID
function genPlayerId(){
  return "p_" + Math.random().toString(36).slice(2,12);
}

function setPage(pageId){
  if(currentPage === pageId) return;
  log(`👉 切換頁面 ${pageId}`);
  document.querySelectorAll(".page").forEach(p=> p.classList.remove("active"));
  const target = document.getElementById(pageId);
  target.classList.add("active");
  currentPage = pageId;
  if(pageId === "page3"){
    document.querySelectorAll(".fistBtn").forEach(b=> b.disabled = false);
  }
}

function blobToBase64(blob){
  return new Promise(resolve=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.readAsDataURL(blob);
  })
}
function b64ToAudio(b64){
  return new Audio(b64);
}

// ========== Firebase Init 全部連字符已修正 ==========
try{
  log("Step0 初始化Firebase");
  const cfg = {
    apiKey:"在此填入你的apiKey",
    authDomain:"game‑ad81e.firebaseapp.com",
    databaseURL:"https://game‑ad81e‑default‑rtdb.asia‑southeast1.firebasedatabase.app",
    projectId:"game‑ad81e",
    storageBucket:"game‑ad81e.appspot.com"
  };
  const app = firebase.initializeApp(cfg);
  fbDb = firebase.database(app);
  log("✅ Firebase OK");
}catch(err){
  log("❌ Firebase初始化錯誤:" + err.message);
}

const pushRoomEvent = async (msg)=>{
  await roomEventsRef.push({msg, ts:Date.now()});
};

const renderRoomEvents = (snap)=>{
  const box = document.querySelector("#eventLogBox");
  box.innerText = "";
  if(!snap.exists()) return;
  const arr = Object.values(snap.val()).sort((a,b)=>a.ts - b.ts);
  arr.forEach(e=> box.innerText += e.msg + "\n");
};

// 監聽全部玩家音訊同步
function watchAllPlayersAudio(){
  playersRef.on("value", snap=>{
    if(!snap.exists()) return;
    const players = snap.val();
    for(const pid in players){
      const pd = players[pid];
      if(!allPlayersAudio[pid]) allPlayersAudio[pid] = {};
      if(pd.b64_1 && allPlayersAudio[pid].b64_1 !== pd.b64_1){
        allPlayersAudio[pid].b64_1 = pd.b64_1;
        allPlayersAudio[pid].audio1 = b64ToAudio(pd.b64_1);
        log(`📥 取得 ${pd.name} 包剪揼音訊`);
      }
      if(pd.b64_2 && allPlayersAudio[pid].b64_2 !== pd.b64_2){
        allPlayersAudio[pid].b64_2 = pd.b64_2;
        allPlayersAudio[pid].audio2 = b64ToAudio(pd.b64_2);
        log(`📥 取得 ${pd.name} 勝利宣言`);
      }
    }
  })
}

// 石>剪,剪>包,包>石; 0和=,1:p1贏,-1:p2贏
function getWin(a,b){
  if(a===b) return 0;
  const map={rock:"scissors",scissors:"paper",paper:"rock"};
  return map[a]===b ? 1 : -1;
}

// 執行本輪計分、淘汰邏輯
function calcRound(players, rule){
  const alive = players.filter(p=>!p.eliminated);
  for(let p of players){
    if(!p.score) p.score = 0;
    if(!p.streak) p.streak = 0;
  }
  for(let i=0;i<alive.length;i++){
    for(let j=i+1;j<alive.length;j++){
      const res = getWin(alive[i].fist, alive[j].fist);
      if(res === 1){
        alive[i].score += 1; alive[i].streak += 1;
        alive[j].streak = 0;
      }else if(res === -1){
        alive[j].score +=1; alive[j].streak +=1;
        alive[i].streak = 0;
      }else{
        alive[i].streak = 0; alive[j].streak = 0;
      }
    }
  }
  // 按規則標淘汰
  if(rule === "oneRound"){
    const max = Math.max(...alive.map(x=>x.score));
    alive.forEach(p=>{if(p.score < max)p.eliminated=true;})
  }else if(rule === "win2"){
    players.forEach(p=>{if(p.score >=2)p.eliminated=true;})
  }else if(rule === "win3"){
    players.forEach(p=>{if(p.score >=3)p.eliminated=true;})
  }else if(rule === "consec2"){
    players.forEach(p=>{if(p.streak >=2)p.eliminated=true;})
  }
  return players;
}

// 播放全部活著玩家大合唱
function playAllChorus(alivePids){
  unlockAudio();
  alivePids.forEach(pid=>{
    const pl = allPlayersAudio[pid];
    if(pl && pl.audio1){
      pl.audio1.currentTime = 0;
      pl.audio1.play().catch(e=>log(`播放失敗:${e.message}`));
    }
  })
  log(`🎵 大合唱觸發，${alivePids.length}人`);
}

// 全房狀態監聽
function startRoomGlobalWatch(){
  if(roomGlobalListener) return;
  watchAllPlayersAudio();
  roomGlobalListener = roomRef.on("value", async snap=>{
    if(!snap.exists()) return;
    const roomData = snap.val();
    const playersRaw = roomData.players||{};
    const gameRule = roomData.gameRule;
    const phase = roomData.gamePhase || "idle";
    let playerList = Object.entries(playersRaw).map(([k,v])=>({pid:k,...v}));
    if(playerList.length === 0) return;

    // 只有房主先可以改規則
    document.querySelectorAll("#ruleBtnWrap button").forEach(b=>{
      b.disabled = !isHost;
    })

    const allReady = playerList.every(p=> p.ready === true);
    const allThrow = playerList.every(p=> p.fist);
    const playerCount = playerList.length;
    log(`狀態：玩家${playerCount}｜全部準備=${allReady}｜已選規則=${!!gameRule}｜全部出拳=${allThrow}｜階段=${phase}`);

    // 最少2人先可以開始
    if(allReady && !!gameRule && playerCount >=2 && phase === "idle"){
      await roomRef.child("gamePhase").set("roundStart");
    }

    if(allThrow && phase === "roundStart"){
      await roomRef.child("gamePhase").set("roundEnd");
      // 計分
      playerList = calcRound(playerList, gameRule);
      const patch={};
      for(const p of playerList){
        patch[p.pid]={score:p.score,streak:p.streak,eliminated:p.eliminated};
      }
      await playersRef.update(patch);

      // 渲染排行榜
      const alive = playerList.filter(x=>!x.eliminated);
      const out = playerList.filter(x=>x.eliminated);
      document.querySelector("#rankView").innerHTML =
        `<div>✅存活：${alive.map(x=>x.name+"(勝:"+x.score+",連勝:"+x.streak+")").join(",")}</div>
         <div>❌已淘汰：${out.map(x=>x.name).join(",")}</div>`;

      const aliveIds = alive.map(x=>x.pid);
      playAllChorus(aliveIds);

      // 最終勝利者
      if(alive.length <= 1){
        if(alive.length === 1 && allPlayersAudio[alive[0].pid]?.audio2){
          const winAudio = allPlayersAudio[alive[0].pid].audio2;
          winAudio.currentTime = 0;
          winAudio.play().catch(e=>log("勝利宣言播放錯誤:"+e.message));
        }
        document.querySelector("#roundCountDown").innerText = "遊戲完結";
        return;
      }

      // 5秒倒數返回第三頁
      let cd = 5;
      document.querySelector("#roundCountDown").innerText = cd;
      const timer = setInterval(async ()=>{
        cd -= 1;
        document.querySelector("#roundCountDown").innerText = cd;
        if(cd <= 0){
          clearInterval(timer);
          // 清除本輪出拳狀態，下一輪
          const resetPatch = {};
          playerList.forEach(p=>{resetPatch[p.pid]={fist:null};})
          await playersRef.update(resetPatch);
          await roomRef.child("gamePhase").set("roundStart");
        }
      }, 1000);
    }

    if(phase === "roundStart") setPage("page3");
    if(phase === "roundEnd") setPage("page4");
  })
}

// 建立房間
document.querySelector("#btnCreateRoom").onclick = async ()=>{
  try{
    unlockAudio();
    log("房主建立房間");
    myName = document.querySelector("#playerNameInput").value.trim();
    if(!myName){alert("請輸入姓名");return;}
    myPlayerId = genPlayerId();
    isHost = true;
    currentRoomId = String(Math.floor(1000 + Math.random()*9000));
    log(`生成房號：${currentRoomId}`);

    roomRef = fbDb.ref(`rooms/${currentRoomId}`);
    playersRef = fbDb.ref(`rooms/${currentRoomId}/players`);
    roomEventsRef = fbDb.ref(`rooms/${currentRoomId}/roomEvents`);

    await roomRef.set({host:myPlayerId, gamePhase:"idle"});
    await playersRef.child(myPlayerId).set({name:myName, ready:false, score:0, streak:0, eliminated:false});
    await pushRoomEvent(`${myName} 進入房間`);

    roomEventsRef.on("value", renderRoomEvents);
    startRoomGlobalWatch();
    document.querySelector("#roomTitleShow").innerText = currentRoomId;
    setPage("page2");
  }catch(ex){
    log("❌ 建立房間異常：" + ex.message);
  }
};

// 加入房間
document.querySelector("#btnJoinRoom").onclick = async ()=>{
  try{
    unlockAudio();
    log("房客嘗試加入");
    myName = document.querySelector("#playerNameInput").value.trim();
    currentRoomId = document.querySelector("#roomIdJoinInput").value.trim();
    myPlayerId = genPlayerId();
    isHost = false;
    if(!myName || currentRoomId.length!==4){alert("填姓名同4位房號");return;}

    roomRef = fbDb.ref(`rooms/${currentRoomId}`);
    playersRef = fbDb.ref(`rooms/${currentRoomId}/players`);
    roomEventsRef = fbDb.ref(`rooms/${currentRoomId}/roomEvents`);

    const roomSnap = await roomRef.once("value");
    if(!roomSnap.exists()){alert("房間不存在");return;}
    await playersRef.child(myPlayerId).set({name:myName, ready:false, score:0, streak:0, eliminated:false});
    await pushRoomEvent(`${myName} 進入房間`);

    roomEventsRef.on("value", renderRoomEvents);
    startRoomGlobalWatch();
    document.querySelector("#roomTitleShow").innerText = currentRoomId;
    setPage("page2");
  }catch(ex){
    log("❌ 加入房間異常："+ex.message);
  }
};

// 錄音，唔寫死webm，用瀏覽器原生mime
async function doRecord(idx){
  unlockAudio();
  const btnStart = idx===1 ? document.querySelector("#rec1Start") : document.querySelector("#rec2Start");
  const btnPlay = idx===1 ? document.querySelector("#play1") : document.querySelector("#play2");
  const statusDom = idx===1 ? document.querySelector("#rec1Status") : document.querySelector("#rec2Status");
  const cdDom = idx===1 ? document.querySelector("#cd1") : document.querySelector("#cd2");

  btnStart.disabled = true;
  btnPlay.disabled = true;
  cdDom.innerText="3";

  let stream = await navigator.mediaDevices.getUserMedia({audio:true});
  let rec = new MediaRecorder(stream);
  let chk=[];
  rec.ondataavailable = e=>chk.push(e.data);
  rec.start();

  for(let i=2;i>=1;i--){await new Promise(r=>setTimeout(r,1000)); cdDom.innerText=i;}
  await new Promise(r=>setTimeout(r,1000));
  rec.stop();
  stream.getTracks().forEach(t=>t.stop());
  cdDom.innerText="";

  await new Promise(res=>{
    rec.onstop = async ()=>{
      const blob = new Blob(chk, {type:rec.mimeType});
      const url = URL.createObjectURL(blob);
      const b64 = await blobToBase64(blob);
      if(idx===1){
        audioBlob1 = blob; audioUrl1 = url;
        await playersRef.child(myPlayerId).update({b64_1:b64});
      }else{
        audioBlob2 = blob; audioUrl2 = url;
        await playersRef.child(myPlayerId).update({b64_2:b64});
      }
      statusDom.innerText = idx===1 ? "第一段包剪揼：✅已錄畢" : "第二段勝利宣言：✅已錄畢";
      btnPlay.disabled = false;
      res();
    }
  })
  btnStart.disabled = false;
  if(audioBlob1 && audioBlob2){
    await playersRef.child(myPlayerId).update({ready:true});
    await pushRoomEvent(`${myName} 已準備`);
  }
}

function playAudio(url){if(!url)return; new Audio(url).play();}
document.querySelector("#rec1Start").onclick = ()=> doRecord(1);
document.querySelector("#rec2Start").onclick = ()=> doRecord(2);
document.querySelector("#play1").onclick = ()=> playAudio(audioUrl1);
document.querySelector("#play2").onclick = ()=> playAudio(audioUrl2);

// 房主揀規則
document.querySelectorAll("[data‑rule]").forEach(btn=>{
  btn.onclick = async ()=>{
    try{
      if(!isHost) return;
      const rule = btn.dataset.rule;
      await roomRef.child("gameRule").set(rule);
      log(`✅ 設定規則：${rule}`);
    }catch(e){log("設定規則錯誤:"+e.message)}
  }
})

// 第三頁出拳
document.querySelectorAll(".fistBtn").forEach(btn=>{
  btn.onclick = async ()=>{
    unlockAudio();
    const fist = btn.dataset.fist;
    log(`✊ 本輪出拳:${fist}`);
    await playersRef.child(myPlayerId).update({fist});
    document.querySelectorAll(".fistBtn").forEach(b=>b.disabled=true);
  }
})

// 手動大合唱按鈕（後備）
document.querySelector("#manualChorusBtn").onclick = ()=>{
  const aliveIds = Object.entries(allPlayersAudio).filter(([pid,obj])=>obj.audio1).map(([pid])=>pid);
  playAllChorus(aliveIds);
}

log("✅ v3.1 全部腳本載入完成，可以測試");
</script>
</body>
</html>
