<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>包剪揼多人對戰 v2.8</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{padding:16px;background:#f4f4f4}
.debug{background:#111;color:#3f3;padding:10px;border-radius:8px;white-space:pre-wrap;font-size:12px;max-height:220px;overflow-y:auto;margin-bottom:16px;position:sticky;top:0;z-index:99}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #00000015}
button{width:100%;padding:16px;font-size:18px;border:none;border-radius:10px;margin:6px 0;color:#fff;background:#2b78e4}
button:disabled{background:#aaa}
button.recording{background:#d03030}
.info{font-size:17px;margin:8px 0}
.ready-yes{color:#229922;font-weight:bold}
.score{font-size:20px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="debug" id="debug">版本 v2.8 | Firebase回合同步 + PeerJS音頻</div>

<div class="card">
<h2>✊✌️🖐️ 包剪揼多人對戰</h2>
<div class="info">房號：<span id="roomId"></span></div>
<div class="info">連線狀態：<span id="connStatus">待連線</span></div>
</div>

<div class="card">
<h3>等候區</h3>
<div id="playerList"></div>
</div>

<div class="card">
<h3>錄音設定</h3>
<button id="recBtn1">開始錄音(包剪揼口令)</button>
<button id="playBtn1">試聽我的口令</button>
<button id="recBtn2">開始錄音(勝利語)</button>
<button id="playBtn2">試聽我的勝利語</button>
<p>錄製完成自動發送俾對方</p>
<button id="readyBtn">✅ 我準備好</button>
<button id="leaveBtn">🚪 離開房間</button>
</div>

<div class="card">
<h3>請選擇：包 / 剪 / 撚</h3>
<button id="selRock" disabled>✊ 包</button>
<button id="selScissors" disabled>✌️ 剪</button>
<button id="selPaper" disabled>🖐️ 撚</button>
<div class="score">我分數:<span id="myScore">0</span> | 對手分數:<span id="oppScore">0</span> | 連贏:<span id="winStreak">0</span></div>
</div>

<!-- Firebase 8 CDN -->
<script src="https://cdn.jsdelivr.net/npm/firebase@8.10.1/firebase-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
// ========== Firebase Config 換返你自己嘅 ==========
const firebaseConfig = {
  apiKey: "AIzaSyBUI5N2IZO_2erP6nNHuWB-Q6T7Mrjl_m0",
  authDomain: "game-ad81e.firebaseapp.com",
  databaseURL: "https://game-ad81e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "game-ad81e",
  storageBucket: "game-ad81e.firebasestorage.app"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 狀態
let roomId = "";
let myName = "";
let isHost = false;
let peer = null;
let peerConn = null;
let recorder1, recorder2;
let audioBlob1, audioBlob2;
let oppAudio1, oppAudio2;
let myReady = false;
let myChoice = null;
let myScore = 0, oppScore = 0, winStreak = 0;
let roundLock = false;

// DOM
const $ = s=>document.querySelector(s);
const debugEl = $("#debug");
function log(txt){
  const t = new Date().toLocaleTimeString();
  debugEl.innerText += `[${t}] ${txt}\n`;
  debugEl.scrollTop = debugEl.scrollHeight;
}

// 開房 / 入房 （你原有4位房號邏輯）
(async function(){
  myName = prompt("輸入你名字：");
  if(!myName) return;
  const opt = confirm("按【確定】=開新房間｜【取消】=輸入房號入房");
  if(opt){
    roomId = String(Math.floor(Math.random()*9000)+1000);
    isHost = true;
    log(`房主，建立房號 ${roomId}`);
    await db.ref(`rooms/${roomId}`).set({
      players:{},
      round:{state:"idle",c1:null,c2:null},
      score:{p1:0,p2:0}
    });
  }else{
    roomId = prompt("輸入4位房號：");
    isHost = false;
  }
  $("#roomId").innerText = roomId;
  initRoom();
  initPeer();
})();

function initPeer(){
  peer = new Peer({debug:1});
  peer.on("open",pid=>{
    log(`PeerID: ${pid}`);
    if(isHost){
      db.ref(`rooms/${roomId}/peerHost`).set(pid);
    }else{
      db.ref(`rooms/${roomId}/peerHost`).once("snap=>{
        const hostPid = snap.val();
        peerConn = peer.connect(hostPid);
        bindPeerConn();
      })
    }
  })
  peer.on("connection",c=>{
    peerConn = c;
    bindPeerConn();
  })
}
function bindPeerConn(){
  $("#connStatus").innerText = "✅已連線";
  log("P2P連線成功，P2P只用來傳音頻");
  peerConn.on("data",d=>{
    if(d.type==="audio1"){oppAudio1=d.blob;log("收到對方口令音頻")}
    if(d.type==="audio2"){oppAudio2=d.blob;log("收到對方勝利音頻")}
  })
}

// 監聽房間狀態（核心同步）
function initRoom(){
  const roomRef = db.ref(`rooms/${roomId}`);
  // 加入玩家
  roomRef.child("players").child(myName).set({ready:false});
  // 監聽玩家列表
  roomRef.child("players").on("value",snap=>{
    const pl = snap.val()||{};
    let html = "";
    for(let n in pl){
      html += `<div>${n} ${pl[n].ready?"<span class='ready-yes'>✅已準備</span>":"❌未準備"}</div>`
    }
    $("#playerList").innerHTML = html;
    checkAllReady(pl);
  })
  // 監聽回合狀態（最重要！）
  roomRef.child("round").on("value",snap=>{
    const r = snap.val();
    if(!r) return;
    log(`回合狀態:${r.state},c1:${r.c1},c2:${r.c2}`);
    if(r.state==="waitingChoose"){
      unlockSelect();
    }
    if(r.state==="judge"){
      if(r.c1 && r.c2 && !roundLock){
        roundLock=true;
        calcResult(r.c1,r.c2);
      }
    }
    if(r.state==="reset"){
      resetRoundUI();
      roundLock=false;
    }
  })
  // 監聽分數
  roomRef.child("score").on("value",snap=>{
    const sc = snap.val()||{p1:0,p2:0};
    myScore = sc.p1; oppScore = sc.p2;
    $("#myScore").innerText = myScore;
    $("#oppScore").innerText = oppScore;
  })
}

// 全部玩家準備好 → 啟動回合
function checkAllReady(players){
  const names = Object.keys(players);
  if(names.length<2) return;
  const allReady = names.every(k=>players[k].ready===true);
  if(allReady){
    log("✅全部玩家已準備，開啟回合等待出拳");
    if(isHost){
      db.ref(`rooms/${roomId}/round`).update({state:"waitingChoose",c1:null,c2:null})
    }
  }
}

// 解鎖包剪撚按鈕
function unlockSelect(){
  $("#selRock").disabled=false;
  $("#selScissors").disabled=false;
  $("#selPaper").disabled=false;
  log("可以揀包/剪/撚");
}
function lockSelect(){
  $("#selRock").disabled=true;
  $("#selScissors").disabled=true;
  $("#selPaper").disabled=true;
}

// 出拳
$("#selRock").onclick=()=>submitChoice("rock");
$("#selScissors").onclick=()=>submitChoice("scissors");
$("#selPaper").onclick=()=>submitChoice("paper");
function submitChoice(c){
  if(myChoice) return;
  myChoice = c;
  lockSelect();
  log(`我揀咗:${c}`);
  // 寫入firebase回合
  db.ref(`rooms/${roomId}/round`).once("snap=>{
    const rd = snap.val();
    let newC1 = rd.c1, newC2 = rd.c2;
    if(isHost) newC1 = c; else newC2 = c;
    let nextState = (newC1 && newC2) ? "judge" : "waitingChoose";
    db.ref(`rooms/${roomId}/round`).update({c1:newC1,c2:newC2,state:nextState})
  })
}

// 計賽果、大合唱、播勝利語音
function calcResult(c1,c2){
  log("開始計賽果 + 大合唱");
  // 大合唱：兩邊同時播放兩個口令
  if(audioBlob1 && oppAudio1){
    const aMy = new Audio(URL.createObjectURL(audioBlob1));
    const aOpp = new Audio(URL.createObjectURL(oppAudio1));
    aMy.play(); aOpp.play();
  }
  // 判輸贏
  let win = null;
  if(c1===c2) win="draw";
  else if(
    (c1=="rock"&&c2=="scissors")||
    (c1=="scissors"&&c2=="paper")||
    (c1=="paper"&&c2=="rock")
  ) win="p1";
  else win="p2";
  log(`賽果:${win}`);
  // 更新分數
  db.ref(`rooms/${roomId}/score`).once("snap=>{
    const s = snap.val();
    let np1=s.p1,np2=s.p2;
    if(win=="p1") np1++;
    if(win=="p2") np2++;
    db.ref(`rooms/${roomId}/score`).update({p1:np1,p2:np2});
    // 播放勝利者語音
    setTimeout(()=>{
      if(win=="p1"){
        const aud = new Audio(URL.createObjectURL(audioBlob2));
        aud.play();
      }else if(win=="p2"){
        const aud = new Audio(URL.createObjectURL(oppAudio2));
        aud.play();
      }
      // 房主重置下一輪
      if(isHost){
        setTimeout(()=>{
          db.ref(`rooms/${roomId}/round`).update({state:"reset",c1:null,c2:null})
        },1200)
      }
    },1200)
  })
}
function resetRoundUI(){
  myChoice = null;
  lockSelect();
  log("回合重置，等待下一輪");
}

// 錄音 3秒強制停止
$("#recBtn1").onclick=async()=>{await startRec(1,$("#recBtn1"))}
$("#recBtn2").onclick=async()=>{await startRec(2,$("#recBtn2"))}
async function startRec(no,btn){
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  const rec = new MediaRecorder(stream);
  btn.classList.add("recording");
  log(`開始錄音${no}，3秒後自動停`);
  const chunks=[];
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{
    const b = new Blob(chunks,{type:"audio/webm"});
    if(no===1) {audioBlob1=b;if(peerConn)peerConn.send({type:"audio1",blob:b})}
    if(no===2) {audioBlob2=b;if(peerConn)peerConn.send({type:"audio2",blob:b})}
    btn.classList.remove("recording");
    log(`錄音${no}完成，已發送對方`);
    stream.getTracks().forEach(t=>t.stop());
  }
  rec.start();
  setTimeout(()=>rec.stop(),3000);
}
$("#playBtn1").onclick=()=>{if(audioBlob1)new Audio(URL.createObjectURL(audioBlob1)).play()}
$("#playBtn2").onclick=()=>{if(audioBlob2)new Audio(URL.createObjectURL(audioBlob2)).play()}

// 準備按鈕
$("#readyBtn").onclick=()=>{
  myReady = !myReady;
  db.ref(`rooms/${roomId}/players/${myName}/ready`).set(myReady);
  log(`${myName} 設定準備狀態:${myReady}`);
}
$("#leaveBtn").onclick=()=>{location.reload()}
</script>
</body>
</html>
