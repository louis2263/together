<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>包剪揼多人遊戲 v1.8</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;}
body{padding:16px;margin:0;background:#f4f4f4;}
.container{max-width:500px;margin:0 auto;}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #00000015;}
.btn{padding:14px 20px;border:none;border-radius:12px;font-size:18px;margin:6px;cursor:pointer;}
.btn-normal{background:#ddd;}
.btn-rec{background:#2288dd;color:white;}
.btn-rec-recording{background:#dd2222;color:white;}
.result-text{font-size:24px;font-weight:bold;margin:12px 0;}
.debug{background:#111;color:#3f3;padding:12px;border-radius:10px;font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:300px;overflow-y:auto;}
.img-hand{width:140px;height:140px;object-fit:contain;}
.hand-row{display:flex;gap:20px;justify-content:center;margin:16px 0;}
.status-tip{font-size:16px;color:#444;margin:8px 0;}
</style>
</head>
<body>
<div class="container">
<div class="card">
<div style="font-size:26px;font-weight:bold;">分數：你 <span id="scoreMe">0</span> | 對手 <span id="scoreOp">0</span></div>
<div class="hand-row">
<div><img id="imgMe" class="img-hand" src="" alt="你"><div style="text-align:center;font-size:20px">你</div></div>
<div><img id="imgOp" class="img-hand" src="" alt="對手"><div style="text-align:center;font-size:20px">對手</div></div>
</div>
<div id="roundResult" class="result-text"></div>
<div id="gameEndTip" class="result-text" style="color:darkblue;display:none"></div>
<div id="pickStatus" class="status-tip"></div>
<div id="selectBtns">
<button class="btn btn-normal" onclick="playerPick('rock')">石頭</button>
<button class="btn btn-normal" onclick="playerPick('paper')">布</button>
<button class="btn btn-normal" onclick="playerPick('scissors')">剪刀</button>
</div>
</div>

<div class="card">
<h3>🎙️ 錄音設定</h3>
<div id="recStatus" class="status-tip">未開始錄音</div>
<button id="recBtn" class="btn btn-rec" onclick="toggleRecord()">開始錄音</button>
<button class="btn btn-normal" onclick="playAudio()">試聽</button>
<button class="btn btn-normal" onclick="uploadAudio()">上傳</button>
<audio id="audioPlayer">
</div>

<div class="card">
<h3>🔍 測試視窗 (Debug Log)</h3>
<div id="debugLog" class="debug"></div>
</div>
</div>

<script>
// ===== 遊戲設定 =====
const WIN_MODES = {
  oneRound:"一鋪定勝負",
  bestOf3:"贏兩鋪",
  bestOf5:"贏三鋪",
  win2InRow:"連贏兩鋪"
};
let gameMode = "win2InRow";
let scoreMe = 0, scoreOp = 0;
let currentStreak = 0;
let playerChoice = null, oppChoice = null;
let allPicked = false;
let gameFinished = false;

// ===== 錄音變數 =====
let mediaRecorder = null;
let audioChunks = [];
let recordedBlob = null;
let isRecording = false;
const audioPlayer = document.getElementById("audioPlayer");

// 提示音效
function beep(type){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.frequency.value = type==="start"?880:660;
  gain.gain.value=0.12;
  osc.start();
  setTimeout(()=>osc.stop(),120);
}

// 切換錄音
async function toggleRecord(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    log("❌ 瀏覽器唔支援麥克風");return;
  }
  if(isRecording){
    // 停止錄音
    mediaRecorder.stop();
    isRecording = false;
    document.getElementById("recBtn").className = "btn btn-rec";
    document.getElementById("recBtn").innerText = "開始錄音";
    document.getElementById("recStatus").innerText = "✅ 錄製完成，可以試聽";
    beep("stop");
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      audio:{
        sampleRate:48000,
        channelCount:1,
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }
    });
    // 改用瀏覽器廣泛支援嘅 webm 音訊
    const options = {mimeType:'audio/webm'};
    mediaRecorder = new MediaRecorder(stream,options);
    audioChunks = [];
    mediaRecorder.ondataavailable = e=>audioChunks.push(e.data);
    mediaRecorder.onstop = ()=>{
      recordedBlob = new Blob(audioChunks,{type:'audio/webm'});
      audioPlayer.src = URL.createObjectURL(recordedBlob);
    };
    mediaRecorder.start();
    isRecording = true;
    document.getElementById("recBtn").className = "btn btn-rec-recording";
    document.getElementById("recBtn").innerText = "🔴 錄音中…按呢度停止";
    document.getElementById("recStatus").innerText = "🎤 而家緊錄音，講說話";
    beep("start");
    log("🎙️ 開始錄音，降噪已開啟，格式 audio/webm");
  }catch(err){
    log("❌ 麥克風權限錯誤："+err.message);
  }
}
function playAudio(){
  if(!recordedBlob){log("⚠️ 未有錄音");return;}
  audioPlayer.play();
  log("▶️ 試聽錄音");
}
function uploadAudio(){
  if(!recordedBlob){log("⚠️ 未有錄音，無法上傳");return;}
  log("✅ 錄音已上傳（模擬）");
}

// ===== 遊戲邏輯 =====
function playerPick(hand){
  if(gameFinished || allPicked) return;
  playerChoice = hand;
  document.getElementById("pickStatus").innerText = `你已經揀咗：${transHand(hand)}，等待對手...`;
  log("👉 玩家揀咗："+hand);
  // 模擬對手揀牌
  setTimeout(()=>{
    const arr = ["rock","paper","scissors"];
    oppChoice = arr[Math.floor(Math.random()*3)];
    log("🤖 對手揀咗："+oppChoice);
    allPicked = true;
    document.getElementById("pickStatus").innerText = "✅ 所有人都揀好，播放開局錄音";
    log("✅ 所有人都揀好，播放開局錄音");
    // 等錄音播完先計結果
    setTimeout(()=>calcResult(),800);
  },700);
}

function transHand(h){
  if(h==="rock")return"石頭";
  if(h==="paper")return"布";
  if(h==="scissors")return"剪刀";
}
function getWinner(p,o){
  if(p===o)return"draw";
  if(
    (p==="rock"&&o==="scissors")||
    (p==="paper"&&o==="rock")||
    (p==="scissors"&&o==="paper")
  )return"win";
  return"lose";
}
function calcResult(){
  const res = getWinner(playerChoice,oppChoice);
  let msg = `你：${transHand(playerChoice)} | 對手：${transHand(oppChoice)}`;
  document.getElementById("roundResult").innerText = msg;
  document.getElementById("imgMe").src=playerChoice+".png";
  document.getElementById("imgOp").src=oppChoice+".png";

  if(res==="draw"){
    document.getElementById("roundResult").innerText += "\n🤝 打和！繼續";
    log("✅ 本局結果：draw，當前連勝："+currentStreak);
  }else if(res==="win"){
    scoreMe++;
    currentStreak++;
    document.getElementById("roundResult").innerText += "\n🎉 你贏咗！";
    log("✅ 本局結果：win，當前連勝："+currentStreak);
  }else{
    scoreOp++;
    currentStreak=0;
    document.getElementById("roundResult").innerText += "\n😥 你輸咗";
    log("✅ 本局結果：lose，當前連勝："+currentStreak);
  }
  document.getElementById("scoreMe").innerText = scoreMe;
  document.getElementById("scoreOp").innerText = scoreOp;

  // 檢查遊戲完結
  let endGame = false;
  if(gameMode==="oneRound"){
    if(res!=="draw")endGame=true;
  }else if(gameMode==="bestOf3"){
    if(scoreMe>=2||scoreOp>=2)endGame=true;
  }else if(gameMode==="bestOf5"){
    if(scoreMe>=3||scoreOp>=3)endGame=true;
  }else if(gameMode==="win2InRow"){
    if(currentStreak>=2)endGame=true;
  }

  if(endGame){
    gameFinished = true;
    document.getElementById("gameEndTip").style.display = "block";
    document.getElementById("gameEndTip").innerText = "🏆 恭喜你贏咗成局！";
    document.getElementById("pickStatus").innerText = "";
    document.getElementById("selectBtns").style.display="none";
    log("🏁 遊戲完結，恭喜你贏咗成局！");
  }else{
    // 重置下一鋪
    setTimeout(()=>{
      playerChoice=null;oppChoice=null;allPicked=false;
      document.getElementById("pickStatus").innerText = "";
    },1500);
  }
}

// Debug日誌
function log(text){
  const t = new Date().toLocaleTimeString();
  const el = document.getElementById("debugLog");
  el.innerText += `[${t}] ${text}\n`;
  el.scrollTop = el.scrollHeight;
}
</script>
</body>
</html>
