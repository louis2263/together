<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>包剪揼多人遊戲（單機模擬版）</title>
    <style>
        *{box-sizing:border-box;font-family:system-ui,sans-serif;}
        body{max-width:600px;margin:20px auto;padding:16px;background:#f7f7f7;}
        .box{background:white;padding:16px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 3px #0002;}
        button{padding:12px 16px;border:none;border-radius:8px;background:#2277dd;color:white;font-size:17px;margin:6px 4px;}
        button:disabled{background:#aaaaaa;}
        .btn-rec-stop{background:#dd2222;}
        input, select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;}
        .ready-tag{color:green;font-weight:bold}
        .inroom-tag{color:#2277dd}
        .player-item{padding:8px;border-bottom:1px solid #eee}
        .version{text-align:right;color:#666;margin-bottom:8px}
        .tip-rec{color:#dd2222;font-weight:bold;margin:8px 0;}
        .tip-perm{color:#c22;margin:12px 0;padding:10px;background:#ffe;border-radius:8px}
        .score{font-size:20px;font-weight:bold;margin:10px 0;}
        .result-text{font-size:22px;font-weight:bold;color:#2277dd;margin:12px 0;white-space:pre-line;}
        #debugLog{
            background:#111;
            color:#0f0;
            padding:10px;
            border-radius:8px;
            height:180px;
            overflow-y:auto;
            white-space:pre-wrap;
            font-size:12px;
        }
        /* 拳頭圖片樣式 */
        .handContainer{
            display:flex;
            justify-content:center;
            gap:20px;
            margin:15px 0;
        }
        .handImg{
            width:120px;
            height:auto;
            border-radius:8px;
        }
    </style>
</head>
<body>
    <div class="version">版本 v1.7｜加入拳頭圖片 rock.jpg / paper.jpg / scissors.jpg</div>

    <div class="box">
        <h3>1. 輸入玩家名稱</h3>
        <input id="playerName" placeholder="輸入你個名">
    </div>

    <div class="box">
        <h3>2. 開房 / 進房</h3>
        <input id="roomIdInput" placeholder="輸入房號（留空就開新房間）">
        <button onclick="createOrJoinRoom()">開啟 / 進入房間</button>
        <div id="roomInfo"></div>
    </div>

    <div class="box">
        <h3>3. 等候區</h3>
        <div id="waitArea"></div>
        <button onclick="setReady()">標記準備好</button>
    </div>

    <div class="box">
        <h3>4. 錄製音訊</h3>
        <div id="permWarning" class="tip-perm" style="display:none;">
            ⚠️ 麥克風被封鎖！按網址左邊🔒鎖頭，開啟麥克風權限，刷新頁面
        </div>
        <p>第一段：提示「請你講 包剪揼/Rock Paper Scissors shoot」</p>
        <div id="recTip1"></div>
        <button id="btnRec1" onclick="toggleRecord(1)">錄音 1</button>
        <button id="btnPlay1" onclick="playAudio(1)">試聽1</button>

        <p>第二段：提示「當你贏咗你會講咩」</p>
        <div id="recTip2"></div>
        <button id="btnRec2" onclick="toggleRecord(2)">錄音 2</button>
        <button id="btnPlay2" onclick="playAudio(2)">試聽2</button>

        <audio id="audio1">
        <audio id="audio2">
    </div>

    <div class="box">
        <h3>5. 揀遊戲模式</h3>
        <select id="gameMode">
            <option value="one">一鋪定勝負</option>
            <option value="best2">贏兩鋪</option>
            <option value="best3">贏三鋪</option>
            <option value="streak2">連贏兩鋪</option>
        </select>
        <button onclick="startGame()">開始遊戲</button>
    </div>

    <div class="box">
        <h3>遊戲區</h3>
        <div class="score" id="scoreBox">分數：你 0 ｜ 對手 0</div>
        <!-- 拳頭圖片顯示區域 -->
        <div class="handContainer" id="handBox"></div>
        <div id="gameResult" class="result-text"></div>
        <div id="gameArea">等待出拳</div>
        <div>
            <button id="btnRock" onclick="selectHand('rock')">石頭</button>
            <button id="btnPaper" onclick="selectHand('paper')">布</button>
            <button id="btnScissors" onclick="selectHand('scissors')">剪刀</button>
        </div>
    </div>

    <div class="box">
        <h3>🔍 測試視窗 (Debug Log)</h3>
        <div id="debugLog"></div>
    </div>

<script>
// 日誌函數
function log(msg){
    const d = new Date();
    const time = d.getHours()+":"+String(d.getMinutes()).padStart(2,'0')+":"+String(d.getSeconds()).padStart(2,'0');
    const logDiv = document.getElementById("debugLog");
    logDiv.innerText += `[${time}] ${msg}\n`;
    logDiv.scrollTop = logDiv.scrollHeight;
    console.log(msg);
}

// 模擬房間數據
let roomId = null;
let myName = "";
let playerList = [];
let mediaRecorder = null;
let activeRecNum = null;
let audioChunks = [];
let audioBuffers = [null,null];
let isReady = false;

// 遊戲變數
let gameStarted = false;
let scorePlayer = 0;
let scoreOpp = 0;
let winStreak = 0;
let gameMode = "one";

// 本輪選擇狀態
let playerSelected = null;
let oppSelected = null;
let allHandChosen = false;

const nameMap = {
    rock:"石頭",
    paper:"布",
    scissors:"剪刀"
};
// 圖片檔名對應，完全配你倉庫入面嘅名
const imgMap = {
    rock:"rock.jpg",
    paper:"paper.jpg",
    scissors:"scissors.jpg"
};

const audio1 = document.getElementById("audio1");
const audio2 = document.getElementById("audio2");
const handBox = document.getElementById("handBox");

window.onload = function(){
    log("🚀 網頁載入完成，版本 v1.7｜加入拳頭圖片");
}

// 開房 / 入房
function createOrJoinRoom(){
    log("👉 點擊【開啟/進入房間】");
    myName = document.getElementById("playerName").value.trim();
    if(!myName){
        log("⚠️ 錯誤：沒有輸入玩家名稱");
        alert("請輸入名稱");
        return;
    }
    let inputRoom = document.getElementById("roomIdInput").value.trim();
    roomId = inputRoom || Math.random().toString(36).slice(2,8);
    document.getElementById("roomInfo").innerText = "房號："+roomId;
    log("✅ 房號設定為：" + roomId);

    playerList = [
        {name:myName, inRoom:true, ready:false},
        {name:"模擬玩家", inRoom:true, ready:false}
    ];
    renderWaitArea();
    log("✅ 已進房間，等候區載入成功（模擬玩家已加入）");
}

// 渲染等候區
function renderWaitArea(){
    let html="";
    for(let p of playerList){
        html += `<div class="player-item">${p.name}
        <span class="inroom-tag">【已進房間】</span>
        ${p.ready?'<span class="ready-tag">【準備好】</span>':''}
        </div>`;
    }
    document.getElementById("waitArea").innerHTML = html;
}

// 標記準備好
function setReady(){
    log("👉 點擊【標記準備好】");
    if(!roomId){
        log("⚠️ 尚未加入任何房間");
        return;
    }
    isReady = true;
    playerList[0].ready = true;
    playerList[1].ready = true;
    renderWaitArea();
    log("✅ 你同模擬玩家都標記【準備好】");
}

// 切換錄音 / 停止錄音
async function toggleRecord(num){
    if(mediaRecorder && activeRecNum === num){
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track=>track.stop());
        mediaRecorder = null;
        log(`🛑 手動停止錄音 ${num}`);
        document.getElementById(`btnRec${num}`).innerText = "錄音 "+num;
        document.getElementById(`btnRec${num}`).classList.remove("btn-rec-stop");
        document.getElementById(`recTip${num}`).innerText = "";
        activeRecNum = null;
        const other = num===1?2:1;
        document.getElementById(`btnRec${other}`).disabled = false;
        return;
    }

    if(mediaRecorder){
        log(`⚠️ 而家正在錄緊另一個音軌，請先停止`);
        return;
    }

    try{
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        mediaRecorder = new MediaRecorder(stream);
        activeRecNum = num;
        audioChunks = [];
        mediaRecorder.ondataavailable = e=>audioChunks.push(e.data);
        mediaRecorder.onstop = ()=>{
            const blob = new Blob(audioChunks,{type:"audio/mpeg"});
            audioBuffers[num-1] = URL.createObjectURL(blob);
            log(`✅ 錄音${num}完成，可以試聽`);
        }
        mediaRecorder.start();
        log(`🎙️ 開始錄音 ${num}`);
        document.getElementById(`btnRec${num}`).innerText = "停止錄音";
        document.getElementById(`btnRec${num}`).classList.add("btn-rec-stop");
        document.getElementById(`recTip${num}`).innerHTML = `<span class="tip-rec">🔴 錄音進行中，講完之後請按「停止錄音」</span>`;
        document.getElementById("permWarning").style.display="none";
        const other = num===1?2:1;
        document.getElementById(`btnRec${other}`).disabled = true;
    }catch(e){
        log(`❌ 錄音${num}失敗：${e.message}，請允許麥克風權限`);
        document.getElementById("permWarning").style.display="block";
    }
}

function playAudio(num){
    log(`👉 試聽錄音 ${num}`);
    if(!audioBuffers[num-1]){
        log(`⚠️ 錄音${num}尚未錄製`);
        return alert("尚未錄音");
    }
    const aud = (num===1) ? audio1 : audio2;
    aud.src = audioBuffers[num-1];
    aud.play();
}

// 開始遊戲
function startGame(){
    log("👉 點擊【開始遊戲】");
    if(!roomId){
        log("⚠️ 未進入房間，無法開始");
        return;
    }
    gameMode = document.getElementById("gameMode").value;
    gameStarted = true;
    scorePlayer = 0;
    scoreOpp = 0;
    winStreak = 0;
    updateScore();
    document.getElementById("gameResult").innerText = "";
    handBox.innerHTML = ""; // 清空拳圖
    resetRound();
    log(`✅ 遊戲啟動，模式:${gameMode}`);
}

// 重置本輪
function resetRound(){
    playerSelected = null;
    oppSelected = null;
    allHandChosen = false;
    document.getElementById("gameArea").innerText = "請揀石頭 / 布 / 剪刀";
    enableHandButtons(true);
    handBox.innerHTML = "";
}

function enableHandButtons(enable){
    document.getElementById("btnRock").disabled = !enable;
    document.getElementById("btnPaper").disabled = !enable;
    document.getElementById("btnScissors").disabled = !enable;
}

function updateScore(){
    document.getElementById("scoreBox").innerText = `分數：你 ${scorePlayer} ｜ 對手 ${scoreOpp}`;
}

// 判輸贏
function getResult(player, opp){
    if(player === opp) return "draw";
    if(
        (player==="rock" && opp==="scissors") ||
        (player==="paper" && opp==="rock") ||
        (player==="scissors" && opp==="paper")
    ) return "win";
    return "lose";
}

// 玩家揀拳
function selectHand(sel){
    if(!gameStarted){
        log("⚠️ 請先按「開始遊戲」");
        return;
    }
    if(playerSelected){
        log("⚠️ 你已經揀咗，等對手");
        return;
    }
    playerSelected = sel;
    log(`👉 玩家揀咗：${sel}`);
    document.getElementById("gameArea").innerText = `你已經揀咗：${nameMap[sel]}，等待對手...`;
    enableHandButtons(false);

    // 模擬對手揀拳
    const oppList = ["rock","paper","scissors"];
    oppSelected = oppList[Math.floor(Math.random()*3)];
    log(`🤖 對手揀咗：${oppSelected}`);

    // 雙方都揀好
    allHandChosen = true;
    log("✅ 所有人都揀好，播放開局錄音");

    // 播放第一段錄音
    if(audioBuffers[0]){
        audio1.src = audioBuffers[0];
        // 監聽音訊完結事件
        audio1.onended = function(){
            showRoundResult();
        }
        audio1.play();
    }else{
        // 如果冇錄音，直接顯示結果
        showRoundResult();
    }
}

function showRoundResult(){
    const sel = playerSelected;
    const oppSel = oppSelected;
    const res = getResult(sel, oppSel);
    let showText = `你：${nameMap[sel]}｜對手：${nameMap[oppSel]}`;
    let finalMsg = "";

    // 顯示兩邊拳頭圖片
    handBox.innerHTML = `
        <div>
            <img class="handImg" src="${imgMap[sel]}" alt="${nameMap[sel]}">
            <div style="text-align:center">你</div>
        </div>
        <div>
            <img class="handImg" src="${imgMap[oppSel]}" alt="${nameMap[oppSel]}">
            <div style="text-align:center">對手</div>
        </div>
    `;

    if(res === "win"){
        scorePlayer++;
        winStreak++;
        showText += "\n🎉 你贏咗！";
        // 播放勝利錄音2
        if(audioBuffers[1]){
            audio2.src = audioBuffers[1];
            audio2.play();
        }
    }else if(res === "lose"){
        scoreOpp++;
        winStreak = 0;
        showText += "\n😞 你輸咗";
    }else{
        // 平手：分數不變，重置連勝記錄
        winStreak = 0;
        showText += "\n🤝 平手！繼續下一鋪";
    }

    // 檢查遊戲是否完結
    let gameEnd = false;
    if(res !== "draw"){
        if(gameMode === "one"){
            gameEnd = true;
        }else if(gameMode === "best2"){
            if(scorePlayer >=2 || scoreOpp >=2) gameEnd = true;
        }else if(gameMode === "best3"){
            if(scorePlayer >=3 || scoreOpp >=3) gameEnd = true;
        }else if(gameMode === "streak2"){
            if(winStreak >=2) gameEnd = true;
        }
    }

    if(gameEnd){
        gameStarted = false;
        finalMsg = scorePlayer>scoreOpp ? "\n🏆 恭喜你贏咗成局！" : "\n💔 今局輸咗，再試過！";
    }

    document.getElementById("gameResult").innerText = showText + finalMsg;
    updateScore();
    log(`✅ 本局結果：${res}，當前連勝：${winStreak}`);

    if(gameEnd){
        log(`🏁 遊戲完結，${finalMsg}`);
    }else{
        setTimeout(()=>{
            resetRound();
        },2000);
    }
}
</script>
</body>
</html>
