<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>包剪揼多人對戰 v1.3</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;}
body{padding:16px;max-width:480px;margin:0 auto;background:#f7f9fc;}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #00000014;}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-size:18px;color:white;background:#2b78e4;margin:8px 0;}
.btn:disabled{background:#aaa;}
.btn-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.debug{background:#111;color:#3f3;padding:12px;border-radius:8px;font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:220px;overflow:auto;}
.ready-ok{color:#28a745;font-weight:bold;}
.ready-wait{color:#999;}
.input-name{width:100%;padding:14px;font-size:18px;border:1px solid #ccc;border-radius:12px;}
</style>
</head>
<body>

<!-- 名字輸入頁面（取代彈窗） -->
<div class="card" id="nameInputCard">
<h2 style="text-align:center">輸入你的名稱</h2>
<input class="input-name" id="nameInput" placeholder="輸入名字">
<button class="btn" id="nameConfirmBtn">確認</button>
</div>

<!-- 遊戲主介面，預設隱藏 -->
<div id="gameMain" style="display:none">
<div class="card">
<h1 style="text-align:center">✊✌✋ 包剪揼多人對戰</h1>
<div>版本: v1.3 | 移除名字彈窗，修復準備狀態同步</div>
<div id="roomInfo"></div>
<div>連線狀態: <span id="connStatus">等待其他人...</span></div>
</div>

<div class="card">
<h3>等候區</h3>
<div id="playerList"></div>
</div>

<div class="card">
<h3>錄音設定（錄完會自動發送俾對方）</h3>
<button class="btn" id="rec1Btn">開始錄音(包剪揼口令)</button>
<button class="btn" id="play1Btn">試聽我的口令</button>
<button class="btn" id="rec2Btn">開始錄音(勝利語)</button>
<button class="btn" id="play2Btn">試聽我的勝利語</button>
<p>錄製完成自動透過P2P傳送給對方，實現大合唱效果</p>
<button class="btn" id="readyBtn">✅ 我準備好</button>
<button class="btn" style="background:#666" id="leaveBtn">🚪 離開房間</button>
</div>

<div class="card" id="modePanel">
<h3>選擇遊戲模式</h3>
<div class="btn-wrap">
<button class="btn" data-mode="one">一鋪定勝負</button>
<button class="btn" data-mode="win2">贏兩鋪</button>
<button class="btn" data-mode="win3">贏三鋪</button>
<button class="btn" data-mode="con2">連贏兩鋪</button>
</div>
</div>

<div class="card" id="gamePanel" style="display:none">
<h3>請選擇：包 / 剪 / 揼</h3>
<div class="btn-wrap">
<button class="btn" data-hand="rock">✊ 包</button>
<button class="btn" data-hand="scissors">✌ 剪</button>
<button class="btn" data-hand="paper">✋ 揼</button>
</div>
<div id="scoreText">我分數:0 | 對手分數:0 | 連贏:0</div>
</div>

<div class="card">
<h3>Debug 測試視窗</h3>
<div class="debug" id="debugLog"></div>
</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
const $ = s=>document.querySelector(s);
const $$ = s=>document.querySelectorAll(s);
const debugLog = $("#debugLog");
function log(msg){
  const t = new Date().toLocaleTimeString();
  debugLog.textContent += `[${t}] ${msg}\n`;
  debugLog.scrollTop = debugLog.scrollHeight;
}

// 狀態
let peer, conn;
let roomId;
let myName = "";
let isHost = false;
let players = {};
let myReady = false;
let audio1 = null, audio2=null;
let remoteAudio1=null, remoteAudio2=null;
let gameMode = null;
let myHand=null, remoteHand=null;
let scoreMe=0, scoreOpp=0, streak=0;

// 【名字確認按鈕，取代prompt彈窗】
$("#nameConfirmBtn").onclick = function(){
  myName = $("#nameInput").value.trim();
  if(!myName){
    alert("請輸入名字");
    return;
  }
  $("#nameInputCard").style.display="none";
  $("#gameMain").style.display="block";
  log(`玩家名字設定: ${myName}`);
  $("#playerList").innerText = "";
  players[myName] = {name:myName,ready:false};
  renderPlayerList();

  const opt = confirm("開啟房間按【確定】，加入房間按【取消】");
  if(opt){
    isHost=true;
    roomId = Math.random().toString(36).slice(2,8).toUpperCase();
    $("#roomInfo").innerText = `房號：${roomId}\n將上面房號發送俾朋友`;
    startPeer(true);
  }else{
    isHost=false;
    roomId = prompt("輸入房號");
    $("#roomInfo").innerText = `房號：${roomId}`;
    startPeer(false);
  }
}

function startPeer(host){
  peer = new Peer();
  peer.on("open", pid=>{
    log(`PeerID:${pid}`);
    if(!host){
      conn = peer.connect(roomId);
      bindConnEvents();
    }
  })
  peer.on("connection",c=>{
    log("有玩家接入");
    conn = c;
    bindConnEvents();
  })
  peer.on("error",err=>log("Peer錯誤:"+err));
}

function bindConnEvents(){
  $("#connStatus").textContent="已連線";
  conn.on("open",()=>{
    log("連線成功");
    if(!isHost) sendMsg({type:"JOIN",name:myName});
  })
  conn.on("data",data=>{
    log("收到訊息："+JSON.stringify(data));
    switch(data.type){
      case "JOIN":
        players[data.name]={name:data.name,ready:false};
        sendPlayerList();
        renderPlayerList();
        break;
      case "PLAYER_LIST":
        players = data.list;
        renderPlayerList();
        checkAllReady();
        break;
      case "AUDIO_BLOB":
        if(data.a==1) remoteAudio1 = new Audio(URL.createObjectURL(data.blob));
        if(data.a==2) remoteAudio2 = new Audio(URL.createObjectURL(data.blob));
        break;
      case "GAME_START":
        gameMode = data.mode;
        $("#modePanel").style.display="none";
        $("#gamePanel").style.display="block";
        break;
      case "HAND":
        remoteHand = data.hand;
        checkGameResult();
        break;
    }
  })
}

// ========== 重點修復：更新玩家清單並廣播 ==========
function sendPlayerList(){
  const list = Object.values(players);
  sendMsg({type:"PLAYER_LIST", list});
}
function sendMsg(obj){
  if(conn && conn.open) conn.send(obj);
}
function renderPlayerList(){
  let html="";
  Object.values(players).forEach(p=>{
    const cls = p.ready ? "ready-ok" : "ready-wait";
    const icon = p.ready ? "✅已準備" : "⏳未準備";
    html += `<div class="${cls}">${p.name} ${icon}</div>`;
  })
  $("#playerList").innerHTML = html;
}

// 【我準備好】按鈕
$("#readyBtn").onclick = function(){
  myReady = !myReady;
  players[myName].ready = myReady;
  sendPlayerList();
  renderPlayerList();
  log(`${myName} 設定準備狀態:${myReady}`);
  checkAllReady();
}

function checkAllReady(){
  const allReady = Object.values(players).every(p=>p.ready===true);
  if(allReady && isHost){
    log("全部玩家已準備，可以揀遊戲
