<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>包剪揼大合唱 V2.0</title>
    
    <script>
        // 提早攔截錯誤
        window.onerror = function(message, source, lineno, colno, error) {
            const debugDiv = document.getElementById('debug-window');
            if (debugDiv) {
                const p = document.createElement('p');
                p.className = 'debug-error';
                p.innerText = `[系統嚴重錯誤] ${message} (行: ${lineno})`;
                debugDiv.appendChild(p);
            }
            return false;
        };
    </script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; overflow: hidden; background-color: #333; }
        .page { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; background-size: cover; background-position: center; background-repeat: no-repeat; box-sizing: border-box; padding: 20px; padding-bottom: 120px; }
        .page.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        #page1 { background-image: url('background01.jpg'); }
        #page2 { background-image: url('background02.jpg'); }
        #page3 { background-image: url('background03.jpg'); }
        #page4 { background-image: url('background04.jpg'); }
        #page5 { background-image: url('background05.jpg'); }

        .panel { background: rgba(255, 255, 255, 0.95); padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); max-height: 85vh; overflow-y: auto; }
        input, button, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:active { background: #0056b3; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        .btn-success { background: #28a745; }
        
        #player-list, #resultList { list-style: none; padding: 0; margin: 0; text-align: left; max-height: 150px; overflow-y: auto; }
        #player-list li, #resultList li { padding: 8px 0; border-bottom: 1px solid #ddd; font-size: 16px; }
        
        .rps-buttons { display: flex; justify-content: space-around; margin-top: 20px; }
        .rps-buttons img { width: 80px; height: 80px; object-fit: contain; cursor: pointer; border-radius: 50%; transition: transform 0.1s; border: 4px solid transparent; background: rgba(255,255,255,0.5); padding: 5px; }
        .rps-buttons img:active { transform: scale(0.9); }
        .rps-buttons img.selected { border-color: gold; box-shadow: 0 0 15px gold; }
        .hidden { display: none !important; }
        #countdown { font-size: 60px; color: #dc3545; margin: 10px 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

        #debug-window { position: fixed; bottom: 0; left: 0; width: 100%; height: 100px; background: rgba(0, 0, 0, 0.9); color: #00ff00; font-family: monospace; font-size: 12px; padding: 10px; box-sizing: border-box; overflow-y: auto; z-index: 9999; border-top: 2px solid #555; }
        #debug-window p { margin: 2px 0; word-wrap: break-word; }
        .debug-error { color: #ff4444 !important; font-weight: bold; }
        .debug-warn { color: #ffbb33 !important; }
        .debug-info { color: #33b5e5 !important; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="page1" class="page active">
        <div class="panel">
            <h2>✊✌️✋ 包剪揼大合唱</h2>
            <input type="text" id="playerName" placeholder="輸入你的名字" maxlength="10" value="Louis">
            <button class="btn-success" id="btnCreateRoom">建立房間 (成為房主)</button>
            <hr style="margin: 20px 0; border: 1px solid #ddd;">
            <input type="text" id="roomCodeInput" placeholder="輸入4位數字房間號碼" maxlength="4" inputmode="numeric">
            <button id="btnJoinRoom">加入房間 (成為房客)</button>
        </div>
    </div>

    <div id="page2" class="page">
        <div class="panel">
            <h2>房間號碼: <span id="displayRoomCode" style="color: #dc3545; font-size: 32px;"></span></h2>
            <h3>玩家列表</h3>
            <ul id="player-list"></ul>
            <hr style="margin: 15px 0; border: 1px solid #ddd;">
            <h3>🎤 錄製你的專屬音效</h3>
            <div style="margin-bottom: 15px;">
                <p style="margin: 5px 0; font-weight: bold;">1. 包剪揼音效 (3秒)</p>
                <button id="btnRecordRPS">開始錄音</button>
                <audio id="audioRPS" controls class="hidden" style="width: 100%; margin-top: 5px;"></audio>
            </div>
            <div style="margin-bottom: 15px;">
                <p style="margin: 5px 0; font-weight: bold;">2. 勝利宣言 (3秒)</p>
                <button id="btnRecordVictory">開始錄音</button>
                <audio id="audioVictory" controls class="hidden" style="width: 100%; margin-top: 5px;"></audio>
            </div>
            <hr style="margin: 15px 0; border: 1px solid #ddd;">
            <div id="hostControls" class="hidden">
                <h3>房主設定</h3>
                <select id="gameMode">
                    <option value="1">一鋪定勝負</option>
                    <option value="2">贏兩鋪</option>
                    <option value="3">贏三鋪</option>
                    <option value="streak2">連贏兩鋪</option>
                </select>
                <button class="btn-success" id="btnStartGame" style="margin-top: 15px; background: #dc3545;">🚀 開始遊戲</button>
            </div>
            <p id="waitingMsg" class="hidden" style="color: #007bff; font-weight: bold;">等待房主開始遊戲...</p>
        </div>
    </div>

    <div id="page3" class="page">
        <div class="panel">
            <h3 style="margin-top: 0;">模式: <span id="displayGameMode" style="color: #007bff;"></span></h3>
            <div style="font-size: 14px; margin-bottom: 10px; background: #eee; padding: 10px; border-radius: 8px;">分數：<br><span id="scoreBoard">無</span></div>
            <h3>請出拳！</h3>
            <div class="rps-buttons">
                <img src="paper.jpg" id="btn-paper" alt="包">
                <img src="scissors.jpg" id="btn-scissors" alt="剪">
                <img src="rock.jpg" id="btn-rock" alt="揼">
            </div>
            <p id="statusText" style="margin-top: 20px; font-weight: bold; color: #dc3545; min-height: 24px;"></p>
        </div>
    </div>

    <div id="page4" class="page">
        <div class="panel">
            <h2 style="margin-top: 0;">📢 本回合結果</h2>
            <ul id="resultList"></ul>
            <div id="countdown">3</div>
        </div>
    </div>

    <div id="page5" class="page">
        <div class="panel">
            <h1 style="margin-top: 0;">🏆 最終勝利者 🏆</h1>
            <h2 id="winnerName" style="color: #d4af37; font-size: 36px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);"></h2>
            <button id="btnRestart" style="margin-top: 20px;">回到首頁</button>
        </div>
    </div>

    <!-- 請確認這裡的文字是不是 V2.0 -->
    <div id="debug-window">
        <p class="debug-info">[系統] 版本 V2.0，準備初始化 Firebase...</p>
    </div>

    <script>
        // ==========================================
        // 0. Debug 系統
        // ==========================================
        const debugDiv = document.getElementById('debug-window');
        function logToScreen(msg, type = 'info') {
            const p = document.createElement('p');
            p.className = `debug-${type}`;
            p.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            debugDiv.appendChild(p);
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }

        // ==========================================
        // 1. Firebase 初始化 (你的專屬設定)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBUI5N2IZO_2erP6nNHuWB-Q6T7Mrjl_m0",
            authDomain: "game-ad81e.firebaseapp.com",
            databaseURL: "https://game-ad81e-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "game-ad81e",
            storageBucket: "game-ad81e.firebasestorage.app",
            messagingSenderId: "524468263754",
            appId: "1:524468263754:web:6ff2273f778277cf22ffb3"
        };

        let db = null;
        try {
            if (typeof firebase === 'undefined') {
                throw new Error("Firebase SDK 未載入，請檢查網絡。");
            }
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.database();
            logToScreen("Firebase 初始化成功", 'info');
            
            db.ref('.info/connected').on('value', (snap) => {
                if (snap.val() === true) {
                    logToScreen("已連線至 Firebase 資料庫", 'info');
                } else {
                    logToScreen("正在連線至 Firebase...", 'warn');
                }
            });
        } catch (e) {
            logToScreen("Firebase 初始化失敗: " + e.message, 'error');
        }

        // ==========================================
        // 2. 全局變數
        // ==========================================
        let myName = "";
        let roomCode = "";
        let isHost = false;
        let playersData = {};
        let currentGameMode = "1";
        let currentScores = {};
        let currentStreak = {};

        // ==========================================
        // 3. 按鈕綁定 (確保 DOM 載入後才綁定)
        // ==========================================
        document.getElementById('btnCreateRoom').addEventListener('click', createRoom);
        document.getElementById('btnJoinRoom').addEventListener('click', joinRoom);
        document.getElementById('btnStartGame').addEventListener('click', startGame);
        document.getElementById('btnRecordRPS').addEventListener('click', () => startRecording('rps'));
        document.getElementById('btnRecordVictory').addEventListener('click', () => startRecording('victory'));
        document.getElementById('btnRestart').addEventListener('click', () => location.reload());
        
        document.getElementById('btn-paper').addEventListener('click', () => makeChoice('paper'));
        document.getElementById('btn-scissors').addEventListener('click', () => makeChoice('scissors'));
        document.getElementById('btn-rock').addEventListener('click', () => makeChoice('rock'));

        // ==========================================
        // 4. 房間邏輯
        // ==========================================
        function createRoom() {
            logToScreen("點擊了建立房間");
            if (!db) return alert("Firebase 未初始化，請查看 Debug 視窗。");
            
            myName = document.getElementById('playerName').value.trim();
            if (!myName) return alert("請輸入名字");
            
            const btn = document.getElementById('btnCreateRoom');
            btn.innerText = "建立中...";
            btn.disabled = true;
            
            roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            isHost = true;
            logToScreen(`嘗試建立房間: ${roomCode}`);
            
            db.ref('rooms/' + roomCode).set({
                status: 'waiting',
                mode: '1',
                host: myName,
                players: { [myName]: { ready: false, rpsAudio: null, victoryAudio: null } }
            }).then(() => {
                logToScreen(`房間 ${roomCode} 建立成功`);
                enterRoom();
            }).catch(err => {
                logToScreen(`建立失敗: ${err.message}`, 'error');
                alert("建立失敗，請查看下方 Debug 視窗");
                btn.innerText = "建立房間 (成為房主)";
                btn.disabled = false;
            });
        }

        function joinRoom() {
            logToScreen("點擊了加入房間");
            if (!db) return alert("Firebase 未初始化，請查看 Debug 視窗。");
            
            myName = document.getElementById('playerName').value.trim();
            roomCode = document.getElementById('roomCodeInput').value.trim();
            if (!myName || roomCode.length !== 4) return alert("請輸入名字及4位數字房間號碼");
            
            const btn = document.getElementById('btnJoinRoom');
            btn.innerText = "加入中...";
            btn.disabled = true;
            logToScreen(`嘗試加入房間: ${roomCode}`);
            
            const roomRef = db.ref('rooms/' + roomCode);
            roomRef.once('value').then(snapshot => {
                if (!snapshot.exists()) throw new Error("房間不存在");
                const data = snapshot.val();
                if (data.status !== 'waiting') throw new Error("遊戲已開始或房間已關閉");
                if (Object.keys(data.players || {}).length >= 8) throw new Error("房間已滿");
                
                return roomRef.child('players/' + myName).set({ ready: false, rpsAudio: null, victoryAudio: null });
            }).then(() => {
                logToScreen(`成功加入房間 ${roomCode}`);
                enterRoom();
            }).catch(err => {
                logToScreen(`加入失敗: ${err.message}`, 'error');
                alert("加入失敗: " + err.message);
                btn.innerText = "加入房間 (成為房客)";
                btn.disabled = false;
            });
        }

        function enterRoom() {
            document.getElementById('page1').classList.remove('active');
            document.getElementById('page2').classList.add('active');
            document.getElementById('displayRoomCode').innerText = roomCode;
            
            if (isHost) {
                document.getElementById('hostControls').classList.remove('hidden');
            } else {
                document.getElementById('waitingMsg').classList.remove('hidden');
            }
            
            db.ref('rooms/' + roomCode).on('value', snapshot => {
                const data = snapshot.val();
                if (!data) {
                    logToScreen("房間資料已被清除", 'warn');
                    return;
                }
                
                playersData = data.players || {};
                updatePlayerList();
                
                if (data.status === 'playing' && !document.getElementById('page3').classList.contains('active')) {
                    currentGameMode = data.mode;
                    currentScores = data.scores || {};
                    currentStreak = data.streak || {};
                    
                    document.getElementById('displayGameMode').innerText = getModeText(currentGameMode);
                    updateScoreBoard();
                    
                    document.getElementById('page2').classList.remove('active');
                    document.getElementById('page3').classList.add('active');
                    logToScreen("遊戲開始！");
                }
            });
        }

        function updatePlayerList() {
            const ul = document.getElementById('player-list');
            ul.innerHTML = '';
            for (let p in playersData) {
                let isMe = (p === myName) ? "(你)" : "";
                let status = playersData[p].ready ? "✅ 已準備" : "⏳ 未準備";
                ul.innerHTML += `<li>👤 ${p} ${isMe} - ${status}</li>`;
            }
        }

        // ==========================================
        // 5. 錄音邏輯
        // ==========================================
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        
        async function startRecording(type) {
            if (isRecording) return;
            logToScreen(`開始錄音 (${type})`);
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                isRecording = true;

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    isRecording = false;
                    logToScreen(`錄音結束，處理音訊...`);
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        const base64Audio = reader.result;
                        db.ref(`rooms/${roomCode}/players/${myName}/${type}Audio`).set(base64Audio)
                          .then(() => logToScreen(`音訊上傳成功 (${type})`))
                          .catch(e => logToScreen(`音訊上傳失敗: ${e.message}`, 'error'));
                        
                        const audioEl = document.getElementById(type === 'rps' ? 'audioRPS' : 'audioVictory');
                        audioEl.src = base64Audio;
                        audioEl.classList.remove('hidden');
                        checkReadyStatus();
                    };
                };

                mediaRecorder.start();
                const btn = document.getElementById(type === 'rps' ? 'btnRecordRPS' : 'btnRecordVictory');
                let timeLeft = 3;
                btn.innerText = `錄音中... ${timeLeft}s`;
                btn.disabled = true;

                const timer = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        btn.innerText = `錄音中... ${timeLeft}s`;
                    } else {
                        clearInterval(timer);
                        mediaRecorder.stop();
                        btn.innerText = "重新錄音";
                        btn.disabled = false;
                        stream.getTracks().forEach(track => track.stop());
                    }
                }, 1000);

            } catch (err) {
                logToScreen(`錄音失敗: ${err.message}`, 'error');
                alert("無法錄音，請確認麥克風權限！");
            }
        }

        function checkReadyStatus() {
            const p = playersData[myName];
            if (p && p.rpsAudio && p.victoryAudio) {
                db.ref(`rooms/${roomCode}/players/${myName}/ready`).set(true)
                  .then(() => logToScreen("你已準備就緒"));
            }
        }

        // ==========================================
        // 6. 遊戲邏輯
        // ==========================================
        function startGame() {
            const mode = document.getElementById('gameMode').value;
            for (let p in playersData) {
                if (!playersData[p].ready) return alert(`玩家 ${p} 尚未準備好！`);
            }
            
            let initScores = {}; let initStreak = {};
            for (let p in playersData) { initScores[p] = 0; initStreak[p] = 0; }

            db.ref('rooms/' + roomCode).update({
                status: 'playing', mode: mode, scores: initScores, streak: initStreak, choices: null
            }).then(() => logToScreen("房主已啟動遊戲"));
        }

        function getModeText(mode) {
            if (mode === '1') return "一鋪定勝負";
            if (mode === '2') return "贏兩鋪";
            if (mode === '3') return "贏三鋪";
            if (mode === 'streak2') return "連贏兩鋪";
        }

        function updateScoreBoard() {
            let str = Object.keys(currentScores).map(p => `${p}: ${currentScores[p]}分`).join(' | ');
            document.getElementById('scoreBoard').innerText = str;
        }

function makeChoice(choice) {
    document.querySelectorAll('.rps-buttons img').forEach(img => img.classList.remove('selected'));
    document.getElementById('btn-' + choice).classList.add('selected');
    document.getElementById('statusText').innerText = "等待其他玩家出拳...";
    logToScreen(`你選擇了: ${choice}`);
    
    db.ref(`rooms/${roomCode}/choices/${myName}`).set(choice).then(() => {
        db.ref(`rooms/${roomCode}/choices`).once('value', snapshot => {
            const choices = snapshot.val();
            if (Object.keys(choices).length === Object.keys(playersData).length) {
                if (isHost) db.ref(`rooms/${roomCode}/status`).set('calculating');
            }
        });
    });
}
