<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase 連線測試</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
    button { padding: 10px 20px; font-size: 16px; margin: 5px 0; }
    #debug { margin-top: 20px; padding: 15px; background: #000; color: #0f0; font-family: monospace; min-height: 200px; }
  </style>
</head>
<body>
  <h1>Firebase Realtime Database 測試</h1>
  <button id="btnConnect">測試連接</button>
  <button id="btnWrite">寫測試資料入 rooms</button>
  <div id="debug">Debug 準備就緒...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBUI5N2IZO_2erP6nNHuWB-Q6T7Mrjl_m0",
      authDomain: "game-ad81e.firebaseapp.com",
      databaseURL: "https://game-ad81e-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "game-ad81e",
      storageBucket: "game-ad81e.firebasestorage.app",
      messagingSenderId: "你自己補返",
      appId: "你自己補返"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const debugBox = document.getElementById("debug");

    function log(msg) {
      debugBox.textContent += "\n" + msg;
    }

    document.getElementById("btnConnect").addEventListener("click", () => {
      log("嘗試連接 Firebase...");
      const testRef = ref(db, "rooms/test");
      onValue(testRef, (snap) => {
        log("✅ Firebase 連接成功，可以讀資料");
      }, (err) => {
        log("❌ 連接失敗：" + err.message);
      });
    });

    document.getElementById("btnWrite").addEventListener("click", async () => {
      log("嘗試寫入測試資料...");
      const testRef = ref(db, "rooms/test");
      try {
        await set(testRef, { message: "測試成功！可以寫入 rooms" });
        log("✅ 寫入成功！資料庫規則正常");
      } catch (err) {
        log("❌ 寫入失敗：" + err.message);
      }
    });
  </script>
</body>
</html>
