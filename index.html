<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial‑scale=1.0"/>
<title>包剪揼多人同步 v1.6</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{overflow-x:hidden}
.page{display:none;padding:16px;min-height:92vh}
.page.active{display:block}
#debug{position:fixed;bottom:0;left:0;width:100%;background:#111;color:#4f4;padding:8px;font-size:12px;max-height:18vh;overflow-y:auto;z-index:9999}
.ver{position:fixed;top:12px;right:12px;background:#0008;color:#fff;padding:4px 8px;border-radius:8px}
button{padding:14px 22px;font-size:17px;margin:6px;border-radius:12px;border:none;background:#fff;box-shadow:0 2px 6px #0002}
input{width:100%;padding:14px;font-size:17px;margin:8px 0;border-radius:10px;border:1px solid #aaa}
h2{text-align:center;margin:20px 0}
h3{margin:14px 0}
</style>
</head>
<body>
<div class="ver">v1.6</div>

<!-- ========== 第1頁：輸入名字、建立 / 輸入房間 ========== -->
<div id="page1" class="page active" style="background:url('background01.jpg') center/cover">
<h2>開啟 / 進入房間</h2>
<input id="nameInput" placeholder="輸入你的玩家名稱">
<input id="roomInput" placeholder="輸入4位數房間號">
<button id="hostBtn">開啟房間</button>
<button id="joinBtn">進入房間</button>
</div>

<!-- ========== 第2頁：錄音 + 揀規則 ========== -->
<div id="page2" class="page" style="background:url('background02.jpg') center/cover">
<h2>房間號碼：<span id="roomDisplay">----</span></h2>
<h2>錄製音訊 & 設定遊戲</h2>
<input id="playerIdInp" placeholder="玩家ID" readonly>
<br>
<h3>第一段：包剪揼（大合唱用）</h3>
<button id="rec1Start">開始錄第一段</button>
<button id="rec1Stop">停止錄第一段</button>
<br>
<h3>第二段：勝利宣言</h3>
<button id="rec2Start">開始錄第二段</button>
<button id="rec2Stop">停止錄第二段</button>
<br>
<h3>房主選擇遊戲規則</h3>
<button data-rule="oneRound">一舖定勝負</button>
<button data-rule="win2">贏兩舖</button>
<button data-rule="win3">贏三舖</button>
<button data-rule="consec2">連贏兩舖</button>
<br>
<h3>在線玩家狀態</h3>
<div id="playerList"></div>
</div>

<!-- ========== 第3頁：出拳頁 ========== -->
<div id="page3" class="page" style="background:url('background03.jpg') center/cover">
<h2>請出拳</h2>
<button id="rock">包</button>
<button id="scissors">剪</button>
<button id="paper">揼</button>
</div>

<!-- ========== 第4頁：結果、倒數、淘汰邏輯 ========== -->
<div id="page4" class="page" style="background:url('background04.jpg') center/cover">
<h2>本輪出拳狀況</h2>
<div id="roundResult"></div>
<h2>勝利排行榜</h2>
<div id="rankBox"></div>
<h2>倒數：<span id="countDown">5</span></h2>
</div>

<!-- ========== 第5頁：完結頁 ========== -->
<div id="page5" class="page" style="background:url('background05.jpg') center/cover">
<h2>遊戲完結！</h2>
<div id="finalWinner"></div>
</div>

<!-- 常駐 Debug 視窗每一頁都見 -->
<div id="debug"></div>

<script>
// ========== Debug 工具 ==========
const debugDiv = document.querySelector("#debug");
function log(txt){
  const t = new Date().toLocaleString();
  debugDiv.innerHTML += `[${t}] ${txt}\n`;
  debugDiv.scrollTop = debugDiv.scrollHeight;
}

// ========== 全域變數 ==========
let app, db;
let myRoomId = null;
let myUid = "user_" + Math.random().toString(36).slice(2, 10);
let myName = "";

let mediaRecorder1, mediaRecorder2;
let audioChunks1 = [], audioChunks2 = [];
let audioB641 = null, audioB642 = null;

let roomRef, playersRef, gameRef;
let heartbeatTimer;
let localPlayers = {};
let gameRule = null;
let round = 0;
let myChoice = null;
let gamePhase = "ready";

// ---------------- 動態Import Firebase ----------------
async function initFB(){
  try{
    log("Step0：動態Import Firebase");
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js");
    const { getDatabase, ref, set, onValue, push, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js");
    window.fb = {ref,set,onValue,push,serverTimestamp};

    // ========= 替換返你自己嘅 firebase config！！ =========
    const firebaseConfig = {
      apiKey: "你的apiKey",
      authDomain: "xxx.firebaseapp.com",
      databaseURL: "https://xxx.firebaseio.com",
      projectId: "xxx",
      storageBucket: "xxx.appspot.com",
      messagingSenderId: "xxx",
      appId: "xxx"
    };

    app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    log("✅ Step1 Firebase 初始化成功");
    return true;
  }catch(e){
    log(`❌ initFB 異常:${e.message}`);
    return false;
  }
}

// 切頁函數
function goPage(pageId){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.querySelector("#"+pageId).classList.add("active");
  log(`➡️ 切換到 ${pageId}`);
}

// 生成4位隨機房號
function gen4DigitRoom(){
  return String(Math.floor(1000 + Math.random()*9000));
}

// Base64 <-> Blob 錄音工具
function blobToBase64(blob) {
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.readAsDataURL(blob);
  })
}

// ======== 心跳：每2秒寫入自己時間戳，用於檢測離線 ========
function startHeartBeat(){
  heartbeatTimer = setInterval(()=>{
    if(!roomRef) return;
    window.fb.set(fb.ref(db,`rooms/${myRoomId}/players/${myUid}/lastHb`), fb.serverTimestamp());
  },2000);
}

// 玩家清單渲染
function renderPlayerList(){
  const box = document.getElementById("playerList");
  let html = "";
  for(const pid in localPlayers){
    const p = localPlayers[pid];
    html += `<div>${p.name} ${p.ready ? "✅已準備" : "🔹進入房間"} ${p.eliminated?"❌已淘汰":""}</div>`
  }
  box.innerHTML = html;
}

// -------- 綁定錄音按鈕 --------
document.querySelector("#rec1Start").onclick = async ()=>{
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  mediaRecorder1 = new MediaRecorder(stream);
  audioChunks1 = [];
  mediaRecorder1.ondataavailable = e=>audioChunks1.push(e.data);
  mediaRecorder1.start();
  log("🎙️ 開始錄第一段(包剪揼)");
}
document.querySelector("#rec1Stop").onclick = async ()=>{
  mediaRecorder1.stop();
  mediaRecorder1.onstop = async ()=>{
    const blob = new Blob(audioChunks1,{type:"audio/webm"});
    audioB641 = await blobToBase64(blob);
    await window.fb.set(window.fb.ref(db,`rooms/${myRoomId}/players/${myUid}/voice1`), audioB641);
    localPlayers[myUid].ready = true;
    await window.fb.set(window.fb.ref(db,`rooms/${myRoomId}/players/${myUid}/ready`), true);
    log("✅ 第一段錄音上傳完成");
    renderPlayerList();
  }
}

document.querySelector("#rec2Start").onclick = async ()=>{
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  mediaRecorder2 = new MediaRecorder(stream);
  audioChunks2 = [];
  mediaRecorder2.ondataavailable = e=>audioChunks2.push(e.data);
  mediaRecorder2.start();
  log("🎙️ 開始錄第二段(勝利宣言)");
}
document.querySelector("#rec2Stop").onclick = async ()=>{
  mediaRecorder2.stop();
  mediaRecorder2.onstop = async ()=>{
    const blob = new Blob(audioChunks2,{type:"audio/webm"});
    audioB642 = await blobToBase64(blob);
    await window.fb.set(window.fb.ref(db,`rooms/${myRoomId}/players/${myUid}/voice2`), audioB642);
    log("✅ 第二段錄音上傳完成");
  }
}

// -------- 房主選擇遊戲規則 --------
document.querySelectorAll("[data-rule]").forEach(btn=>{
  btn.onclick = async ()=>{
    gameRule = btn.dataset.rule;
    log(`📜 房主選定規則：${gameRule}`);
    await window.fb.set(window.fb.ref(db,`rooms/${myRoomId}/gameRule`), gameRule);
    await window.fb.set(window.fb.ref(db,`rooms/${myRoomId}/state`), "roundStart");
  }
})

// -------- 出拳按鈕 --------
document.querySelector("#rock").onclick = async ()=>{myChoice="rock"; await window.fb.set(window.fb.ref(db,`rooms/${myRoomId}/players/${myUid}/choice`),"rock"); log("👊我出：包")}
document.querySelector("#scissors").onclick = async ()=>{myChoice="scissors"; await window.fb.set(window.fb.ref(db,`rooms/${myRoomId}/players/${myUid}/choice`),"scissors"); log("✂️我出：剪")}
document.querySelector("#paper").onclick = async ()=>{myChoice="paper"; await window.fb.set(window.fb.ref(db,`rooms/${myRoomId}/players/${myUid}/choice`),"paper"); log("🖐️我出：揼")}

// 本機判勝邏輯
function getWinner(a,b){
  if(a===b) return 0;
  if((a==="rock"&&b==="scissors")||(a==="scissors"&&b==="paper")||(a==="paper"&&b==="rock")) return 1;
  return -1;
}

// 播放大合唱：只播放未被淘汰嘅玩家 voice1
async function playChorus(){
  const ps = Object.values(localPlayers).filter(p=>!p.eliminated && p.voice1);
  log(`🔊 大合唱，有效玩家數：${ps.length}`);
  for(const pl of ps){
    const au = new Audio(pl.voice1);
    au.play().catch(e=>log(`播放音訊錯誤:${e}`));
  }
}
// 播放勝利者宣言
async function playWinnerVoice(pid){
  const p = localPlayers[pid];
  if(!p || !p.voice2) return;
  const au = new Audio(p.voice2);
  au.play();
}

// 監聽房間全域狀態
function subscribeRoom(){
  roomRef = window.fb.ref(db,`rooms/${myRoomId}`);
  window.fb.onValue(roomRef, snap=>{
    const d = snap.val();
    if(!d) return;
    if(d.gameRule) gameRule = d.gameRule;
    if(d.players){
      // 同步全部玩家，同時清走3秒冇心跳嘅離線玩家
      const nowTs = Date.now();
      localPlayers = {};
      for(const pid in d.players){
        const pl = d.players[pid];
        if(!pl.lastHb || (nowTs - pl.lastHb) > 3500) continue;
        localPlayers[pid] = pl;
      }
      renderPlayerList();
    }
    if(d.state === "roundStart"){
      goPage("page3");
      log("🚦新一輪，前往出拳頁");
    }
    if(d.state === "roundEnd"){
      handleRoundEnd();
    }
    if(d.state === "gameOver"){
      handleGameOver(d.winnerId);
    }
  })
}

// 處理本輪完結，全部運算本機執行
async function handleRoundEnd(){
  goPage("page4");
  await playChorus();
  // 排序：先自己，再其他玩家
  let pids = [myUid];
  Object.keys(localPlayers).forEach(id=>{if(id!==myUid) pids.push(id)});

  // ------ 本輪計分 & 按規則判淘汰 ------
  const resultDiv = document.getElementById("roundResult");
  const rankDiv = document.getElementById("rankBox");
  resultDiv.innerHTML = "";
  for(const pid of pids){
    const p = localPlayers[pid];
    resultDiv.innerHTML += `<div>${p.name} : ${p.choice||"未出拳"}</div>`
  }

  // 簡易計分、勝場、連勝
  for(const pid in localPlayers){
    const pl = localPlayers[pid];
    if(!pl.winCnt) pl.winCnt = 0;
    if(!pl.streak) pl.streak = 0;
  }

  // 兩兩對戰計勝
  const arr = Object.values(localPlayers);
  for(let i=0;i<arr.length;i++){
    for(let j=i+1;j<arr.length;j++){
      const r = getWinner(arr[i].choice, arr[j].choice);
      if(r===1){arr[i].winCnt++;arr[i].streak++;arr[j].streak=0;}
      if(r===-1){arr[j].winCnt++;arr[j].streak++;arr[i].streak=0;}
      if(r===0){arr[i].streak=0;arr[j].streak=0;}
    }
  }

  // 按當前規則標記淘汰
  for(const pid in localPlayers){
    const pl = localPlayers[pid];
    if(pl.eliminated) continue;
    switch(gameRule){
      case "oneRound":
        if(pl.winCnt===0) pl.eliminated=true;
        break;
      case "win2":
        if(pl.winCnt >= 2) pl.eliminated=false;
        break;
      case "win3":
        if(pl.winCnt >= 3) pl.eliminated=false;
        break;
      case "consec2":
        if(pl.streak >= 2) pl.eliminated=false;
        break;
    }
  }

  // 排行
  const sorted = Object.values(localPlayers).sort((a,b)=>b.winCnt - a.winCnt);
  rankDiv.innerHTML = sorted.map(x=>`<div>${x.name}｜勝：${x.winCnt} 連勝：${x.streak} ${x.eliminated?"【已淘汰】":""}</div>`).join("");

  // 檢查是否只剩1人 -> 遊戲結束
  const alive = Object.values(localPlayers).filter(x=>!x.eliminated);
  if(alive.length === 1){
    const winnerId = alive[0].uid;
    window.fb.set(window.fb.ref(db,`rooms/${myRoomId}/state`),"gameOver");
    window.fb.set(window.fb.ref(db,`rooms/${myRoomId}/winnerId`), winnerId);
    return;
  }

  // 5秒倒數
  let cd = 5;
  const cdSpan = document.getElementById("countDown");
  await new Promise(res=>{
    const t = setInterval(()=>{
      cd--;
      cdSpan.innerText = cd;
      if(cd<=0){clearInterval(t);res()}
    },1000)
  })

  // 下一輪重置出拳
  for(const pid in localPlayers){
    await window.fb.set(window.fb.ref(db,`rooms/${myRoomId}/players/${pid}/choice`), null);
  }
  window.fb.set(window.fb.ref(db,`rooms/${myRoomId}/state`),"roundStart");
}

function handleGameOver(winnerId){
  goPage("page5");
  document.getElementById("finalWinner").innerText = `🏆最終勝利者：${localPlayers[winnerId].name}`;
  playWinnerVoice(winnerId);
}

// ---------- 房主 / 房客進入流程 ----------
document.querySelector("#hostBtn").onclick = async ()=>{
  myName = document.querySelector("#nameInput").value.trim();
  if(!myName){
    log("⚠️ 請先輸入玩家名稱");
    return;
  }
  log("Step4：房主點擊開啟房間");
  const ok = await initFB();
  if(!ok){
    log("🛑 Firebase初始化失敗，唔可以開房");
    return;
  }
  myRoomId = gen4DigitRoom();
  document.querySelector("#roomInput").value = myRoomId;
  log(`✅ Step5：本地生成房號 = ${myRoomId}`);

  document.querySelector("#roomDisplay").innerText = myRoomId;
  document.querySelector("#playerIdInp").value = myName;

  // 註冊自己入房間
  await window.fb.set(window.fb.ref(db,`rooms/${myRoomId}/players/${myUid}`),{
    uid:myUid, name:myName, ready:false, eliminated:false, winCnt:0, streak:0,
    lastHb: window.fb.serverTimestamp()
  });
  startHeartBeat();
  subscribeRoom();
  goPage("page2");
};

document.querySelector("#joinBtn").onclick = async ()=>{
  myName = document.querySelector("#nameInput").value.trim();
  if(!myName){
    log("⚠️ 請先輸入玩家名稱");
    return;
  }
  log("Step4：房客點擊進入房間");
  const ok = await initFB();
  if(!ok){
    log("🛑 Firebase初始化失敗，唔可以入房");
    return;
  }
  myRoomId = document.querySelector("#roomInput").value.trim();
  if(!/^\d{4}$/.test(myRoomId)){
    log("⚠️ 房間號必須4個數字");
    return;
  }
  document.querySelector("#roomDisplay").innerText = myRoomId;
  document.querySelector("#playerIdInp").value = myName;

  await window.fb.set(window.fb.ref(db,`rooms/${myRoomId}/players/${myUid}`),{
    uid:myUid, name:myName, ready:false, eliminated:false, winCnt:0, streak:0,
    lastHb: window.fb.serverTimestamp()
  });
  startHeartBeat();
  subscribeRoom();
  goPage("page2");
};

log("✅ v1.6 JS全部載入完畢，等待玩家開房");
</script>
</body>
</html>
