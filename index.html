<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>方包包 V18 分段傳聲音</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px;min-height:100vh}
.ver{position:fixed;top:8px;right:8px;background:#FFEB00;color:#000;padding:4px 10px;border-radius:99px;font-weight:900;font-size:11px;z-index:99}
.card{width:92%;max-width:520px;background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:16px;margin-top:14px}
.input{width:100%;padding:12px;border-radius:10px;border:2px solid #444;background:#000;color:#fff;font-size:15px;box-sizing:border-box}
.btn{padding:14px;border-radius:99px;border:0;font-weight:900;font-size:14px;margin-top:8px;cursor:pointer}
.btnY{background:#FFEB00;color:#000;flex:1}.btnG2{background:#00FF88;color:#000;flex:1}.btnB{background:#2a5bd7;color:#fff;flex:1}
.item{display:flex;gap:8px;padding:10px;background:#151515;border:1px solid #222;border-radius:10px;margin-top:6px;font-size:13px;align-items:center}
.pos{width:52px;height:26px;background:#FFEB00;color:#000;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px}
.posA{background:#00FF88}
.log{font-size:12px;color:#FFEB00;background:#222;border:1px solid #333;border-radius:8px;padding:10px;margin-top:10px;white-space:pre-line;text-align:center}
.code{font-size:36px;font-weight:900;letter-spacing:8px;color:#00FF88;text-align:center;margin:10px 0}
.row{display:flex;justify-content:space-between;background:#222;padding:10px 12px;border-radius:10px;margin-top:8px;border:1px solid #222}
audio{width:160px;height:32px}
.progress{width:100%;height:6px;background:#333;border-radius:99px;margin-top:6px;overflow:hidden}
.bar{height:100%;width:0%;background:#00FF88;transition:width .2s}
</style>
</head><body>
<div class="ver">V18 分段修復版</div>
<h1 style="color:#FFEB00;margin:36px 0 5px">方包包 V18</h1>
<div style="color:#888;font-size:11px">修復：聲音分段傳，唔會再塞死</div>

<div class="card">
<div style="font-weight:900">1. 登入房間</div>
<input id="nameInput" class="input" value="Louis" style="margin-top:10px">
<div style="display:flex;gap:8px;margin-top:10px"><button class="btn btnY" onclick="createRoom()">開新房間</button><button class="btn btnG2" onclick="joinRoom()">加入房間</button></div>
<input id="codeInput" class="input" placeholder="加入輸入房號" style="margin-top:10px">
<div id="roomInfo" style="display:none"><div class="code" id="roomCode">----</div><div id="roomLink" style="font-size:11px;color:#00FF88;word-break:break-all;text-align:center"></div></div>
<div id="logRoom" class="log">未入房</div>
</div>

<div class="card">
<div style="font-weight:900">2. 上傳字庫</div>
<textarea id="wordBox" class="input" style="height:70px;margin-top:8px" placeholder="一行一詞"></textarea>
<button class="btn btnY" style="width:100%" onclick="saveWords()">💾 上傳文字</button>
<div style="font-weight:900;margin-top:14px">2.1 上傳聲音（已修復）</div>
<div style="font-size:11px;color:#888">最長15秒，自動分段傳，唔會卡死</div>
<div style="display:flex;gap:8px;margin-top:8px"><input type="file" id="audioFile" accept="audio/*" style="color:#888;flex:1"><button class="btn btnB" onclick="uploadAudio()">🔊 上傳</button></div>
<button class="btn" style="width:100%;background:#333;color:#fff" onclick="startRecord()" id="recBtn">● 撳一下開始錄（15秒內）</button>
<div class="progress" style="display:none" id="prog"><div class="bar" id="bar"></div></div>
<div id="logAudio" class="log" style="display:none"></div>
<div id="logWords" class="log" style="display:none"></div>
</div>

<div class="card">
<div style="font-weight:900">3. 等候區</div><div id="playerList"></div><div id="logWait" class="log">未入房</div>
<div style="font-weight:900;margin-top:14px">4. 📍 位置顯示</div><div id="posList"></div><div id="audioPosList" style="margin-top:8px"></div>
</div>

<script>
let peer=null, conns={}, myName='Louis', roomCode='', players=[], wordBank=[], audioBank=[];
let incomingAudio={}, mediaRecorder=null, chunks=[];
const CHUNK=16*1024;

function logRoom(t){ document.getElementById('logRoom').textContent=t; }
function logWords(t){ let e=document.getElementById('logWords'); e.style.display='block'; e.textContent=t; }
function logAudio(t){ let e=document.getElementById('logAudio'); e.style.display='block'; e.textContent=t; }
function setProg(p,show){ let pr=document.getElementById('prog'), b=document.getElementById('bar'); if(show) pr.style.display='block'; b.style.width=p+'%'; if(p>=100) setTimeout(()=>pr.style.display='none',800); }

function createRoom(){
 myName=document.getElementById('nameInput').value.trim()||'Louis';
 roomCode=Math.random().toString(36).substring(2,6).toUpperCase();
 document.getElementById('codeInput').value=roomCode;
 peer=new Peer('nosay-'+roomCode);
 peer.on('open',()=>{ document.getElementById('roomCode').textContent=roomCode; document.getElementById('roomInfo').style.display='block'; document.getElementById('roomLink').textContent=location.origin+location.pathname+'?room='+roomCode; players=[myName]; updateWait(); logRoom('✅ 已開房：'+roomCode); });
 peer.on('connection', c=>{ conns[c.peer]=c; c.on('data', onData); c.on('open',()=>c.send({type:'sync', players, wordBank, audioBank, roomCode})); });
}
function joinRoom(){
 let code=document.getElementById('codeInput').value.trim().toUpperCase(); if(!code){ alert('輸入房號'); return; }
 myName=document.getElementById('nameInput').value.trim()||'Fai'; roomCode=code;
 peer=new Peer();
 peer.on('open',()=>{ let conn=peer.connect('nosay-'+roomCode); conns['host']=conn; conn.on('open',()=>conn.send({type:'join', name:myName})); conn.on('data', onData); });
 document.getElementById('roomCode').textContent=roomCode; document.getElementById('roomInfo').style.display='block';
}

function onData(d){
 if(d.type==='join'){ if(players.indexOf(d.name)===-1) players.push(d.name); updateWait(); broadcast({type:'sync', players, wordBank, audioBank, roomCode}); }
 if(d.type==='sync'){ players=d.players; wordBank=d.wordBank||[]; audioBank=d.audioBank||[]; roomCode=d.roomCode||roomCode; document.getElementById('roomCode').textContent=roomCode; document.getElementById('roomInfo').style.display='block'; logRoom('✅ 已加入：'+roomCode); updateWait(); renderAll(); }
 if(d.type==='wordUpdate'){ wordBank=d.wordBank; renderAll(); }
 // 分段聲音
 if(d.type==='audioStart'){ incomingAudio[d.id]={name:d.name, from:d.from, total:d.total, chunks:[], got:0}; logAudio('📥 接收聲音中 '+d.name+' 0%'); }
 if(d.type==='audioChunk'){ let inc=incomingAudio[d.id]; if(!inc) return; inc.chunks[d.index]=d.chunk; inc.got++; let pct=Math.round(inc.got/inc.total*100); setProg(pct,true); logAudio('📥 接收中 '+pct+'%'); if(inc.got===inc.total){ let data=inc.chunks.join(''); audioBank.push({id:d.id, name:inc.name, from:inc.from, data}); renderAll(); logAudio('✅ 收到聲音：'+inc.name); delete incomingAudio[d.id]; setProg(100,false); } }
}

function broadcast(msg){ Object.values(conns).forEach(c=>{ try{ if(c.open) c.send(msg); }catch(e){} }); }

function saveWords(){
 let txt=document.getElementById('wordBox').value.trim(); if(!txt) return;
 wordBank=txt.split(/\r?\n/).map(s=>s.trim()).filter(s=>s);
 logWords('✅ 上傳文字 '+wordBank.length+' 詞'); renderAll();
 broadcast({type:'wordUpdate', wordBank});
 broadcast({type:'sync', players, wordBank, audioBank, roomCode});
}

function sendAudioChunked(item){
 let id=item.id, data=item.data, total=Math.ceil(data.length/CHUNK);
 broadcast({type:'audioStart', id, name:item.name, from:item.from, total});
 let i=0;
 function sendNext(){
  if(i>=total){ logAudio('✅ 已傳完：'+item.name); return; }
  let chunk=data.substr(i*CHUNK, CHUNK);
  broadcast({type:'audioChunk', id, index:i, chunk});
  i++; let pct=Math.round(i/total*100); setProg(pct,true); logAudio('📤 傳送中 '+pct+'%');
  setTimeout(sendNext, 60);
 }
 sendNext();
}

function uploadAudio(){
 let f=document.getElementById('audioFile').files[0]; if(!f){ alert('揀檔案'); return; }
 let r=new FileReader();
 r.onload=e=>{
  let item={id:Date.now(), name:f.name, from:myName, data:e.target.result};
  audioBank.push(item); renderAll(); logAudio('✅ 本地已上傳，開始分段傳...'); sendAudioChunked(item);
 };
 r.readAsDataURL(f);
}
function startRecord(){
 if(mediaRecorder && mediaRecorder.state==='recording'){ mediaRecorder.stop(); document.getElementById('recBtn').textContent='● 撳一下開始錄（15秒內）'; return; }
 navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
  mediaRecorder=new MediaRecorder(s, {mimeType:'audio/webm;codecs=opus', bitsPerSecond:64000}); chunks=[];
  mediaRecorder.ondataavailable=e=>chunks.push(e.data);
  mediaRecorder.onstop=()=>{
   let blob=new Blob(chunks,{type:'audio/webm'}); let rd=new FileReader();
   rd.onload=ev=>{
    let item={id:Date.now(), name:'錄音'+(audioBank.length+1), from:myName, data:ev.target.result};
    audioBank.push(item); renderAll(); logAudio('✅ 錄完，開始分段傳...'); sendAudioChunked(item);
   }; rd.readAsDataURL(blob);
  };
  mediaRecorder.start(); document.getElementById('recBtn').textContent='■ 撳一下停止';
  setTimeout(()=>{ if(mediaRecorder.state==='recording') mediaRecorder.stop(); },15000);
 }).catch(()=>alert('要開麥克風權限'));
}
function renderAll(){ renderPos(); renderAudioPos(); }
function renderPos(){
 if(!wordBank.length){ document.getElementById('posList').innerHTML='<div style="color:#555;text-align:center;padding:6px;font-size:12px">未有文字</div>'; return; }
 let h=''; for(let i=0;i<wordBank.length;i++){ let p=players[i%players.length]||'未指派'; h+=`<div class="item"><div class="pos">${i+1}號位</div><div style="flex:1">${wordBank[i]}</div><div style="font-size:11px;color:#FFEB00">${p}</div></div>`; }
 document.getElementById('posList').innerHTML=h;
}
function renderAudioPos(){
 if(!audioBank.length){ document.getElementById('audioPosList').innerHTML='<div style="color:#555;text-align:center;padding:6px;font-size:12px">未有聲音</div>'; return; }
 let h=''; for(let i=0;i<audioBank.length;i++){ let a=audioBank[i]; h+=`<div class="item"><div class="pos posA">🔊 ${i+1}號位</div><div style="flex:1"><div style="font-size:12px">${a.name} - ${a.from}</div><audio controls src="${a.data}"></audio></div></div>`; }
 document.getElementById('audioPosList').innerHTML=h;
}
function updateWait(){
 let h=''; for(let i=0;i<players.length;i++){ let isMe=players[i]==myName; h+=`<div class="row" style="${isMe?'border-color:#FFEB00;background:#2a2a00':''}"><span>${i+1}. ${players[i]} ${isMe?'(你)':''}</span><span style="font-size:11px;color:#888">${i+1}號位</span></div>`; }
 document.getElementById('playerList').innerHTML=h; document.getElementById('logWait').textContent=`等候區：共 ${players.length} 人 - ${players.join(', ')}`; renderAll();
}
(function(){ let p=new URLSearchParams(location.search); let r=p.get('room'); if(r) document.getElementById('codeInput').value=r.toUpperCase(); })();
</script>
</body></html>
