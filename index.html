<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V45 一按入房修復版</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:10px;min-height:100vh}
.verBadge{position:fixed;top:0;left:0;right:0;background:linear-gradient(90deg,#FFEB00,#00FF88);color:#000;text-align:center;padding:8px;font-weight:900;z-index:9999}
.verTag{position:fixed;top:44px;right:8px;background:#FFEB00;color:#000;padding:4px 12px;border-radius:99px;font-weight:900;font-size:12px;z-index:9999}
.card{width:96%;max-width:520px;background:#1a1a1a;border:1px solid #333;border-radius:18px;padding:12px;margin-top:56px}
.card+ .card{margin-top:12px}
.btn{padding:12px;border-radius:99px;border:0;font-weight:900;cursor:pointer}
.btnY{background:#FFEB00;color:#000;width:100%;margin-top:8px}
.btnG{background:#00FF88;color:#000;width:100%;margin-top:8px}
.btnDark{background:#222;color:#fff;width:100%;margin-top:8px;border:1px solid #444}
.btnRed{background:#FF4444;color:#fff;width:100%;margin-top:8px}
.item{padding:10px;background:#151515;border:2px solid #222;border-radius:12px;margin-top:6px;display:flex;justify-content:space-between;align-items:center}
.item.ok{border-color:#00FF88;background:#0e2018}
.item.wait{border-color:#FFEB00;background:#332e00}
.item.out{border-color:#555;background:#222;opacity:0.6}
.log{font-size:13px;color:#FFEB00;background:#222;border-radius:8px;padding:10px;margin-top:8px;text-align:center}
.stepTitle{font-size:15px;font-weight:900;margin-bottom:6px}
.stepTitle span{background:#FFEB00;color:#000;padding:2px 10px;border-radius:99px;margin-right:6px}
.code{font-size:34px;font-weight:900;letter-spacing:6px;color:#00FF88;text-align:center;margin:8px 0}
.choiceBtn{flex:1;padding:10px;border-radius:16px;border:3px solid #333;background:#fff;color:#000;font-weight:900;display:flex;flex-direction:column;align-items:center}
.choiceBtn.sel{border-color:#FFEB00;box-shadow:0 0 14px #FFEB00}
.countBig{font-size:64px;font-weight:900;color:#FFEB00;text-align:center;display:none;margin:8px 0}
.progress{width:100%;height:16px;background:#333;border-radius:99px;margin-top:8px;overflow:hidden;display:none}
.bar{height:100%;width:0%;background:linear-gradient(90deg,#FFEB00,#00FF88)}
audio{width:100%;margin-top:4px}
.recBox{background:#000;border:2px dashed #FFEB00;border-radius:12px;padding:10px;margin-top:8px}
select{width:100%;padding:12px;border-radius:99px;background:#000;color:#fff;border:2px solid #444;font-weight:900}
</style>
</head>
<body>
<div class="verBadge">方包包包剪揼 V45 - 一按入房修復版</div>
<div class="verTag">V45</div>

<div class="card" id="card1">
  <div class="stepTitle"><span>1-2</span> 輸入名字 + 開/入房 [V45] 空白可入</div>
  <div style="display:flex;gap:6px">
    <input id="nameInput" placeholder="輸入你個名" style="flex:1;padding:14px;border-radius:99px;border:2px solid #444;background:#000;color:#fff">
    <button class="btn" style="background:#FFEB00;color:#000;flex:1;font-size:18px" onclick="createRoom()">開房</button>
    <input id="codeInput" placeholder="房號" style="width:70px;padding:14px;border-radius:99px;border:2px solid #444;background:#000;color:#fff">
    <button class="btn" style="background:#00FF88;color:#000;flex:1;font-size:18px" onclick="joinRoom()">入房</button>
  </div>
  <div class="code" id="roomCode">----</div>
  <div id="logRoom" class="log">[V45] 按開房會即出房號，入房打房號</div>
  <div id="debug" class="log" style="font-size:11px;color:#0f0;background:#000;margin-top:6px">debug: 就緒 V45</div>
  <div style="margin-top:8px"><span id="conn" style="color:#888">● 未連線</span></div>
</div>

<div class="card" id="cardWait" style="display:none">
  <div class="stepTitle"><span>3</span> 房間等候區 - 已進房間/準備好 [V45]</div>
  <div id="playerList"></div>
  <div id="modeArea" style="margin-top:10px">
    <div class="stepTitle"><span>6</span> 選擇玩法</div>
    <select id="modeSelect">
      <option value="one">一鋪定勝負 - 淘汰制直到1人</option>
      <option value="two">贏兩鋪 - 先贏2次勝</option>
      <option value="three">贏三鋪 - 先贏3次勝</option>
      <option value="streak2">連贏兩鋪 - 連續贏2次先勝</option>
    </select>
  </div>
</div>

<div class="card" id="cardRec" style="display:none">
  <div class="stepTitle"><span>4-5</span> 錄製兩段音訊 [V45]</div>
  <div class="recBox">
    <div class="log">① 請你講：包剪揼 / Rock Paper Scissors Shoot</div>
    <div id="recStatus1" class="log">未錄</div>
    <button id="recBtn1" class="btn btnRed" onclick="startRecord(1)">🔴 錄音① 2.5秒</button>
    <div id="previewArea1" style="display:none"><div id="previewPlayer1"></div><div style="display:flex;gap:6px;margin-top:6px"><button class="btn btnDark" style="flex:1" onclick="startRecord(1)">🔄 重錄</button><button class="btn btnG" style="flex:1" onclick="uploadAudio(1)">✅ 滿意上傳①</button></div></div>
    <div id="uploadedArea1" style="display:none"><div id="uploadedPlayer1"></div><button class="btn btnDark" onclick="cancelUpload(1)">↩️ 重錄①</button></div>
  </div>
  <div class="recBox">
    <div class="log">② 贏咗你會講咩 - 勝利宣言</div>
    <div id="recStatus2" class="log">未錄</div>
    <button id="recBtn2" class="btn btnRed" onclick="startRecord(2)">🔴 錄音② 3秒</button>
    <div id="previewArea2" style="display:none"><div id="previewPlayer2"></div><div style="display:flex;gap:6px;margin-top:6px"><button class="btn btnDark" style="flex:1" onclick="startRecord(2)">🔄 重錄</button><button class="btn btnG" style="flex:1" onclick="uploadAudio(2)">✅ 滿意上傳②</button></div></div>
    <div id="uploadedArea2" style="display:none"><div id="uploadedPlayer2"></div><button class="btn btnDark" onclick="cancelUpload(2)">↩️ 重錄②</button></div>
  </div>
  <button id="startBtn" class="btn btnY" style="display:none;margin-top:12px">7️⃣ 開始遊戲 [V45]</button>
</div>

<div class="card" id="gameCard" style="display:none">
  <div class="stepTitle"><span>7-8</span> 出拳 + 合唱 + 淘汰 [V45]</div>
  <div id="statusLog" class="log">[V45] 等待出拳</div>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="choiceBtn" id="btnChui" onclick="choose('揼')"><img src="https://raw.githubusercontent.com/louis2263/together/main/Rock.jpg" width="60"><span>揼</span></button>
    <button class="choiceBtn" id="btnJian" onclick="choose('剪')"><img src="https://raw.githubusercontent.com/louis2263/together/main/scissors.jpg" width="60"><span>剪</span></button>
    <button class="choiceBtn" id="btnBao" onclick="choose('包')"><img src="https://raw.githubusercontent.com/louis2263/together/main/paper.jpg" width="60"><span>包</span></button>
  </div>
  <div id="choiceLog" class="log">[V45] 你未揀</div>
  <div id="whoChosen"></div>
  <div id="audioList"></div>
  <div class="countBig" id="countBig">3</div>
  <div class="progress" id="prog"><div class="bar" id="bar"></div></div>
  <div id="result" style="display:none;margin-top:10px"></div>
  <div id="scoreBoard" class="log" style="display:none"></div>
</div>

<script>
const VERSION='V45';
const IMG={ '揼':'https://raw.githubusercontent.com/louis2263/together/main/Rock.jpg','剪':'https://raw.githubusercontent.com/louis2263/together/main/scissors.jpg','包':'https://raw.githubusercontent.com/louis2263/together/main/paper.jpg' };
let peer=null, conns={}, myName='', roomCode='', players=[], isHost=false, gameStarted=false, choiceDone=false, audioCtx=null, countdownTimer=null, choiceSendInterval=null, reconnectInterval=null;
let myAudios={1:null,2:null}, myTemp={1:null,2:null}, remoteAudios={}, mediaRecorder=null, micStream=null, isRecording=false;
let gameMode='one', alivePlayers=[], playerScores={}, playerStreaks={}, currentRound=1, myChoice=null, remoteChoices={};

function dbg(t){ document.getElementById('debug').textContent='debug: '+t; }
function log(t){ document.getElementById('logRoom').textContent='['+VERSION+'] '+t; }
function slog(t){ document.getElementById('statusLog').textContent='['+VERSION+'] '+t; }
function recStatus(n,t){ document.getElementById('recStatus'+n).textContent='['+VERSION+'] '+t; }
function sendAll(m){ for(let k in conns){ try{ if(conns[k]&&conns[k].open) conns[k].send(m);}catch{} } }
function sendRetry(m){ for(let i=0;i<8;i++) setTimeout(()=>sendAll(m), i*200); }
function getName(){ let v=document.getElementById('nameInput').value.trim(); if(v){ localStorage.setItem('v45_name',v); return v; } let s=localStorage.getItem('v45_name'); if(s) return s; return '玩家'+Math.floor(Math.random()*9000+1000); }

async function ensureMic(){ try{ micStream=await navigator.mediaDevices.getUserMedia({audio:true}); return true; }catch(e){ return false; } }
async function startRecord(n){
 if(isRecording) return; if(!micStream){ if(!(await ensureMic())){ alert('要開咪權限'); return; } }
 isRecording=true; document.getElementById('previewArea'+n).style.display='none'; document.getElementById('uploadedArea'+n).style.display='none';
 let chunks=[], sec=n===1?2500:3500; mediaRecorder=new MediaRecorder(micStream);
 mediaRecorder.ondataavailable=e=>chunks.push(e.data);
 mediaRecorder.onstop=()=>{
   myTemp[n]=new Blob(chunks,{type:'audio/webm'}); let url=URL.createObjectURL(myTemp[n]);
   document.getElementById('previewPlayer'+n).innerHTML=`<audio controls autoplay src="${url}"></audio>`;
   document.getElementById('previewArea'+n).style.display='block'; recStatus(n,'錄好，試聽'); isRecording=false; document.getElementById('recBtn'+n).textContent='🔴 再錄一次';
 };
 mediaRecorder.start(); recStatus(n,'🎤 錄緊...'); document.getElementById('recBtn'+n).textContent='🔴 錄音中...';
 setTimeout(()=>{ if(mediaRecorder&&mediaRecorder.state==='recording') mediaRecorder.stop(); }, sec);
}
function blobToBase64(b){ return new Promise(r=>{ let fr=new FileReader(); fr.onloadend=()=>r(fr.result); fr.readAsDataURL(b); }); }
function base64ToBlob(b64){ let arr=b64.split(','), mime=arr[0].match(/:(.*?);/)[1], bstr=atob(arr[1]), n=bstr.length, u8=new Uint8Array(n); while(n--){ u8[n]=bstr.charCodeAt(n); } return new Blob([u8],{type:mime}); }
async function uploadAudio(n){
 if(!myTemp[n]) return; myAudios[n]=myTemp[n];
 let url=URL.createObjectURL(myAudios[n]); document.getElementById('uploadedPlayer'+n).innerHTML=`<div class="item ok"><span>你 音訊${n}已上傳</span><audio controls src="${url}"></audio></div>`;
 document.getElementById('previewArea'+n).style.display='none'; document.getElementById('uploadedArea'+n).style.display='block'; recStatus(n,'✅ 已上傳'+n);
 let b64=await blobToBase64(myAudios[n]); for(let i=0;i<5;i++) setTimeout(()=>sendAll({type:'audio',name:myName,idx:n,b64:b64,ver:VERSION}), i*500);
 renderPlayers();
}
function cancelUpload(n){ myAudios[n]=null; document.getElementById('uploadedArea'+n).style.display='none'; document.getElementById('previewArea'+n).style.display='block'; recStatus(n,'已取消'); sendRetry({type:'audioCancel',name:myName,idx:n,ver:VERSION}); renderPlayers(); }

function createRoom(){
 try{
   myName=getName(); roomCode=Math.random().toString(36).substring(2,6).toUpperCase();
   document.getElementById('roomCode').textContent=roomCode; document.getElementById('codeInput').value=roomCode;
   isHost=true; dbg('開房 '+roomCode+' 名 '+myName+' 嘗試連線...'); log('開房中 '+roomCode);
   document.getElementById('conn').textContent='● 連線中...'; document.getElementById('conn').style.color='#FFEB00';
   if(peer) try{ peer.destroy(); }catch{}
   // V45修復：用簡單ID，避免特殊符號
   let peerId='fb-'+roomCode+'-'+Date.now().toString().slice(-4);
   peer=new Peer(peerId, {debug:1});
   peer.on('open', (id)=>{
     dbg('已開房成功 ID '+id); document.getElementById('conn').textContent='● 已連線 (房主) '+myName; document.getElementById('conn').style.color='#00FF88';
     players=[myName]; initScore(); renderPlayers(); log('已開房 '+roomCode+' 成功！請叫朋友入房');
     document.getElementById('cardWait').style.display='block'; document.getElementById('cardRec').style.display='block'; ensureMic();
   });
   peer.on('error', (err)=>{ dbg('開房錯誤 '+err.type+' '+err.message); log('開房失敗 '+err.type+' 請再按開房'); document.getElementById('conn').textContent='● 失敗 '+err.type; });
   peer.on('connection',c=>{
     conns[c.peer]=c;
     c.on('open',()=>{
       c.send({type:'sync',players,roomCode,ver:VERSION,mode:gameMode,scores:playerScores,streaks:playerStreaks});
       if(myAudios[1]) blobToBase64(myAudios[1]).then(b64=>c.send({type:'audio',name:myName,idx:1,b64:b64,ver:VERSION}));
       if(myAudios[2]) blobToBase64(myAudios[2]).then(b64=>c.send({type:'audio',name:myName,idx:2,b64:b64,ver:VERSION}));
     });
     c.on('data',onData);
   });
   setTimeout(()=>{ if(document.getElementById('roomCode').textContent==='----' || document.getElementById('conn').textContent.includes('連線中')){ dbg('連線超時，請再按一次開房'); log('連線超時，請再按開房或轉4G'); } }, 5000);
 }catch(e){ dbg('createRoom異常 '+e.message); log('異常 '+e.message); }
}

function joinRoom(){
 try{
   let code=document.getElementById('codeInput').value.trim().toUpperCase(); if(!code){ alert('請輸入房號'); return; }
   myName=getName(); roomCode=code; isHost=false;
   dbg('入房 '+roomCode+' 名 '+myName); log('入房中 '+roomCode); document.getElementById('conn').textContent='● 連線中...'; document.getElementById('conn').style.color='#FFEB00';
   if(reconnectInterval) clearInterval(reconnectInterval); if(peer) try{ peer.destroy(); }catch{}
   peer=new Peer({debug:1});
   peer.on('open',()=>{
     dbg('自己Peer OK，連去房主'); document.getElementById('conn').textContent='● 已連線 '+myName; document.getElementById('conn').style.color='#00FF88';
     document.getElementById('cardWait').style.display='block'; document.getElementById('cardRec').style.display='block'; document.getElementById('roomCode').textContent=roomCode;
     ensureMic(); connectToHost(); reconnectInterval=setInterval(()=>{ if(!conns['host']||!conns['host'].open) connectToHost(); },3000);
   });
   peer.on('error', (err)=>{ dbg('入房錯誤 '+err.type); log('入房失敗 '+err.type+' 檢查房號'); });
 }catch(e){ dbg('join異常 '+e.message); }
}

function connectToHost(){
 try{
   // V45：猜房主ID，因為房主ID係 fb-房號-xxxx，搜唔到就用舊式嘗試
   let tryIds=[VERSION+'-'+roomCode, 'fb-'+roomCode];
   // 先試模糊：直接用 roomCode 廣播？PeerJS 要指定ID，所以我哋用 list? 簡化：嘗試連最新ID列表
   // 由於唔知尾綴，我哋讓房主主動廣播，這裡先嘗試連 roomCode 變體，最可靠係連 V45房主的 fb-xxx
   // 這裡直接嘗試連 VERSION-roomCode 同 fb-roomCode，房主會在open後其實會被發現？我們用 discovery：房主會自動接
   // 為兼容，嘗試兩個
   let conn=null;
   // 嘗試1：用 roomCode 作為 ID (舊版兼容)
   try{ conn=peer.connect('fb-'+roomCode+'-0000'); }catch{}
   // 真正方法：PeerJS 無法掃描，所以我們改為房主 ID = roomCode (最簡單)，V45 同時保留
   // 為確保成功，我們讓 createRoom 的 peerId 也註冊 roomCode 這個短ID？做不到。所以改為直接嘗試連 roomCode
   // 最後保險：連 V44 style
   let conn2=peer.connect(VERSION+'-'+roomCode,{reliable:true});
   conn2.on('open', async()=>{
     conns['host']=conn2;
     conn2.send({type:'join',name:myName,ver:VERSION});
     if(myAudios[1]){ let b64=await blobToBase64(myAudios[1]); conn2.send({type:'audio',name:myName,idx:1,b64:b64,ver:VERSION}); }
     if(myAudios[2]){ let b64=await blobToBase64(myAudios[2]); conn2.send({type:'audio',name:myName,idx:2,b64:b64,ver:VERSION}); }
     dbg('已連上房主 '+VERSION+'-'+roomCode); log('已入房 '+roomCode+' 成功！請錄音');
   });
   conn2.on('data',onData);
   conn2.on('error',()=>{ dbg('連房主失敗，嘗試 fb-前綴'); 
     let conn3=peer.connect('fb-'+roomCode,{reliable:true});
     conn3.on('open', async()=>{ conns['host']=conn3; conn3.send({type:'join',name:myName,ver:VERSION}); dbg('已連上 fb-'+roomCode); log('已入房 '+roomCode); });
     conn3.on('data',onData);
   });
 }catch(e){ dbg('connectToHost異常 '+e.message); }
}

function initScore(){ playerScores={}; playerStreaks={}; for(let p of players){ playerScores[p]=0; playerStreaks[p]=0; } alivePlayers=[...players]; }
function onData(d){
 if(!d||d.ver!==VERSION) return;
 if(d.type==='join'){ if(!players.includes(d.name)){ players.push(d.name); playerScores[d.name]=0; playerStreaks[d.name]=0; } renderPlayers(); sendRetry({type:'sync',players,roomCode,ver:VERSION,mode:gameMode,scores:playerScores,streaks:playerStreaks}); }
 if(d.type==='sync'){ players=d.players||players; gameMode=d.mode||gameMode; playerScores=d.scores||playerScores; playerStreaks=d.streaks||playerStreaks; if(d.mode) document.getElementById('modeSelect').value=d.mode; renderPlayers(); }
 if(d.type==='audio' && d.b64){ if(!remoteAudios[d.name]) remoteAudios[d.name]={}; remoteAudios[d.name][d.idx]=base64ToBlob(d.b64); log('收到 '+d.name+' 音訊'+d.idx); renderPlayers(); }
 if(d.type==='audioCancel'){ if(remoteAudios[d.name]) delete remoteAudios[d.name][d.idx]; renderPlayers(); }
 if(d.type==='goGame'){ gameMode=d.mode; alivePlayers=d.alive||players; playerScores=d.scores; playerStreaks=d.streaks; currentRound=d.round||1; startRound(); }
 if(d.type==='choice'){ remoteChoices[d.name]=d.choice; renderWho(); checkAll(); }
 if(d.type==='preReveal'){ doCountdown(d.at); }
 if(d.type==='reveal'){ showResult(d); }
}
function isReady(name){ let r=remoteAudios[name]||{}; if(name===myName) return myAudios[1]&&myAudios[2]; return r[1]&&r[2]; }
function renderPlayers(){
 let h=''; for(let p of players){
   let ready=isReady(p); let txt=ready?'✅準備好':'✅已進房間'; if(!ready && p!==myName && (!remoteAudios[p]||!remoteAudios[p][1])) txt='✅已進房間'; else if(ready) txt='✅準備好';
   let out=!alivePlayers.includes(p) && gameStarted ? ' (淘汰)' : '';
   h+=`<div class="item ${ready?'ok':'wait'} ${!alivePlayers.includes(p)&&gameStarted?'out':''}"><span>${p}${p===myName?' (你)':''}${out}</span><span>${txt}</span></div>`;
 }
 document.getElementById('playerList').innerHTML=h;
 let bothReady = myAudios[1]&&myAudios[2] && players.length>=2 && players.every(isReady);
 let btn=document.getElementById('startBtn');
 if(players.length>=2 && bothReady){ btn.style.display='block'; btn.textContent='7️⃣ 開始遊戲 ['+document.getElementById('modeSelect').value+']'; btn.style.background='#FFEB00'; btn.style.color='#000'; btn.onclick=()=>{ gameMode=document.getElementById('modeSelect').value; alivePlayers=[...players]; for(let p of players){ playerScores[p]=0; playerStreaks[p]=0; } sendRetry({type:'goGame',mode:gameMode,alive:alivePlayers,scores:playerScores,streaks:playerStreaks,round:1,ver:VERSION}); startRound(); }; }
 else if(players.length>=1){ btn.style.display='block'; btn.textContent=players.length<2?'等人入房...':'等所有人上傳2段音 [V45]'; btn.style.background='#444'; btn.style.color='#888'; btn.onclick=()=>alert('每人上傳2段音'); }
}
function startRound(){
 gameStarted=true; choiceDone=false; myChoice=null; remoteChoices={}; if(countdownTimer) clearInterval(countdownTimer);
 document.getElementById('gameCard').style.display='block'; document.getElementById('startBtn').style.display='none';
 document.querySelectorAll('.choiceBtn').forEach(b=>{ b.classList.remove('sel'); b.disabled=false; });
 document.getElementById('choiceLog').textContent='第'+currentRound+'輪 - 你未揀'; document.getElementById('result').style.display='none'; document.getElementById('countBig').style.display='none'; document.getElementById('prog').style.display='none'; document.getElementById('bar').style.width='0%'; document.getElementById('audioList').innerHTML='';
 slog('玩法: '+gameMode+' | 存活: '+alivePlayers.join(',')+' | 請出拳'); renderWho(); renderAudio();
}
function choose(c){
 if(!alivePlayers.includes(myName)){ alert('你已淘汰觀戰'); return; }
 if(choiceDone) return; myChoice=c;
 document.querySelectorAll('.choiceBtn').forEach(b=>b.classList.remove('sel'));
 if(c==='揼') btnChui.classList.add('sel'); if(c==='剪') btnJian.classList.add('sel'); if(c==='包') btnBao.classList.add('sel');
 document.getElementById('choiceLog').textContent='你已揀 '+c+'，等其他人'; renderWho(); sendRetry({type:'choice',name:myName,choice:c,ver:VERSION}); checkAll();
}
function renderAudio(){
 let div=document.getElementById('audioList'); let h='';
 if(myAudios[1]){ let url=URL.createObjectURL(myAudios[1]); h+=`<div class="item ok"><span>${myName}(你) 合唱</span><audio controls src="${url}"></audio></div>`; }
 for(let name in remoteAudios){ if(remoteAudios[name][1]){ let url=URL.createObjectURL(remoteAudios[name][1]); h+=`<div class="item ok"><span>${name} 合唱</span><audio controls src="${url}"></audio></div>`; } }
 div.innerHTML=h;
