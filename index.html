<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>包剪揼測試</title>
<style>
#debug{background:#000;color:#0f0;padding:10px;height:180px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<h2>測試頁 v0</h2>
<input id="nameInput" placeholder="輸入名字">
<button id="btnConfirmName">確認名字</button>
<div>Debug：</div>
<div id="debug"></div>

<script>
const debugBox = document.getElementById('debug');
function log(txt){
  const time = new Date().toLocaleTimeString();
  debugBox.innerText += `[${time}] ${txt}\n`;
  debugBox.scrollTop = debugBox.scrollHeight;
}
log("頁面載入完成");

document.getElementById("btnConfirmName").addEventListener("click",()=>{
  log("✅ 按鈕被點擊！");
  const name = document.getElementById("nameInput").value;
  log("輸入名字：" + name);
})
</script>
</body>
</html>
