<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方包包包剪揼 V60.2 Fix重疊</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK",sans-serif}
body{background:#FFE66D}
.wrap1{position:relative;width:100%;max-width:480px;margin:0 auto;min-height:100vh;background:url('background01.jpg') no-repeat top center;background-size:100% auto;background-color:#FFE66D}
.wrap2{position:relative;width:100%;max-width:480px;margin:0 auto;min-height:1550px;background:url('background02.jpg') no-repeat top center;background-size:100% auto;background-color:#FFE66D}
.black-input{position:absolute;left:16px;right:16px;bottom:20px;background:#111;border-radius:28px;padding:20px}
.yellow{color:#FFE66D;font-weight:900}
#playersBar{position:absolute;top:1.2%;left:4%;right:4%;background:#111;border-radius:16px;padding:8px 12px;color:#FFE66D;font-weight:900;font-size:11px;white-space:nowrap;overflow:hidden}
#roomNumOnly{position:absolute;top:8.5%;left:32%;right:22%;font-size:38px;font-weight:1000;color:#111;text-align:left;letter-spacing:2px;text-shadow:none}
.mode-grid{position:absolute;top:16.5%;left:6%;right:6%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-btn{background:#fff;border:2.5px solid #111;border-radius:14px;padding:11px 6px;text-align:center;font-weight:900;font-size:12.5px;line-height:1.25}
.mode-btn.selected{background:#FFD93D;outline:3px solid #111}
.rec1-card{position:absolute;top:53%;left:6%;right:6%;background:#111;border-radius:20px;padding:14px}
.btn-red{background:#FF1A1A;color:#fff;border:none;border-radius:999px;padding:12px;text-align:center;font-weight:1000;font-size:15px}
#debugToggle{position:fixed;top:10px;right:10px;z-index:99999;background:#000;color:#0f0;border:2px solid #0f0;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
#debugPanel{position:fixed;bottom:0;left:0;right:0;max-height:55vh;background:rgba(20,20,20,.96);color:#0f0;border-top:3px solid #0f0;border-radius:18px 18px 0 0;padding:10px;z-index:99998;overflow:auto;display:none;font-family:monospace;font-size:12px}
#debugPanel.open{display:block}
</style>
</head>
<body>
<div id="debugToggle" onclick="document.getElementById('debugPanel').classList.toggle('open')">🐛</div>
<div id="debugPanel"><div style="display:flex;justify-content:space-between"><b>🐛 DEBUG V60.2 已Fix重疊</b><button onclick="this.parentElement.parentElement.classList.remove('open')" style="background:#FFE66D;border:none;padding:4px 10px;border-radius:8px">X</button></div><div id="dbgLog"></div></div>

<div id="s1" style="display:block"><div class="wrap1"><div class="black-input"><div class="yellow" style="font-size:13px">與朋友一起對決！準備好了嗎？</div><div class="yellow" style="margin-top:10px">輸入你個名</div><input id="nameInput" style="width:100%;background:#2A2A2A;border:2px solid #3A3A3A;border-radius:14px;padding:14px;color:#fff;margin-top:6px" placeholder="Louis"><div style="display:flex;gap:10px;margin-top:12px"><div class="mode-btn" style="flex:1;background:#FFD93D" onclick="createRoom()">開始房間</div><div class="mode-btn" style="flex:1;background:#34C759" onclick="joinRoom()">進入房間</div></div><div class="yellow" style="margin-top:12px"># 房號</div><input id="roomInput" style="width:100%;background:#2A2A2A;border:2px solid #3A3A3A;border-radius:14px;padding:14px;color:#fff;margin-top:6px" placeholder="4位房號 例如 4829" maxlength="4"></div></div></div>

<div id="s2" style="display:none"><div class="wrap2">
  <div id="playersBar"> <span style="background:#FFD93D;color:#111;border-radius:6px;padding:0 6px">2</span> players ready: <span id="pA">Louis✅準備好</span> <span id="pB">玩家B✅已進房</span></div>
  <div id="roomNumOnly">7173</div>
  <div class="mode-grid">
    <div class="mode-btn selected" onclick="setMode(this)">一鋪定勝負<br><span style="font-size:10px">(Selected)</span></div>
    <div class="mode-btn" onclick="setMode(this)">贏兩鋪<br><span style="font-size:10px">(Best of 3)</span></div>
    <div class="mode-btn" onclick="setMode(this)">贏三鋪<br><span style="font-size:10px">(Best of 5)</span></div>
    <div class="mode-btn" onclick="setMode(this)">連贏兩鋪<br><span style="font-size:10px">(Win 2 in a row)</span></div>
  </div>
  <div class="rec1-card">
    <div class="yellow">① 包剪揼 / Rock Paper Scissors Shoot</div>
    <div style="display:flex;justify-content:space-between;color:#fff;font-size:11px;margin:8px 0"><span>請講：包剪揼！</span><span id="st1" style="background:#FFE66D;color:#111;border-radius:999px;padding:2px 8px">狀態：未錄</span></div>
    <div class="btn-red" onclick="toggleRec(1)">🔴 錄音① 2.5秒</div>
    <audio id="aud1" controls style="display:none;width:100%;margin-top:8px"></audio>
  </div>
</div></div>

<script>
let logEl=document.getElementById('dbgLog');
function dlog(m){let t=new Date().toLocaleTimeString('zh-HK');logEl.innerHTML=`[${t}] ${m}<br>`+logEl.innerHTML}
function createRoom(){let n=document.getElementById('nameInput').value||'Louis';let r=Math.floor(1000+Math.random()*9000);document.getElementById('roomNumOnly').textContent=r;dlog(`開房 ${r} 名=${n}`);dlog(`回合狀態:waitingChoose,c1:undefined,c2:undefined`);dlog(`✅可以揀包/剪/揼`);document.getElementById('s1').style.display='none';document.getElementById('s2').style.display='block';document.getElementById('pA').textContent=n+'✅準備好'}
function joinRoom(){let n=document.getElementById('nameInput').value||'Louis';let r=document.getElementById('roomInput').value||'4829';document.getElementById('roomNumOnly').textContent=r;dlog(`入房 ${r}`);document.getElementById('s1').style.display='none';document.getElementById('s2').style.display='block'}
function setMode(el){document.querySelectorAll('.mode-grid .mode-btn').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');dlog(`玩法->${el.innerText.split('\n')[0]}`)}
let mr,chunks=[];
function toggleRec(t){dlog(`錄音${t}開始`);navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{chunks=[];mr=new MediaRecorder(s);mr.ondataavailable=e=>chunks.push(e.data);mr.onstop=()=>{let url=URL.createObjectURL(new Blob(chunks));document.getElementById('aud1').src=url;document.getElementById('aud1').style.display='block';document.getElementById('st1').textContent='已錄 ✅';document.getElementById('st1').style.background='#34C759';dlog(`錄音${t}完成 2.5秒`);dlog(`✅雙方已經出拳，進入賽果判斷`);s.getTracks().forEach(tr=>tr.stop())};mr.start();setTimeout(()=>mr.state=='recording'&&mr.stop(),2500)})}
dlog('V60.2 Fix重疊版 ready');
</script>
</body>
</html>
