<body>

    <div class="header-container">
        <h2>🎮 多人包剪揼遊戲</h2>

    <!-- 1. 玩家設定區 -->
    <div class="section" id="sec-user">
        <h3>1. 輸入名字與房間</h3>
        <input type="text" id="player-name-input" placeholder="請輸入您的名字" value="Louis">
        <input type="text" id="room-id-input" placeholder="房間代碼 (留空則預設 53477b)">

    <!-- 2. 語音錄製區 -->
    <div class="section" id="sec-audio">
        <h3>2. 語音錄音輸入</h3>
        
        <!-- 第一段音訊 -->
        <div class="audio-box">
            <p style="margin:0 0 5px 0; color:#facc15; font-size:14px;">提示 1：請你講 「包剪揼 / Rock Paper Scissors shoot」</p>
            <button id="rec-btn-1" class="btn-yellow" onclick="toggleRecord(1)">🎤 開始錄製音訊 1</button>
            <audio id="audio-preview-1" controls style="display:none; width:100%; margin-top:5px;"></audio>
        </div>

        <!-- 第二段音訊 -->
        <div class="audio-box">
            <p style="margin:0 0 5px 0; color:#facc15; font-size:14px;">提示 2：「當你贏咗你會講咩」</p>
            <button id="rec-btn-2" class="btn-yellow" onclick="toggleRecord(2)">🎤 開始錄製音訊 2</button>
            <audio id="audio-preview-2" controls style="display:none; width:100%; margin-top:5px;"></audio>
        </div>

        <button id="upload-audio-btn" class="btn-blue" style="width:100%; display:none;" onclick="uploadAudios()">確定上傳語音</button>
    </div>

    <!-- 3. 房間等候區 -->
    <div class="section" id="sec-room" style="display:none;">
        <h3>3. 房間等候區</h3>
        <p>房間代碼：<span id="room-code-display" style="color: #facc15; font-weight: bold;">-</span></p>

        <!-- 模式選擇 -->
        <div style="margin-bottom: 15px; background-color:#0f172a; padding:10px; border-radius:5px;">
            <label style="font-size:14px; font-weight:bold;">遊戲模式：</label>
            <select id="game-mode-select" onchange="onModeChange()" disabled>
                <option value="one">一鋪定勝負</option>
                <option value="win2">贏兩鋪</option>
                <option value="win3">贏三鋪</option>
                <option value="streak2">連贏兩鋪</option>
            </select>
        </div>

        <!-- 玩家列表 -->
        <div id="player-list" style="margin-bottom: 15px;"></div>

        <button id="ready-btn" class="btn-yellow" onclick="toggleReady()">準備好 / 取消準備</button>
        <button id="host-start-btn" class="btn-green" style="display:none;" onclick="hostStartGame()">開始遊戲</button>
    </div>

    <!-- 4. 遊戲出拳與比賽區 -->
    <div class="section" id="sec-game" style="display:none; text-align: center;">
        <h3 id="game-round-title">第 1 輪比賽</h3>
        <div id="countdown-display" style="font-size: 32px; color:#f59e0b; font-weight:bold; height:40px;"></div>
        
        <div id="game-status-msg" style="color:#38bdf8; font-size:18px; margin: 10px 0;">請出拳！</div>

        <!-- 出拳按鈕 -->
        <div id="choice-area" style="margin: 20px 0;">
            <span class="choice-btn" onclick="makeChoice('rock')">✊</span>
            <span class="choice-btn" onclick="makeChoice('paper')">✋</span>
            <span class="choice-btn" onclick="makeChoice('scissors')">✌️</span>
        </div>

        <div id="round-result-area" style="font-size: 16px; margin-top: 15px; color:#4ade80;"></div>
    </div>

    <!-- 5. 系統日誌視窗（已修復多餘重複區塊） -->
    <div class="section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="font-size: 14px; font-weight: bold;">🛠️ 系統日誌</span>
            <button onclick="clearLog()" style="background:none; color:#94a3b8; font-size:12px; cursor:pointer; padding:0;">清空</button>
        </div>
        <div id="log-window" class="log-window"></div>
    </div>

    <script>
        function logToWindow(message) {
            const logWin = document.getElementById('log-window');
            if (logWin) {
                const timeStr = new Date().toLocaleTimeString();
                logWin.innerHTML += `[${timeStr}] ${message}<br>`;
                logWin.scrollTop = logWin.scrollHeight;
            }
        }

        function clearLog() {
            const logWin = document.getElementById('log-window');
            if (logWin) logWin.innerHTML = '';
        }

        // 全域捕捉 JS 錯誤以防網頁無回應
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            logToWindow(`<span style="color:#ef4444;">[全域錯誤] ${msg} (Line: ${lineNo})</span>`);
            return false;
        };

        logToWindow('[系統] 遊戲腳本載入中...');

        // Firebase v8 初始化
        const firebaseConfig = {
            apiKey: "AIzaSyBUI5N2IZO_2erP6nNHuWB-Q6T7Mrjl_m0",
            authDomain: "game-ad81e.firebaseapp.com",
            databaseURL: "https://game-ad81e-default-rtdb.firebaseio.com",
            projectId: "game-ad81e",
            storageBucket: "game-ad81e.firebasestorage.app",
            messagingSenderId: "524468263754",
            appId: "1:524468263754:web:1c04f7a90860aa4922ffb3",
            measurementId: "G-0QV70FEZMD"
        };

        let db = null;
        function initFirebase() {
            try {
                if (typeof firebase === 'undefined') {
                    logToWindow('<span style="color:#f59e0b;">[警告] 正在等待 Firebase SDK 載入...</span>');
                    setTimeout(initFirebase, 500);
                    return;
                }
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.database();
                logToWindow('[系統] Firebase 連線已就緒！');
            } catch (e) {
                logToWindow('[錯誤] Firebase 初始化失敗: ' + e.message);
            }
        }
        initFirebase();

        // 全局變數
        let myId = '';
        let myName = '';
        let roomId = '';
        let roomRef = null;
        let isHost = false;
        let isReady = false;
        let audioBase64_1 = '';
        let audioBase64_2 = '';
        
        let mediaRecorder = null;
        let audioChunks = [];
        let recordingStep = 0;

        function toggleRecord(step) {
            const btn = document.getElementById(`rec-btn-${step}`);
            if (recordingStep === 0) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(blob);
                        reader.onloadend = () => {
                            if (step === 1) audioBase64_1 = reader.result;
                            if (step === 2) audioBase64_2 = reader.result;
                            checkAudioReady();
                        };
                        const preview = document.getElementById(`audio-preview-${step}`);
                        preview.src = URL.createObjectURL(blob);
                        preview.style.display = 'block';
                        logToWindow(`[錄音] 音訊 ${step} 錄製完成`);
                    };
                    mediaRecorder.start();
                    recordingStep = step;
                    btn.innerText = '⏹️ 停止錄音';
                    btn.className = 'btn-red';
                    logToWindow(`[錄音] 正在錄製音訊 ${step}...`);
                }).catch(err => alert('無法存取麥克風: ' + err.message));
            } else if (recordingStep === step) {
                mediaRecorder.stop();
                recordingStep = 0;
                btn.innerText = `🎤 重錄音訊 ${step}`;
                btn.className = 'btn-yellow';
            }
        }

        function checkAudioReady() {
            if (audioBase64_1 && audioBase64_2) {
                document.getElementById('upload-audio-btn').style.display = 'block';
            }
        }

        function uploadAudios() {
            if (roomRef && myId) {
                roomRef.child('players/' + myId).update({
                    audio1: audioBase64_1,
                    audio2: audioBase64_2
                });
                logToWindow('[錄音] 兩段語音成功同步至房間！');
                alert('語音上傳成功！');
            } else {
                alert('請先加入房間後再上傳語音！');
            }
        }

        // 加入或創建房間
        function joinRoom() {
            myName = document.getElementById('player-name-input').value.trim();
            if (!myName) { alert('請輸入名字'); return; }
            
            myId = 'user_' + Math.random().toString(36).substring(2, 7);
            const inputRoom = document.getElementById('room-id-input').value.trim();
            roomId = inputRoom || '53477b';

            // 立即切換介面顯示等候區
            document.getElementById('room-code-display').innerText = roomId;
            document.getElementById('sec-user').style.display = 'none';
            document.getElementById('sec-room').style.display = 'block';
            logToWindow(`[動作] 嘗試加入房間 ${roomId}...`);

            if (!db) {
                logToWindow('[錯誤] Firebase 資料庫未完成連線，請稍後再試');
                alert('Firebase 連線中，請再按一次按鈕');
                initFirebase();
                return;
            }

            roomRef = db.ref('rooms/' + roomId);

            roomRef.child('players').once('value', snapshot => {
                const players = snapshot.val();
                if (!players) {
                    isHost = true;
                    document.getElementById('host-start-btn').style.display = 'inline-block';
                    document.getElementById('game-mode-select').disabled = false;
                    roomRef.set({
                        host: myId,
                        mode: 'one',
                        status: 'waiting',
                        round: 1
                    });
                    logToWindow(`[房間] 成功創建房間 ${roomId}（您是房主）`);
                } else {
                    isHost = false;
                    logToWindow(`[房間] 成功加入房間 ${roomId}`);
                }

                roomRef.child('players/' + myId).set({
                    id: myId,
                    name: myName,
                    ready: false,
                    alive: true,
                    score: 0,
                    streak: 0,
                    choice: ''
                });

                listenRoom();
            }, error => {
                logToWindow('[錯誤] 房間讀取失敗: ' + error.message);
            });
        }

        function onModeChange() {
            if (!isHost) return;
            const mode = document.getElementById('game-mode-select').value;
            roomRef.update({ mode: mode });
        }

        function toggleReady() {
            isReady = !isReady;
            roomRef.child('players/' + myId).update({ ready: isReady });
        }

        function listenRoom() {
            roomRef.on('value', snapshot => {
                const data = snapshot.val();
                if (!data) return;

                if (data.mode) {
                    document.getElementById('game-mode-select').value = data.mode;
                }

                const playerListDiv = document.getElementById('player-list');
                playerListDiv.innerHTML = '';
                
                let allReady = true;
                let playerCount = 0;
                let players = data.players || {};

                Object.values(players).forEach(p => {
                    playerCount++;
                    if (!p.ready) allReady = false;

                    const item = document.createElement('div');
                    item.className = 'player-item';
                    item.innerHTML = `
                        <span><strong>${p.name}</strong> <span class="badge badge-joined">已進房間</span></span>
                        <span>
                            ${p.alive === false ? '<span class="badge badge-out">已淘汰</span>' : ''}
                            <span class="badge ${p.ready ? 'badge-ready' : 'badge-notready'}">${p.ready ? '準備好' : '未準備'}</span>
                        </span>
                    `;
                    playerListDiv.appendChild(item);
                });

                if (isHost) {
                    document.getElementById('host-start-btn').style.display = (allReady && playerCount >= 2) ? 'inline-block' : 'none';
                }

                if (data.status === 'countdown' && currentStatus !== 'countdown') {
                    startCountdownSequence();
                } else if (data.status === 'playing' && currentStatus !== 'playing') {
                    showGameArea(data);
                } else if (data.status === 'evaluating' && isHost && !isEvaluating) {
                    evaluateRound(data);
                } else if (data.status === 'ended' && currentStatus !== 'ended') {
                    showFinalWinner(data);
                }
                currentStatus = data.status;
            });
        }

        let currentStatus = 'waiting';
        let isEvaluating = false;

        function hostStartGame() {
            if (!isHost) return;
            roomRef.update({ status: 'countdown', round: 1 });
        }

        function startCountdownSequence() {
            document.getElementById('sec-room').style.display = 'none';
            document.getElementById('sec-game').style.display = 'block';
            document.getElementById('choice-area').style.pointerEvents = 'none';
            
            let count = 3;
            const cdBox = document.getElementById('countdown-display');
            cdBox.innerText = `準備... ${count}`;
            
            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    cdBox.innerText = `準備... ${count}`;
                } else {
                    clearInterval(timer);
                    cdBox.innerText = '開始！';
                    if (isHost) {
                        roomRef.update({ status: 'playing' });
                    }
                }
            }, 1000);
        }

        function showGameArea(data) {
            document.getElementById('countdown-display').innerText = '';
            document.getElementById('game-round-title').innerText = `第 ${data.round || 1} 輪比賽`;
            document.getElementById('round-result-area').innerHTML = '';
            
            const myData = data.players[myId];
            if (myData && myData.alive === false) {
                document.getElementById('game-status-msg').innerText = '您已被淘汰，正在觀看比賽...';
                document.getElementById('choice-area').style.display = 'none';
            } else {
                document.getElementById('game-status-msg').innerText = '請出拳！';
                document.getElementById('choice-area').style.display = 'block';
                document.getElementById('choice-area').style.pointerEvents = 'auto';
            }

            if (isHost) {
                let allChosen = true;
                Object.values(data.players).forEach(p => {
                    if (p.alive !== false && !p.choice) allChosen = false;
                });
                if (allChosen) {
                    roomRef.update({ status: 'evaluating' });
                }
            }
        }

        function makeChoice(choice) {
            document.getElementById('choice-area').style.pointerEvents = 'none';
            document.getElementById('game-status-msg').innerText = '已出拳，等待其他玩家...';
            roomRef.child(`players/${myId}`).update({ choice: choice });
            logToWindow(`[遊戲] 我選擇了: ${choice}`);
        }

        async function evaluateRound(data) {
            isEvaluating = true;
            logToWindow('[遊戲] 所有玩家已出拳，播放大合唱錄音...');

            await playChorus(data.players);

            const players = data.players;
            const activePlayers = Object.values(players).filter(p => p.alive !== false);
            
            let choices = activePlayers.map(p => p.choice);
            let uniqueChoices = [...new Set(choices)];

            let roundWinners = [];
            
            if (uniqueChoices.length === 1 || uniqueChoices.length === 3) {
                logToWindow('[結果] 本輪平局，無人淘汰');
                roundWinners = activePlayers;
            } else {
                let wi
