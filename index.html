<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多人包剪探遊戲</title>
    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        h2 { color: #4ade80; display: inline-block; margin: 0; }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background-color: #1e293b;
            padding: 12px 15px;
            border-radius: 8px;
        }
        .version-tag {
            background-color: #334155;
            color: #38bdf8;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            font-family: monospace;
        }
        .section {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px 2px;
        }
        .btn-yellow { background-color: #f59e0b; color: white; }
        .btn-green { background-color: #10b981; color: white; }
        .log-window {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 5px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            height: 120px;
            overflow-y: auto;
            color: #38bdf8;
        }
        .game-area, .waiting-area {
            display: none;
        }
        .active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- 頂部標題與版本號碼 -->
    <div class="header-container">
        <h2>🎮 多人包剪探遊戲</h2>
        <span class="version-tag">v1.1.0</span>
    </div>

    <!-- 房間與等候區 -->
    <div class="section">
        <h3>3. 房間等候區</h3>
        <p>房間代碼：<span id="room-code-display" style="color: #facc15; font-weight: bold;">載入中...</span></p>
        
        <!-- 等候區畫面 -->
        <div id="waiting-area" class="active">
            <button id="ready-btn" class="btn-yellow" onclick="toggleReady()">準備好 / 取消準備</button>
            <button id="host-start-btn" class="btn-green" style="display:none;" onclick="hostStartGame()">準備開始</button>
        </div>

        <!-- 遊戲出拳區畫面 -->
        <div id="game-area" class="game-area" style="text-align: center;">
            <h1 style="color: #ef4444;">請出拳！</h1>
            <div style="font-size: 40px; margin: 20px 0;">
                <span onclick="makeChoice('rock')" style="cursor:pointer; margin: 0 10px;">✊</span>
                <span onclick="makeChoice('paper')" style="cursor:pointer; margin: 0 10px;">✋</span>
                <span onclick="makeChoice('scissors')" style="cursor:pointer; margin: 0 10px;">✌️</span>
            </div>
        </div>
    </div>

    <!-- 系統日誌視窗 -->
    <div class="section">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 14px; font-weight: bold;">🛠️ 系統與代碼運行檢視窗</span>
            <button onclick="clearLog()" style="background:none; color:#94a3b8; font-size:12px; cursor:pointer;">清空</button>
        </div>
        <div id="log-window" class="log-window"></div>
    </div>

    <script>
        function logToWindow(message) {
            const logWin = document.getElementById('log-window');
            const timeStr = new Date().toLocaleTimeString();
            logWin.innerHTML += `[${timeStr}] ${message}<br>`;
            logWin.scrollTop = logWin.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log-window').innerHTML = '';
        }

        logToWindow('[系統] 正在載入版本 v1.1.0...');

        // === 已帶入您專案 (game-ad81e) 的真實設定 ===
        const firebaseConfig = {
            apiKey: "AIzaSyBUI5N2IZO_2erP6nNHuWB-Q6T7Mrjl_m0",
            authDomain: "game-ad81e.firebaseapp.com",
            databaseURL: "https://game-ad81e-default-rtdb.firebaseio.com",
            projectId: "game-ad81e",
            storageBucket: "game-ad81e.firebasestorage.app",
            messagingSenderId: "524468263754",
            appId: "1:524468263754:web:1c04f7a90860aa4922ffb3",
            measurementId: "G-0QV70FEZMD"
        };

        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            logToWindow('[系統] Firebase 連線初始化成功');
        } catch (e) {
            logToWindow('[錯誤] Firebase 初始化失敗: ' + e.message);
        }

        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room') || '53477b';
        let myId = 'user_' + Math.random().toString(36).substring(2, 7);
        let isHost = false;
        let isReadyState = false;

        document.getElementById('room-code-display').innerText = roomId;

        if (db) {
            const roomRef = db.ref('rooms/' + roomId);
            
            roomRef.once('value', (snapshot) => {
                const roomData = snapshot.val();
                if (!roomData) {
                    isHost = true;
                    roomRef.set({
                        host: myId,
                        gameStarted: false,
                        status: 'waiting'
                    });
                    document.getElementById('host-start-btn').style.display = 'inline-block';
                    logToWindow(`[狀態] 您是此房間的房主 (${roomId})`);
                } else {
                    isHost = false;
                    document.getElementById('host-start-btn').style.display = 'none';
                    logToWindow(`[狀態] 您已成功加入房間 (${roomId})`);
                }
                listenToRoomState(roomRef);
            }, (error) => {
                logToWindow('[錯誤] 讀取房間資料失敗: ' + error.message);
            });

            window.toggleReady = function() {
                isReadyState = !isReadyState;
                logToWindow(`[狀態] 切換準備狀態: ${isReadyState}`);
                roomRef.child('players/' + myId).set({ ready: isReadyState });
            }

            window.hostStartGame = function() {
                if (!isHost) return;
                logToWindow('[遊戲] 房主發起遊戲，模式: one');
                roomRef.update({
                    gameStarted: true,
                    mode: 'one'
                });
            }

            function listenToRoomState(ref) {
                ref.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (!data) return;

                    if (data.gameStarted === true) {
                        logToWindow('[遊戲] 收到遊戲開始通知，正在切換畫面...');
                        document.getElementById('waiting-area').style.display = 'none';
                        document.getElementById('game-area').style.display = 'block';
                    }
                });
            }
        }

        window.makeChoice = function(choice) {
            logToWindow(`[遊戲] 您選擇了出拳: ${choice}`);
        }
    </script>
</body>
</html>
