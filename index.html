<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>包剪揼多人對戰 v2.6</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;}
body{padding:16px;max-width:480px;margin:0 auto;background:#f7f9fc;}
.debugWrap{background:#111;color:#3f3;padding:12px;border-radius:8px;font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:180px;overflow:auto;margin-bottom:16px;}
.versionText{text-align:center;font-weight:bold;font-size:16px;margin-bottom:8px;color:#333;}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #00000014;}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-size:18px;color:white;background:#2b78e4;margin:8px 0;transition:0.2s;}
.btn:disabled{background:#aaa;}
.btn.recording{background:#d62828 !important;}
.btn-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ready-ok{color:#28a745;font-weight:bold;}
.ready-wait{color:#999;}
.input-name{width:100%;padding:14px;font-size:18px;border:1px solid #ccc;border-radius:12px;}
.resultBox{margin-top:12px;padding:16px;border-radius:12px;background:#fff8e1;border:1px solid #ffc107;text-align:center;font-size:20px;font-weight:bold;color:#333;}
.resultBox.win{background:#e8f5e9;border-color:#4caf50;color:#2e7d32;}
.resultBox.lose{background:#ffebee;border-color:#f44336;color:#c62828;}
.resultBox.draw{background:#e3f2fd;border-color:#2196f3;color:#1565c0;}
</style>
</head>
<body>

<div class="versionText">版本：v2.6｜包剪揼4位房號版【修復回合不同步｜無彈窗】</div>
<div class="debugWrap" id="debugLog">系統啟動中...</div>

<div class="card" id="nameInputCard">
<h2 style="text-align:center">輸入你的名稱</h2>
<input class="input-name" id="nameInput" placeholder="輸入名字">
<button class="btn" id="nameConfirmBtn">確認</button>
</div>

<div class="card" id="roomSelectCard" style="display:none">
<h2 style="text-align:center">房間操作</h2>
<button class="btn" id="createRoomBtn">建立房間</button>
<button class="btn" id="joinRoomBtn">加入房間</button>
</div>

<div class="card" id="roomJoinCard" style="display:none">
<h2 style="text-align:center">輸入4位房號</h2>
<input class="input-name" id="roomIdInput" placeholder="4位數字">
<button class="btn" id="joinConfirmBtn">確認加入</button>
</div>

<div id="gameMain" style="display:none">
<div class="card">
<h1 style="text-align:center">✊✌✋ 包剪揼多人對戰</h1>
<div id="roomInfo"></div>
<div>連線狀態: <span id="connStatus">等待其他人...</span></div>
</div>

<div class="card">
<h3>等候區</h3>
<div id="playerList"></div>
</div>

<div class="card">
<h3>錄音設定</h3>
<button class="btn" id="rec1Btn">開始錄音(包剪揼口令)</button>
<button class="btn" id="play1Btn">試聽我的口令</button>
<button class="btn" id="rec2Btn">開始錄音(勝利語)</button>
<button class="btn" id="play2Btn">試聽我的勝利語</button>
<p>錄製完成自動發送俾對方</p>
<button class="btn" id="readyBtn">✅ 我準備好</button>
<button class="btn" style="background:#666" id="leaveBtn">🚪 離開房間</button>
</div>

<div class="card" id="modePanel">
<h3>選擇遊戲模式</h3>
<div class="btn-wrap">
<button class="btn" data-mode="one">一鋪定勝負</button>
<button class="btn" data-mode="win2">贏兩鋪</button>
<button class="btn" data-mode="win3">贏三鋪</button>
<button class="btn" data-mode="con2">連贏兩鋪</button>
</div>
</div>

<div class="card" id="gamePanel" style="display:none">
<h3>請選擇：包 / 剪 / 揼</h3>
<div class="btn-wrap">
<button class="btn handBtn" data-hand="rock">✊ 包</button>
<button class="btn handBtn" data-hand="scissors">✌ 剪</button>
<button class="btn handBtn" data-hand="paper">✋ 揼</button>
</div>

<div id="scoreText" style="margin-top:12px;font-weight:bold;text-align:center;">我分數:0 | 對手分數:0 | 連贏:0</div>
<div class="resultBox" id="resultBox" style="display:none;"></div>
</div>
</div>

<script>
let peer, conn;
let roomId;
let hostPeerId;
let myName = "";
let isHost = false;
let players = {};
let myReady = false;
let audio1 = null, audio2=null;
let remoteAudio1=null, remoteAudio2=null;
let gameMode = null;
let myHand=null, remoteHand=null;
let scoreMe=0, scoreOpp=0, streak=0;
let firebaseApp, firebaseDB;
let isRecording = false;
let roundReadyMyHand = null;
let roundReadyRemoteHand = null;
let roundLocked = false;

const firebaseConfig = {
  apiKey: "AIzaSyBUI5N2IZO_2erP6nNHuWB-Q6T7Mrjl_m0",
  authDomain: "game-ad81e.firebaseapp.com",
  databaseURL: "https://game-ad81e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "game-ad81e",
  storageBucket: "game-ad81e.appspot.com",
  messagingSenderId: "xxxxxxx",
  appId: "xxxxxxx"
};

const debugLog = document.querySelector("#debugLog");
function log(msg){
  const t = new Date().toLocaleTimeString();
  debugLog.textContent += `[${t}] ${msg}\n`;
  debugLog.scrollTop = debugLog.scrollHeight;
}

log("✅ v2.6 載入｜修復回合同步問題，移除彈窗");

const nameConfirmBtn = document.querySelector("#nameConfirmBtn");
const nameInput = document.querySelector("#nameInput");
const nameInputCard = document.querySelector("#nameInputCard");
const roomSelectCard = document.querySelector("#roomSelectCard");
nameConfirmBtn.onclick = function(){
  myName = nameInput.value.trim();
  log(`🖱️ 按下【確認】，輸入名稱：${myName}`);
  if(!myName){
    alert("請輸入名字");
    return;
  }
  nameInputCard.style.display="none";
  roomSelectCard.style.display="block";
  log(`✅玩家名字設定: ${myName}`);
}

async function loadScript(url) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = url;
    script.onload = ()=>resolve(url);
    script.onerror = ()=>reject(`載入失敗:${url}`);
    document.body.appendChild(script);
  })
}

async function loadAllLibs(){
  try{
    log("🔄 開始載入PeerJS");
    await loadScript("https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js");
    log("✅ PeerJS載入成功");
    log("🔄 開始載入Firebase v8");
    await loadScript("https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js");
    await loadScript("https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js");
    log("✅ Firebase v8 SDK載入成功，初始化Firebase");
    firebaseApp = firebase.initializeApp(firebaseConfig);
    firebaseDB = firebase.database(firebaseApp);
    log("✅ Firebase初始化完成");
    bindAllOtherButtons();
  }catch(err){
    log("❌外部庫載入失敗:"+err);
    alert("網絡問題，無法載入遊戲核心庫，請轉用另一個網絡/瀏覽器");
  }
}

function bindAllOtherButtons(){
  log("🔗 綁定房間、錄音、遊戲按鈕");
  const createRoomBtn = document.querySelector("#createRoomBtn");
  const joinRoomBtn = document.querySelector("#joinRoomBtn");
  const roomJoinCard = document.querySelector("#roomJoinCard");
  const roomIdInput = document.querySelector("#roomIdInput");
  const joinConfirmBtn = document.querySelector("#joinConfirmBtn");
  const gameMain = document.querySelector("#gameMain");
  const roomInfo = document.querySelector("#roomInfo");
  const connStatus = document.querySelector("#connStatus");
  const playerList = document.querySelector("#playerList");
  const readyBtn = document.querySelector("#readyBtn");
  const leaveBtn = document.querySelector("#leaveBtn");
  const rec1Btn = document.querySelector("#rec1Btn");
  const play1Btn = document.querySelector("#play1Btn");
  const rec2Btn = document.querySelector("#rec2Btn");
  const play2Btn = document.querySelector("#play2Btn");
  const modePanel = document.querySelector("#modePanel");
  const gamePanel = document.querySelector("#gamePanel");
  const scoreText = document.querySelector("#scoreText");
  const resultBox = document.querySelector("#resultBox");
  const handBtns = document.querySelectorAll(".handBtn");

  createRoomBtn.onclick = async function(){
    isHost=true;
    roomSelectCard.style.display="none";
    gameMain.style.display="block";
    roomId = String(Math.floor(Math.random()*9000)+1000);
    log(`🏠建立4位房號:${roomId}`);
    peer = new Peer();
    peer.on("open", pid=>{
      hostPeerId = pid;
      log(`✅房主PeerID:${pid}`);
      firebaseDB.ref(`rooms/${roomId}`).set({hostPeer:pid, players:{[myName]:{ready:false}}});
      roomInfo.innerText = `房號：${roomId}\n將4位房號發送俾朋友`;
      listenRoom();
    })
    peer.on("connection",c=>{
      log("🎉有玩家接入");
      conn = c; bindConnEvents(conn, connStatus);
    })
    peer.on("error",err=>log("❌Peer錯誤:"+err));
  }

  joinRoomBtn.onclick = function(){
    roomSelectCard.style.display="none";
    roomJoinCard.style.display="block";
  }

  joinConfirmBtn.onclick = async function(){
    roomId = roomIdInput.value.trim();
    if(!/^\d{4}$/.test(roomId)){alert("請輸入4位數字");return;}
    roomJoinCard.style.display="none";
    gameMain.style.display="block";
    isHost=false;
    log(`🔍嘗試加入房號:${roomId}`);
    const snap = await firebaseDB.ref(`rooms/${roomId}`).get();
    if(!snap.exists()){
      log("❌房號不存在");
      alert("房號不存在！");
      return;
    }
    const roomData = snap.val();
    hostPeerId = roomData.hostPeer;
    log(`✅搵到房主PeerID:${hostPeerId}`);
    peer = new Peer();
    peer.on("open",()=>{
      log("客戶Peer已開啟，嘗試連房主");
      conn = peer.connect(hostPeerId);
      bindConnEvents(conn, connStatus);
      firebaseDB.ref(`rooms/${roomId}/players/${myName}`).set({ready:false});
      listenRoom();
    })
    peer.on("error",err=>log("❌Peer錯誤:"+err));
  }

  function listenRoom(){
    firebaseDB.ref(`rooms/${roomId}`).on("value",snap=>{
      const d = snap.val();
      if(!d) return;
      players = d.players || {};
      renderPlayerList(playerList);
      checkAllReady();
    })
  }

  function bindConnEvents(connObj, statusDom){
    statusDom.textContent="✅已連線";
    connObj.on("open",()=>{
      log("🔗P2P連線成功");
      sendMsg(connObj, {type:"JOIN",name:myName});
    })
    connObj.on("data",data=>{
      log("📥收到訊息："+JSON.stringify(data));
      switch(data.type){
        case "AUDIO_BLOB":
          if(data.a===1) {
            remoteAudio1 = new Audio(URL.createObjectURL(data.blob));
            log("🎵收到對方口令音訊 remoteAudio1");
          }
          if(data.a===2) {
            remoteAudio2 = new Audio(URL.createObjectURL(data.blob));
            log("🎵收到對方勝利音 remoteAudio2");
          }
          break;
        case "GAME_START":
          gameMode = data.mode;
          modePanel.style.display="none";
          gamePanel.style.display="block";
          resetRound();
          break;
        case "HAND":
          remoteHand = data.hand;
          roundReadyRemoteHand = data.hand;
          log(`📥收到對手手勢:${remoteHand}`);
          checkBothHandReady(scoreText, resultBox);
          break;
        case "PLAY_WIN_AUDIO":
          if(data.winner==="me"){
            log("🔊播放【我方】勝利錄音");
            audio2.currentTime=0;
            audio2.play().catch(e=>log("⚠️勝利音播放失敗:"+e.message));
          }else if(data.winner==="opp"){
            log("🔊播放【對手】勝利錄音");
            remoteAudio2.currentTime=0;
            remoteAudio2.play().catch(e=>log("⚠️對手勝利音播放失敗:"+e.message));
          }
          break;
        case "ROUND_RESET":
          log("🔁收到房主回合重置指令，準備下一鋪");
          resetRound();
          break;
      }
    })
  }

  function sendMsg(c,obj){
    if(c && c.open) c.send(obj);
  }

  function renderPlayerList(dom){
    let html="";
    Object.entries(players).forEach(([name,p])=>{
      const cls = p.ready ? "ready-ok" : "ready-wait";
      const icon = p.ready ? "✅已準備" : "⏳未準備";
      html += `<div class="${cls}">${name} ${icon}</div>`;
    })
    dom.innerHTML = html;
  }

  readyBtn.onclick = function(){
    myReady = !myReady;
    firebaseDB.ref(`rooms/${roomId}/players/${myName}/ready`).set(myReady);
    log(`${myName} 設定準備狀態:${myReady}`);
  }

  function checkAllReady(){
    const allReady = Object.values(players).every(p=>p.ready===true);
    if(allReady && isHost){
      log("✅全部玩家已準備，可以揀遊戲模式");
    }
  }

  async function recordAudio(num, btnElement){
    if(isRecording) return;
    isRecording = true;
    let rec = null;
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      rec = new MediaRecorder(stream);
      const chunks=[];
      rec.ondataavailable=e=>chunks.push(e.data);

      btnElement.classList.add("recording");
      let remain = 3;
      btnElement.innerText = `錄音中 ${remain}`;
      log(`🎙開始錄音${num}`);
      rec.start();

      const timer = setInterval(()=>{
        remain--;
        if(remain>0){
          btnElement.innerText = `錄音中 ${remain}`;
        }else{
          clearInterval(timer);
        }
      },1000);

      setTimeout(()=>{
        rec.stop();
        btnElement.classList.remove("recording");
        btnElement.innerText = num===1 ? "開始錄音(包剪揼口令)" : "開始錄音(勝利語)";
      },3000);

      rec.onstop=()=>{
        clearInterval(timer);
        const blob = new Blob(chunks,{type:"audio/webm"});
        if(num===1) audio1 = new Audio(URL.createObjectURL(blob));
        if(num===2) audio2 = new Audio(URL.createObjectURL(blob));
        sendMsg(conn, {type:"AUDIO_BLOB",a:num,blob});
        log(`🎙錄音${num}完成，自動發送P2P給對方`);
        stream.getTracks().forEach(t=>t.stop());
        isRecording = false;
      }
    }catch(e){
      log("❌錄音失敗:"+e);
      btnElement.classList.remove("recording");
      btnElement.innerText = num===1 ? "開始錄音(包剪揼口令)" : "開始錄音(勝利語)";
      isRecording = false;
    }
  }

  rec1Btn.onclick=()=>recordAudio(1, rec1Btn);
  rec2Btn.onclick=()=>recordAudio(2, rec2Btn);

  play1Btn.onclick=()=>audio1?.play().catch(e=>log("試聽口令失敗:"+e));
  play2Btn.onclick=()=>audio2?.play().catch(e=>log("試聽勝利語失敗:"+e));

  document.querySelectorAll("#modePanel button[data-mode]").forEach(btn=>{
    btn.onclick=()=>{
      gameMode = btn.dataset.mode;
      sendMsg(conn, {type:"GAME_START",mode:gameMode});
      modePanel.style.display="none";
      gamePanel.style.display="block";
      resetRound();
      log("🎮房主設定遊戲模式："+gameMode);
    }
  })

  handBtns.forEach(btn=>{
    btn.onclick=()=>{
      if(roundLocked) return;
      handBtns.forEach(b=>b.disabled=true);
      myHand = btn.dataset.hand;
      roundReadyMyHand = myHand;
      sendMsg(conn, {type:"HAND",hand:myHand});
      log("✊我揀咗："+myHand);
      checkBothHandReady(scoreText, resultBox);
    }
  })

  function checkBothHandReady(scoreDom, resultDom){
    if(roundLocked) return;
    if(roundReadyMyHand && roundReadyRemoteHand){
      roundLocked = true;
      log("✅雙方手勢齊！開始同步播放口令（大合唱）");
      startSyncPlay(scoreDom, resultDom);
    }
  }

  async function startSyncPlay(scoreDom, resultDom){
    let p1 = Promise.resolve();
    let p2 = Promise.resolve();

    if(audio1){
      audio1.currentTime =0;
      p1 = audio1.play().then(()=>waitAudioEnd(audio1)).catch(err=>{
        log("⚠️自己口令播放異常，直接繼續:"+err.message);
        return true;
      })
    }
    if(remoteAudio1){
      remoteAudio1.currentTime =0;
      p2 = remoteAudio1.play().then(()=>waitAudioEnd(remoteAudio1)).catch(err=>{
        log("⚠️對方口令播放異常，直接繼續:"+err.message);
        return true;
      })
    }

    Promise.all([p1,p2]).then(()=>{
      log("🔊大合唱流程完結，計算結果");
      calcGameResult(scoreDom, resultDom);
    })
  }

  function waitAudioEnd(audioObj){
    return new Promise(resolve=>{
      if(!audioObj) return resolve();
      audioObj.onended = ()=>{
        log("🎵音訊播放完畢");
        resolve();
      }
    })
  }

  function calcGameResult(scoreDom, resultDom){
    const win = {rock:"scissors",scissors:"paper",paper:"rock"};
    let res;
    let winnerTag = null;
    let resultType = "draw";

    if(myHand === remoteHand){
      res="平手，本鋪不計分，繼續";
      streak=0;
      resultType = "draw";
    }else if(win[myHand] === remoteHand){
      res="你贏呢鋪";
      scoreMe++;
      streak++;
      winnerTag = "me";
      resultType = "win";
    }else{
      res="你輸呢鋪";
      scoreOpp++;
      streak=0;
      winnerTag = "opp";
      resultType = "lose";
    }

    // 移除舊有結果樣式
    resultBox.classList.remove("win","lose","draw");
    resultBox.classList.add(resultType);
    resultBox.style.display = "block";
    resultBox.innerHTML = `${res}<br>我:${scoreMe} | 對手:${scoreOpp} | 連贏:${streak}`;

    scoreDom.textContent=`我分數:${scoreMe} | 對手分數:${scoreOpp} | 連贏:${streak}`;
    log(`📊賽果: ${res} | 我:${scoreMe} 對手:${scoreOpp} 連贏:${streak}`);

    if(winnerTag){
      sendMsg(conn, {type:"PLAY_WIN_AUDIO", winner:winnerTag});
      if(winnerTag==="me"){
        audio2.currentTime=0;
        audio2.play().catch(e=>log("播放勝利音錯誤:"+e));
      }else if(winnerTag==="opp"){
        remoteAudio2.currentTime=0;
        remoteAudio2.play().catch(e=>log("播放對手勝利音錯誤:"+e));
      }
    }

    // ✅重點：房主負責發送全房重置指令
    setTimeout(()=>{
      if(isHost){
        sendMsg(conn, {type:"ROUND_RESET"});
        log("📤房主發送回合重置指令給對手");
      }
      resetRound();
    },1500);
  }

  function resetRound(){
    log("🔄重置回合，等待下一鋪出拳");
    roundReadyMyHand = null;
    roundReadyRemoteHand = null;
    roundLocked = false;
    myHand = null;
    remoteHand = null;
    document.querySelectorAll(".handBtn").forEach(b=>b.disabled=false);
  }

  leaveBtn.onclick=()=>location.reload();
}

window.addEventListener('load', ()=>{
  log("📄 頁面全部DOM載入完，開始載入遊戲庫");
  loadAllLibs();
})
</script>
</body>
</html>
