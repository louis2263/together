<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>包剪揼多人對戰 v4.4｜斷線自動移除玩家</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{padding:16px;background:#f4f4f4}
.debug{background:#111;color:#3f3;padding:10px;border-radius:8px;white-space:pre-wrap;font-size:12px;max-height:220px;overflow-y:auto;margin-bottom:16px;position:sticky;top:0;z-index:99;}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #00000015}
button{width:100%;padding:16px;font-size:18px;border:none;border-radius:10px;margin:6px 0;color:#fff;background:#2b78e4}
button:disabled{background:#aaa}
button.recording{background:#d03030}
.info{font-size:17px;margin:8px 0}
.ready-yes{color:#229922;font-weight:bold}
.score{font-size:20px;text-align:center;margin-top:10px}
input{width:100%;padding:14px;font-size:18px;border:1px solid #ccc;border-radius:8px;margin:6px 0}
.start-hide{display:none}
</style>
</head>
<body>
<div class="debug" id="debug">版本 v4.4｜包=paper，剪=scissors，揼=rock｜Firebase傳音頻｜斷線自動移除玩家</div>

<div class="card" id="startPanel">
  <h2>✊✌️🖐️ 包剪揼多人對戰</h2>
  <input id="inputName" placeholder="輸入你嘅名字">
  <input id="inputRoom" placeholder="房號（開新房間就留空）">
  <button id="btnCreateRoom">開新房間</button>
  <button id="btnJoinRoom">加入房間</button>
</div>

<div id="gamePanel" class="start-hide">
  <div class="card">
    <div class="info">房號：<span id="roomId"></span></div>
    <div class="info">傳輸模式：Firebase實時資料庫</div>
  </div>

  <div class="card">
    <h3>等候區</h3>
    <div id="playerList"></div>
  </div>

  <div class="card">
    <h3>錄音設定</h3>
    <button id="recBtn1">開始錄音(包剪揼口令)</button>
    <button id="playBtn1">試聽我的口令</button>
    <button id="recBtn2">開始錄音(勝利語)</button>
    <button id="playBtn2">試聽我的勝利語</button>
    <p>錄製完成自動上傳到Firebase，對方自動接收</p>
    <button id="readyBtn">✅ 我準備好</button>
    <button id="leaveBtn">🚪 離開房間</button>
  </div>

  <div class="card">
    <h3>請選擇：包 / 剪 / 揼</h3>
    <button id="selPaper" disabled>🖐️ 包</button>
    <button id="selScissors" disabled>✌️ 剪</button>
    <button id="selRock" disabled>✊ 揼</button>
    <div class="score">我分數:<span id="myScore">0</span> | 對手分數:<span id="oppScore">0</span></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@8.10.1/firebase-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@8.10.1/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBUI5N2IZO_2erP6nNHuWB-Q6T7Mrjl_m0",
  authDomain: "game-ad81e.firebaseapp.com",
  databaseURL: "https://game-ad81e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "game-ad81e",
  storageBucket: "game-ad81e.firebasestorage.app"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let roomId = "";
let myName = "";
let isHost = false;

let audioBlob1, audioBlob2;
let oppAudio1, oppAudio2;

let myReady = false;
let myChoice = null;
let myScore = 0, oppScore = 0;
let roundLock = false;
let playerRef;

const $ = s=>document.querySelector(s);
const debugEl = $("#debug");
function log(txt){
  const t = new Date().toLocaleTimeString();
  debugEl.innerText += `[${t}] ${txt}\n`;
  debugEl.scrollTop = debugEl.scrollHeight;
}

$("#btnCreateRoom").onclick = async ()=>{
  myName = $("#inputName").value.trim();
  if(!myName) {
    log("❌ 請輸入名字");
    return;
  }
  roomId = String(Math.floor(Math.random()*9000)+1000);
  isHost = true;
  log(`✅ 房主，建立房號 ${roomId}`);

  // 開房時清空舊音訊
  await db.ref(`rooms/${roomId}/audio`).remove();
  log("🧹【開房】已清空本房舊音訊檔案");

  await db.ref(`rooms/${roomId}`).set({
    players:{},
    round:{state:"idle",c1:null,c2:null},
    score:{p1:0,p2:0},
    audio:{p1:{audio1:null,audio2:null},p2:{audio1:null,audio2:null}}
  });
  enterGame();
};

$("#btnJoinRoom").onclick = ()=>{
  myName = $("#inputName").value.trim();
  roomId = $("#inputRoom").value.trim();
  if(!myName) {
    log("❌ 請輸入名字");
    return;
  }
  if(!/^\d{4}$/.test(roomId)){
    log("❌ 房號必須輸入4個數字！");
    return;
  }
  isHost = false;
  log(`✅ 玩家，準備進房 ${roomId}`);
  enterGame();
};

function enterGame(){
  $("#startPanel").classList.add("start-hide");
  $("#gamePanel").classList.remove("start-hide");
  $("#roomId").innerText = roomId;
  initRoom();
}

// Blob <-> Base64 轉換工具
async function blobToBase64(blob) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  })
}
async function base64ToBlob(base64Str) {
  const res = await fetch(base64Str);
  return res.blob();
}

function initRoom(){
  const roomRef = db.ref(`rooms/${roomId}`);
  playerRef = roomRef.child("players").child(myName);
  // 註冊玩家
  playerRef.set({ready:false});

  // ✨重點更新：斷線時直接刪除玩家，等候區會自動消失呢個玩家
  playerRef.onDisconnect().remove();
  log("🔗 已註冊斷線監聽：斷線會直接移除玩家");

  // 監聽玩家列表
  roomRef.child("players").on("value",snap=>{
    const pl = snap.val()||{};
    let html = "";
    for(let n in pl){
      html += `<div>${n} ${pl[n].ready?"<span class='ready-yes'>✅已準備</span>":"❌未準備"}</div>`
    }
    $("#playerList").innerHTML = html;
    checkAllReady(pl);
  })

  // 監聽音頻（對方錄音更新）
  roomRef.child("audio").on("value", async snap=>{
    const audioData = snap.val();
    if(!audioData) return;
    if(isHost){
      //房主聽p2嘅音頻
      if(audioData.p2?.audio1){
        oppAudio1 = await base64ToBlob(audioData.p2.audio1);
        log("✅收到對方口令音頻(Firebase)");
      }
      if(audioData.p2?.audio2){
        oppAudio2 = await base64ToBlob(audioData.p2.audio2);
        log("✅收到對方勝利音頻(Firebase)");
      }
    }else{
      //客人聽p1嘅音頻
      if(audioData.p1?.audio1){
        oppAudio1 = await base64ToBlob(audioData.p1.audio1);
        log("✅收到對方口令音頻(Firebase)");
      }
      if(audioData.p1?.audio2){
        oppAudio2 = await base64ToBlob(audioData.p1.audio2);
        log("✅收到對方勝利音頻(Firebase)");
      }
    }
  })

  //監聽回合狀態
  roomRef.child("round").on("value",snap=>{
    const r = snap.val();
    if(!r) return;
    log(`回合狀態:${r.state},c1:${r.c1},c2:${r.c2}`);
    if(r.state==="waitingChoose"){
      unlockSelect();
    }
    if(r.c1 && r.c2 && r.state !== "judge" && !roundLock){
      log("✅雙方已經出拳，進入賽果判斷");
      roundLock=true;
      db.ref(`rooms/${roomId}/round`).update({state:"judge"});
      calcResult(r.c1,r.c2);
    }
    if(r.state==="reset"){
      resetRoundUI();
      roundLock=false;
    }
  })

  //監聽分數
  roomRef.child("score").on("value",snap=>{
    const sc = snap.val()||{p1:0,p2:0};
    myScore = isHost ? sc.p1 : sc.p2;
    oppScore = isHost ? sc.p2 : sc.p1;
    $("#myScore").innerText = myScore;
    $("#oppScore").innerText = oppScore;
    log(`📊分數更新：我${myScore}，對手${oppScore}`);
  })
}

function checkAllReady(players){
  const names = Object.keys(players);
  if(names.length<2) return;
  const allReady = names.every(k=>players[k].ready===true);
  if(allReady){
    log("✅全部玩家已準備，開啟回合等待出拳");
    if(isHost){
      db.ref(`rooms/${roomId}/round`).update({state:"waitingChoose",c1:null,c2:null})
    }
  }
}

function unlockSelect(){
  $("#selPaper").disabled=false;
  $("#selScissors").disabled=false;
  $("#selRock").disabled=false;
  log("✅可以揀包/剪/揼");
}
function lockSelect(){
  $("#selPaper").disabled=true;
  $("#selScissors").disabled=true;
  $("#selRock").disabled=true;
}

$("#selPaper").onclick=()=>submitChoice("paper");
$("#selScissors").onclick=()=>submitChoice("scissors");
$("#selRock").onclick=()=>submitChoice("rock");

function submitChoice(c){
  if(myChoice) return;
  myChoice = c;
  lockSelect();
  log(`我揀咗:${c}`);
  let updateData = {};
  if(isHost){
    updateData["c1"] = c;
  }else{
    updateData["c2"] = c;
  }
  db.ref(`rooms/${roomId}/round`).update(updateData);
}

async function calcResult(c1,c2){
  log("✅開始計賽果 + 大合唱");
  try{
    if(audioBlob1 && oppAudio1){
      const aMy = new Audio(URL.createObjectURL(audioBlob1));
      const aOpp = new Audio(URL.createObjectURL(oppAudio1));
      aMy.play(); aOpp.play();
    }else{
      log("ℹ️ 其中一方口令音頻未收到，跳過大合唱");
    }
  }catch(e){log("⚠️ 音頻播放錯誤："+e)}

  let win = null;
  if(c1 === c2) {
    win = "draw";
    log(`賽果:和局`);
  }
  else if(
    (c1 === "rock" && c2 === "scissors") ||
    (c1 === "scissors" && c2 === "paper") ||
    (c1 === "paper" && c2 === "rock")
  ){
    win = "p1";
    log(`賽果:p1贏`);
  }else{
    win = "p2";
    log(`賽果:p2贏`);
  }

  db.ref(`rooms/${roomId}/score`).once(snap=>{
    const s = snap.val();
    let np1=s.p1,np2=s.p2;
    if(win=="p1") np1++;
    if(win=="p2") np2++;
    db.ref(`rooms/${roomId}/score`).update({p1:np1,p2:np2});

    setTimeout(()=>{
      try{
        if(win=="p1" && audioBlob2){
          const aud = new Audio(URL.createObjectURL(audioBlob2));
          aud.play();
        }else if(win=="p2" && oppAudio2){
          const aud = new Audio(URL.createObjectURL(oppAudio2));
          aud.play();
        }
      }catch(e){log("⚠️勝利音頻播放錯誤："+e)}

      // 每回合完結，房主清空音訊
      if(isHost){
        setTimeout(async ()=>{
          await db.ref(`rooms/${roomId}/audio`).remove();
          log("🧹【回合完結】清空本房音訊");
          // 重置回合狀態
          db.ref(`rooms/${roomId}/round`).update({state:"reset",c1:null,c2:null})
        },1200)
      }
    },1200)
  })
}
function resetRoundUI(){
  myChoice = null;
  lockSelect();
  // 清空本機緩存嘅音頻變數，避免重用舊錄音
  audioBlob1 = null;
  audioBlob2 = null;
  oppAudio1 = null;
  oppAudio2 = null;
  log("✅回合重置，本地音頻緩存已清空，等待下一輪錄音");
}

//錄音功能：3秒自動停止，轉base64存入firebase
$("#recBtn1").onclick=async()=>{await startRec(1,$("#recBtn1"))}
$("#recBtn2").onclick=async()=>{await startRec(2,$("#recBtn2"))}
async function startRec(no,btn){
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  const rec = new MediaRecorder(stream);
  btn.classList.add("recording");
  log(`開始錄音${no}，3秒後自動停`);
  const chunks=[];
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=async ()=>{
    const b = new Blob(chunks,{type:"audio/webm"});
    const base64Audio = await blobToBase64(b);
    if(no===1) {
      audioBlob1=b;
      if(isHost){
        await db.ref(`rooms/${roomId}/audio/p1/audio1`).set(base64Audio);
      }else{
        await db.ref(`rooms/${roomId}/audio/p2/audio1`).set(base64Audio);
      }
      log(`✅錄音1完成，上傳Firebase`);
    }
    if(no===2) {
      audioBlob2=b;
      if(isHost){
        await db.ref(`rooms/${roomId}/audio/p1/audio2`).set(base64Audio);
      }else{
        await db.ref(`rooms/${roomId}/audio/p2/audio2`).set(base64Audio);
      }
      log(`✅錄音2完成，上傳Firebase`);
    }
    btn.classList.remove("recording");
    stream.getTracks().forEach(t=>t.stop());
  }
  rec.start();
  setTimeout(()=>rec.stop(),3000);
}
$("#playBtn1").onclick=()=>{if(audioBlob1)new Audio(URL.createObjectURL(audioBlob1)).play()}
$("#playBtn2").onclick=()=>{if(audioBlob2)new Audio(URL.createObjectURL(audioBlob2)).play()}

$("#readyBtn").onclick=()=>{
  myReady = !myReady;
  playerRef.set({ready:myReady});
  log(`${myName} 設定準備狀態:${myReady}`);
}
$("#leaveBtn").onclick=async ()=>{
  //手動按離開：直接刪除自己嘅玩家紀錄
  await playerRef.remove();
  log(`🚪手動離開，移除玩家紀錄`);
  location.reload();
}
</script>
</body>
</html>
