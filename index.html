<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>包剪揼多人遊戲 v6.1 | 加回已準備功能</title>
    <style>
        *{box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
        body{background:#f3f4f6;margin:0;padding:16px;color:#222}
        .debugBox{position:fixed;top:8px;left:8px;right:8px;background:#000;color:#39ff14;padding:10px;border-radius:8px;z-index:9999;font-size:13px;max-height:160px;overflow-y:auto;white-space:pre-line}
        .container{max-width:520px;margin:190px auto 30px;background:#fff;border-radius:16px;padding:20px}
        .roomInfo{background:#e8f0fe;padding:16px;border-radius:12px;text-align:center;margin-bottom:16px}
        .playerItem{background:#f0f4ff;padding:10px;border-radius:8px;margin:8px 0;display:flex;justify-content:space-between}
        .ruleBox{background:#fff8dc;padding:14px;border-radius:10px;margin:16px 0}
        button{width:100%;padding:16px;font-size:18px;border:none;border-radius:12px;margin:8px 0;color:white;font-weight:bold}
        .btnBlue{background:#2b78e4}
        .btnRed{background:#dc3545}
        .btnGreen{background:#28a745}
        .handRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:20px 0}
        .handBtn{background:#eee;color:#222;padding:12px;border-radius:12px;border:2px solid #aaa}
        .handBtn img{width:80px;height:auto}
    </style>
</head>
<body>
<div class="debugBox" id="debug">版本 v6.1 | 多人包剪揼｜已準備機制｜錄音3秒自動停止｜存活大合唱</div>
<div class="container">
    <div class="roomInfo">
        <h2>🏠 房號：<span id="roomIdDisplay"></span></h2>
        <h3>📌 對戰模式：贏兩鋪</h3>
        <div id="playerList"></div>
        <div id="gameStatus">等待玩家準備...</div>
    </div>
    <div class="ruleBox">
        <h3>📜 遊戲規則：</h3>
        <p>1. 包（布）贏掱（石頭）<br>
        2. 掱（石頭）贏剪（剪刀）<br>
        3. 剪（剪刀）贏包（布）<br>
        4. 雙方一樣就和局，唔計分<br>
        5. 只剩兩種手勢：輸嗰類全部淘汰</p>
    </div>
    <p style="text-align:center">🎙️ 錄音：3秒自動停止，按掣變紅</p>
    <button class="btnBlue" id="recChorusBtn">錄【大合唱】語音</button>
    <button class="btnBlue" id="playChorusBtn">試聽大合唱</button>
    <button class="btnBlue" id="recWinBtn">錄【勝利】語音</button>
    <button class="btnBlue" id="playWinBtn">試聽勝利語音</button>

    <button class="btnGreen" id="readyBtn">✅ 已準備</button>
    <button class="btnRed" id="startGameBtn" style="display:none">🚀 房主：開始遊戲</button>
    <button class="btnBlue" id="leaveBtn">🚪 離開房間</button>

    <h3 style="text-align:center;margin-top:24px">請選擇：包 / 剪 / 掱</h3>
    <div class="handRow">
        <button class="handBtn" data-hand="paper">
            <img alt="包">
            <div>包</div>
        </button>
        <button class="handBtn" data-hand="scissors">
            <img alt="剪">
            <div>剪</div>
        </button>
        <button class="handBtn" data-hand="rock">
            <img alt="掱">
            <div>掱</div>
        </button>
    </div>
    <div id="scoreText" style="text-align:center;font-size:20px"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
// ========== Firebase Config 用返你本身嘅設定 ==========
const firebaseConfig = {
  apiKey: "AIzaSyBUI5N2IZO_2erP6nNHuWB-Q6T7Mrjl_m0",
  authDomain: "game-ad81e.firebaseapp.com",
  databaseURL: "https://game-ad81e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "game-ad81e",
  storageBucket: "game-ad81e.appspot.com",
  messagingSenderId: "1042204720208071118",
  appId: "1:1042204720208071118:web:xxxxxxxxxxxxxxxxx"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
// ========== 變數 ==========
let roomId = "";
let myName = "";
let isHost = false;
let myReady = false;
let chorusBlob = null;
let winBlob = null;
let mediaRecorder = null;
let debugDom = document.getElementById("debug");
const log = (txt)=>{
    const d = new Date();
    const time = `[${d.getHours()}:${d.getMinutes()}:${d.getSeconds()}]`;
    debugDom.innerText += `\n${time} ${txt}`;
    debugDom.scrollTop = debugDom.scrollHeight;
};
// ========== 錄音功能 3秒自動停止 ==========
async function startRecord(targetKey, btnEl){
    try{
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        btnEl.style.background = "#dc3545";
        log("🔴 開始錄音，3秒後自動停止");
        mediaRecorder = new MediaRecorder(stream);
        const chunks = [];
        mediaRecorder.ondataavailable = e=>chunks.push(e.data);
        mediaRecorder.onstop = ()=>{
            const blob = new Blob(chunks,{type:"audio/webm"});
            stream.getTracks().forEach(t=>t.stop());
            btnEl.style.background="#2b78e4";
            if(targetKey==="chorus") chorusBlob = blob;
            if(targetKey==="win") winBlob = blob;
            uploadAudio(targetKey,blob);
        }
        mediaRecorder.start();
        setTimeout(()=>{
            if(mediaRecorder.state==="recording") mediaRecorder.stop();
        },3000);
    }catch(e){log("❌ 錄音失敗："+e.message)}
}
async function uploadAudio(type,blob){
    const reader = new FileReader();
    reader.onload = ()=>{
        const b64 = reader.result;
        db.ref(`rooms/${roomId}/players/${myName}/${type}Audio`).set(b64);
        log(`✅ ${type==="chorus"?"大合唱":"勝利"}錄音完成，上傳Firebase`);
    }
    reader.readAsDataURL(blob);
}
async function playBlob(blob){
    const url = URL.createObjectURL(blob);
    const au = new Audio(url);
    await au.play();
}
// ========== 房間同玩家狀態 ==========
document.getElementById("recChorusBtn").onclick=()=>startRecord("chorus",document.getElementById("recChorusBtn"));
document.getElementById("recWinBtn").onclick=()=>startRecord("win",document.getElementById("recWinBtn"));
document.getElementById("playChorusBtn").onclick=()=>{if(chorusBlob) playBlob(chorusBlob)};
document.getElementById("playWinBtn").onclick=()=>{if(winBlob) playBlob(winBlob)};

document.getElementById("readyBtn").onclick=async ()=>{
    myReady = !myReady;
    await db.ref(`rooms/${roomId}/players/${myName}/ready`).set(myReady);
    document.getElementById("readyBtn").innerText = myReady ? "❌ 取消準備" : "✅ 已準備";
    log(myReady ? "✅ 我標記為已準備" : "❌ 取消準備");
}
// 監聽房間玩家列表，判斷全部人是否準備好
function watchPlayerList(){
    db.ref(`rooms/${roomId}/players`).on("value",snap=>{
        const players = snap.val()||{};
        const playerListDom = document.getElementById("playerList");
        playerListDom.innerHTML="";
        let allReady = true;
        Object.keys(players).forEach(name=>{
            const p = players[name];
            const readyTxt = p.ready ? "✅已準備" : "❌未準備";
            playerListDom.innerHTML += `<div class="playerItem">${name}｜${readyTxt}｜分數:${p.score||0}</div>`;
            if(!p.ready) allReady = false;
        })
        // 只有房主先見到開始遊戲掣，而且全部玩家ready先顯示
        const startBtn = document.getElementById("startGameBtn");
        if(isHost && allReady){
            startBtn.style.display="block";
        }else{
            startBtn.style.display="none";
        }
        document.getElementById("gameStatus").innerText = allReady ? "全部玩家已準備，房主可以開始遊戲" : "等待玩家全部準備...";
    })
}
// 心跳 + 建立房 / 入房
async function initRoom(isCreate){
    myName = prompt("輸入玩家名稱");
    if(!myName) return;
    if(isCreate){
        roomId = String(Math.floor(Math.random()*9000)+1000);
        isHost = true;
        log(`🏠 房主，建立房號 ${roomId}`);
        await db.ref(`rooms/${roomId}`).set({gameState:"waiting"});
    }else{
        roomId = prompt("輸入4位數房號");
        isHost = false;
        log(`🚪 進入房間 ${roomId}`);
    }
    document.getElementById("roomIdDisplay").innerText = roomId;
    // 註冊玩家
    await db.ref(`rooms/${roomId}/players/${myName}`).set({
        ready:false,
        hand:"",
        score:0,
        alive:true,
        lastPing:firebase.database.ServerValue.TIMESTAMP
    });
    log("📝 玩家資料寫入資料庫");
    watchPlayerList();
    // 心跳每2秒更新
    setInterval(()=>{
        db.ref(`rooms/${roomId}/players/${myName}/lastPing`).set(firebase.database.ServerValue.TIMESTAMP);
    },2000)
}
// 房主按開始遊戲
document.getElementById("startGameBtn").onclick=async ()=>{
    await db.ref(`rooms/${roomId}/gameState`).set("playing");
    log("🚀 房主啟動遊戲！");
}
document.getElementById("leaveBtn").onclick=async ()=>{
    await db.ref(`rooms/${roomId}/players/${myName}`).remove();
    log("🚪 離開房間");
    location.reload();
}
// 包剪揼出拳按鈕綁定
document.querySelectorAll(".handBtn").forEach(btn=>{
    btn.onclick=async ()=>{
        const hand = btn.dataset.hand;
        await db.ref(`rooms/${roomId}/players/${myName}/hand`).set(hand);
        log(`✊ 提交出拳：${hand}`);
    }
})
// 開啟房或者加入房
const create = confirm("是否建立新房間？按取消就加入房間");
initRoom(create);
</script>
</body>
</html>
