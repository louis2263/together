<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>包剪揼多人對戰 v1.92</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:600px;margin:20px auto;padding:16px;background:#f7f7f7}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #00000012}
button{padding:12px 24px;font-size:16px;border:none;border-radius:10px;background:#216fea;color:white;margin:4px}
input{width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:10px;margin:8px 0}
#debug{background:#111;color:#0f0;padding:12px;height:220px;overflow:auto;font-family:monospace;white-space:pre-wrap}
.hide{display:none}
</style>
</head>
<body>
<div class="card">
<h2>包剪揼多人對戰 v1.92</h2>
<div>版本號：v1.92</div>
</div>

<div class="card" id="page-name">
<h3>1. 輸入名字</h3>
<input id="nameInput" placeholder="輸入你的名字">
<br>
<button id="btnConfirmName">確認名字</button>
</div>

<div class="card hide" id="page-room">
<h3>房間頁面</h3>
<p>房間號碼：<span id="roomIdText"></span></p>
<button id="btnCreateRoom">開啟新房間</button>
<button id="btnJoinRoom">進入房間</button>
<input id="roomIdInput" placeholder="輸入房間號碼">
<h4>等候區：</h4>
<div id="roomUserList"></div>
</div>

<div class="card">
<h3>測試視窗（Debug）</h3>
<div id="debug"></div>
</div>

<script type="module">
const DEBUG = document.getElementById("debug");
function log(msg){
  const t = new Date().toLocaleTimeString();
  DEBUG.innerText += `[${t}] ${msg}\n`;
  DEBUG.scrollTop = DEBUG.scrollHeight;
}
log("頁面載入完成，開始匯入Firebase模組");

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue, once } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBUI5N2IZO_2erP6nNHuWB-Q6T7Mrjl_m0",
    authDomain: "game-ad81e.firebaseapp.com",
    databaseURL: "https://game-ad81e-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "game-ad81e",
    storageBucket: "game-ad81e.appspot.com",
    messagingSenderId: "947205132112",
    appId: "1:947205132112:web:xxxxxxxxxxxxxxxxx"
};

let app, db;
try{
  app = initializeApp(firebaseConfig);
  db = getDatabase(app);
  log("✅ Firebase 連接成功");
}catch(e){
  log("❌ Firebase 錯誤：" + e.message);
}

let myName = "";
let myRoomId = "";
const pageName = document.getElementById("page-name");
const pageRoom = document.getElementById("page-room");

document.getElementById("btnConfirmName").addEventListener("click", ()=>{
  log("👉 撳咗確認名字按鈕");
  myName = document.getElementById("nameInput").value.trim();
  if(!myName){
    log("⚠️ 請輸入名字");
    return;
  }
  log("名字設定：" + myName);
  pageName.classList.add("hide");
  pageRoom.classList.remove("hide");
});

document.getElementById("btnCreateRoom").addEventListener("click", async ()=>{
  if(!db){
    log("⚠️ Firebase 未連接");
    return;
  }
  log("👉 開啟新房間");
  const rid = Math.random().toString(36).slice(2,8);
  myRoomId = rid;
  document.getElementById("roomIdText").innerText = rid;
  log("建立房間ID："+rid);
  await set(ref(db, "rooms/"+rid), {
    owner: myName,
    players: {
      [myName]: {ready:false}
    }
  });
  listenRoom(rid);
});

document.getElementById("btnJoinRoom").addEventListener("click", async ()=>{
  if(!db){
    log("⚠️ Firebase 未連接");
    return;
  }
  const rid = document.getElementById("roomIdInput").value.trim();
  if(!rid){
    log("⚠️ 請輸入房間號碼");
    return;
  }
  myRoomId = rid;
  log("嘗試進入房間："+rid);
  const roomRef = ref(db, "rooms/"+rid);
  const snap = await once(roomRef);
  if(!snap.exists()){
    log("❌ 房間不存在");
    return;
  }
  await set(ref(db, "rooms/"+rid+"/players/"+myName), {ready:false});
  listenRoom(rid);
});

function listenRoom(rid){
  log("🔍 監聽房間："+rid);
  onValue(ref(db, "rooms/"+rid), snap=>{
    const data = snap.val();
    if(!data) return;
    log("📥 房間資料更新");
    const players = data.players || {};
    let html = "";
    for(const p in players){
      const readyText = players[p].ready ? "✅ 準備好" : "⏳ 未準備";
      html += `<div>${p} — ${readyText}</div>`;
    }
    document.getElementById("roomUserList").innerHTML = html;
  });
}
</script>
</body>
</html>
