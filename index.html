<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>方包包包剪揼 V61 BG2乾淨版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK",sans-serif}
body{background:#FFE66D}
.wrap1{position:relative;width:100%;max-width:480px;margin:0 auto;min-height:100vh;background:url('background01.jpg') no-repeat top center;background-size:100% auto;background-color:#FFE66D}
.wrap2{position:relative;width:100%;max-width:480px;margin:0 auto;min-height:100vh;background:url('background02.jpg') no-repeat top center;background-size:cover;background-color:#FFE66D;padding:14px 14px 100px}
.card-black{background:#111;border-radius:22px;padding:14px;border:3px solid #111;margin-bottom:12px}
.pill-yellow{background:#FFE66D;color:#111;border-radius:999px;padding:2px 10px;font-weight:900;font-size:11px;display:inline-block}
.room-big{font-size:44px;font-weight:1000;color:#fff;-webkit-text-stroke:3.5px #111;text-shadow:4px 4px 0 #111;letter-spacing:1px;margin:6px 0 12px;text-align:center}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mode-btn{background:#fff;border:3px solid #111;border-radius:16px;padding:14px 8px;text-align:center;font-weight:1000;font-size:13px;line-height:1.3;cursor:pointer}
.mode-btn.selected{background:#FFD93D;outline:3px solid #111}
.btn-red{background:#FF1A1A;color:#fff;border:3px solid #111;border-radius:999px;padding:12px;text-align:center;font-weight:1000;font-size:15px;cursor:pointer}
.btn-yellow{background:#FFD93D;color:#111;border:3px solid #111;border-radius:16px;padding:14px;text-align:center;font-weight:1000;font-size:17px;cursor:pointer;margin-top:8px}
.btn-grey{background:#C4C4C4;color:#333;border:3px solid #111;border-radius:16px;padding:10px;text-align:center;font-weight:900;margin-top:8px}
.input-card{position:absolute;left:16px;right:16px;bottom:20px;background:#111;border-radius:28px;padding:20px}
.yellow{color:#FFE66D;font-weight:900;font-size:13px}
.input-box{width:100%;background:#2A2A2A;border:2px solid #3A3A3A;border-radius:14px;padding:14px;color:#fff;margin-top:6px}
#debugToggle{position:fixed;top:10px;right:10px;z-index:99999;background:#111;color:#0f0;border:2px solid #0f0;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#debugPanel{position:fixed;bottom:0;left:0;right:0;max-height:60vh;background:rgba(20,20,20,.96);color:#0f0;border-top:3px solid #0f0;border-radius:18px 18px 0 0;padding:10px;z-index:99998;overflow:auto;display:none;font-family:monospace;font-size:12px}
#debugPanel.open{display:block}
</style>
</head>
<body>
<div id="debugToggle" onclick="document.getElementById('debugPanel').classList.toggle('open')">🐛</div>
<div id="debugPanel"><div style="display:flex;justify-content:space-between"><b>🐛 DEBUG V61 - BG2乾淨版</b><button onclick="this.parentElement.parentElement.classList.remove('open')" style="background:#FFE66D;border:none;padding:4px 10px;border-radius:8px">X</button></div><div id="dbgLog"></div></div>

<!-- S1: 第一版用 background01.jpg -->
<div id="s1" style="display:block"><div class="wrap1"><div class="input-card"><div class="yellow">與朋友一起對決！準備好了嗎？</div><div class="yellow" style="margin-top:10px">輸入你個名</div><input id="nameInput" class="input-box" placeholder="Louis"><div style="display:flex;gap:10px;margin-top:12px"><div class="mode-btn" style="flex:1;background:#FFD93D" onclick="createRoom()">開始房間</div><div class="mode-btn" style="flex:1;background:#34C759" onclick="joinRoom()">進入房間</div></div><div class="yellow" style="margin-top:12px"># 房號</div><input id="roomInput" class="input-box" placeholder="4位房號 例如 4829" maxlength="4"></div></div></div>

<!-- S2: 第二版用你新background02.jpg乾淨黃底 -->
<div id="s2" style="display:none"><div class="wrap2">
  <!-- 視窗1: 玩家進入房間 -->
  <div class="card-black" style="display:flex;justify-content:space-between;align-items:center">
    <div><span style="background:#FFD93D;color:#111;border-radius:6px;padding:2px 7px;font-weight:900">2</span> <span style="color:#FFE66D;font-weight:900;font-size:12px">players ready:</span></div>
    <div style="color:#fff;font-size:11px"><span id="pA">Louis</span>✅準備好 <span id="pB" style="margin-left:6px">玩家B✅已進房</span></div>
  </div>

  <!-- 房號 -->
  <div class="room-big" id="roomNum">房號 7173</div>

  <!-- 視窗2: 四個遊戲模式選擇 -->
  <div class="card-black">
    <div style="color:#FFE66D;font-weight:900">③ 遊戲玩法 / Game Mode</div>
    <div class="mode-grid">
      <div class="mode-btn selected" onclick="setMode(this)">一鋪定勝負<br><span style="font-size:10px">(Selected)</span></div>
      <div class="mode-btn" onclick="setMode(this)">贏兩鋪<br><span style="font-size:10px">(Best of 3)</span></div>
      <div class="mode-btn" onclick="setMode(this)">贏三鋪<br><span style="font-size:10px">(Best of 5)</span></div>
      <div class="mode-btn" onclick="setMode(this)">連贏兩鋪<br><span style="font-size:10px">(Win 2 in a row)</span></div>
    </div>
  </div>

  <!-- 視窗3: 錄音① -->
  <div class="card-black">
    <div style="color:#FFE66D;font-weight:900">① 包剪揼 / Rock Paper Scissors Shoot</div>
    <div style="display:flex;justify-content:space-between;color:#fff;font-size:11px;margin:8px 0"><span>請講：包剪揼！</span><span id="st1" class="pill-yellow">狀態：未錄</span></div>
    <div class="btn-red" onclick="toggleRec(1)">🔴 錄音① 2.5秒</div>
    <audio id="aud1" controls style="display:none;width:100%;margin-top:8px"></audio>
  </div>

  <!-- 視窗4: 錄音② -->
  <div class="card-black">
    <div style="color:#FFE66D;font-weight:900">② 贏咗你會講咩 - 勝利宣言</div>
    <div style="display:flex;justify-content:space-between;color:#fff;font-size:11px;margin:8px 0"><span>錄低你的勝利宣言！</span><span id="st2" style="background:#FF3B30;color:#fff;border-radius:999px;padding:2px 8px;font-size:10px;cursor:pointer" onclick="toggleRec(2)">錄音② 3秒</span></div>
    <audio id="aud2" controls style="display:none;width:100%;margin-top:6px"></audio>
  </div>

  <div class="btn-yellow" onclick="startGame()">⑦ 開始遊戲</div>
  <div class="btn-grey" id="waitBtn">等所有人上傳2段音</div>
</div></div>

<script>
let logEl=document.getElementById('dbgLog');
function dlog(m){let t=new Date().toLocaleTimeString('zh-HK');logEl.innerHTML=`[${t}] ${m}<br>`+logEl.innerHTML;console.log(m)}
function createRoom(){let n=document.getElementById('nameInput').value||'Louis';let r=Math.floor(1000+Math.random()*9000);document.getElementById('roomNum').textContent='房號 '+r;dlog(`開房 房號=${r} 名=${n}`);dlog(`回合狀態:waitingChoose,c1:undefined,c2:undefined`);dlog(`✅可以揀包/剪/揼`);document.getElementById('s1').style.display='none';document.getElementById('s2').style.display='block';document.getElementById('pA').textContent=n+'✅準備好'}
function joinRoom(){let n=document.getElementById('nameInput').value||'Louis';let r=document.getElementById('roomInput').value||'4829';document.getElementById('roomNum').textContent='房號 '+r;dlog(`入房 房號=${r} 名=${n}`);dlog(`回合狀態:waitingChoose,c1:undefined,c2:undefined`);dlog(`✅可以揀包/剪/揼`);document.getElementById('s1').style.display='none';document.getElementById('s2').style.display='block';document.getElementById('pA').textContent=n}
function setMode(el){document.querySelectorAll('.mode-grid .mode-btn').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');dlog(`玩法->${el.innerText.split('\n')[0]}`)}
let mr,chunks=[];
function toggleRec(t){dlog(`錄音${t}開始 ${t==1?'2.5秒':'3秒'}`);navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{chunks=[];mr=new MediaRecorder(s);mr.ondataavailable=e=>chunks.push(e.data);mr.onstop=()=>{let url=URL.createObjectURL(new Blob(chunks));document.getElementById('aud'+t).src=url;document.getElementById('aud'+t).style.display='block';document.getElementById('st'+t).textContent='已錄 ✅';document.getElementById('st'+t).style.background='#34C759';dlog(`錄音${t}完成`);if(document.getElementById('st1').textContent.includes('已錄')&&document.getElementById('st2').textContent.includes('已錄')){document.getElementById('waitBtn').textContent='✅已準備好 可以開始';document.getElementById('waitBtn').style.background='#FFE66D'}s.getTracks().forEach(tr=>tr.stop())};mr.start();setTimeout(()=>mr.state=='recording'&&mr.stop(),t==1?2500:3000)}).catch(e=>{dlog(`錄音失敗 ${e}`);alert('要開麥克風權限')})}
function startGame(){dlog(`✅雙方已經出拳，進入賽果判斷`);dlog(`回合狀態:judge,c1:paper,c2:scissors`);dlog(`✅開始計賽果 + 大合唱`);dlog(`賽果:p2`);alert('開始遊戲 - 跳去出拳版面')}
dlog('V61 BG2乾淨版 ready');dlog('回合狀態:waitingChoose,c1:undefined,c2:undefined');dlog('✅可以揀包/剪/揼');
</script>
</body>
</html>
