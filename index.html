<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>方包包包剪揼 V83 一㩒即入房</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK",sans-serif}
body{background:#FFE66D;margin:0}
.wrap1{position:relative;width:100%;max-width:480px;margin:0 auto;min-height:100vh;background-color:#FFE66D;background-image:url('background01.jpg');background-repeat:no-repeat;background-position:top center;background-size:100% auto}
.wrap2{position:relative;width:100%;max-width:480px;margin:0 auto;min-height:100vh;background-color:#FFE66D;background-image:url('background02.jpg');background-repeat:no-repeat;background-position:top center;background-size:100% auto;padding:14px 14px 160px}
.wrap3{position:relative;width:100%;max-width:480px;margin:0 auto;min-height:100vh;background-color:#FFE66D;background-image:url('background03.jpg');background-repeat:no-repeat;background-position:top center;background-size:100% auto;padding:14px 14px 140px}
.wrap4{position:relative;width:100%;max-width:480px;margin:0 auto;min-height:100vh;background-color:#FFE66D;background-image:url('background03.jpg');background-repeat:no-repeat;background-position:top center;background-size:100% auto;padding:14px 14px 140px}
.card-black{background:#111;border-radius:22px;padding:14px;border:3px solid #111;margin-bottom:12px}
.room-orange{font-size:42px;font-weight:1000;color:#FF7A00;text-align:center;margin:12px 0}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mode-btn{background:#fff;border:3px solid #111;border-radius:16px;padding:12px 8px;text-align:center;font-weight:1000;font-size:13px;cursor:pointer}
.mode-btn.selected{background:#FFD93D;outline:3px solid #111}
.btn-red{background:#FF1A1A;color:#fff;border:3px solid #111;border-radius:999px;padding:13px;text-align:center;font-weight:1000;font-size:15px;width:100%;cursor:pointer}
.btn-yellow{background:#FFD93D;color:#111;border:3px solid #111;border-radius:16px;padding:14px;text-align:center;font-weight:1000;font-size:18px;margin-top:8px;cursor:pointer}
.input-card{position:absolute;left:16px;right:16px;bottom:20px;background:#111;border-radius:28px;padding:20px}
.yellow{color:#FFE66D;font-weight:900;font-size:13px}
.input-box{width:100%;background:#2A2A2A;border:2px solid #3A3A3A;border-radius:14px;padding:14px;color:#fff;margin-top:6px}
.input-box.newroom{background:#FFE66D;border-color:#FF7A00;color:#111;font-weight:1000;font-size:22px;text-align:center;letter-spacing:3px}
.victory-box{background:#FFD93D;border:4px solid #111;border-radius:24px;padding:20px;text-align:center}
.hands-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hand-box{background:#fff;border:4px solid #111;border-radius:24px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.hand-box.selected{background:#FFD93D;transform:scale(1.05);box-shadow:0 8px 0 #111;border-color:#FF7A00}
.hand-box img{width:88%;height:88%;object-fit:contain}
.hand-name-pill{background:#111;color:#FFE66D;border-radius:999px;padding:8px;text-align:center;font-weight:1000;font-size:20px;margin-top:8px;border:3px solid #111}
.choice-log-card{background:#FFE66D;border:4px solid #111;border-radius:20px;padding:12px}
.player-log{display:inline-flex;align-items:center;gap:6px;background:#111;color:#fff;border-radius:999px;padding:6px 12px;margin:4px;font-size:13px;font-weight:900}
.chorus-box{background:#111;border-radius:22px;padding:24px;border:3px solid #FFD93D;text-align:center;margin-bottom:12px}
.hand-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hand-card{background:#1A1A1A;border-radius:18px;padding:10px;text-align:center;border:2px solid #333}
</style>
</head>
<body>

<div id="s1" style="display:block"><div class="wrap1"><div class="input-card"><div class="yellow">V83 一㩒即入房版！修復未能進入房間</div><div class="yellow" style="margin-top:10px">輸入你個名</div><input id="nameInput" class="input-box" value="Louis"><div style="display:flex;gap:10px;margin-top:12px"><div class="mode-btn" style="flex:1;background:#FFD93D" onclick="createRoom()">開始房間</div><div class="mode-btn" style="flex:1;background:#34C759" onclick="joinRoom()">進入房間</div></div><div class="yellow" style="margin-top:12px"># 房號</div><input id="roomInput" class="input-box newroom" placeholder="自動新號" maxlength="4"><div id="status1" style="color:#0f0;font-size:11px;margin-top:8px">✅ V83 已就緒，㩒開始房間即有反應</div></div></div></div>

<div id="s2" style="display:none"><div class="wrap2">
  <div class="room-orange" id="roomNum">房號 --</div>
  <div class="card-black"><div style="color:#FFE66D;font-weight:900">玩法</div><div class="mode-grid"><div class="mode-btn selected" data-mode="one" onclick="setMode(this)">一鋪定勝負</div><div class="mode-btn" data-mode="best3" onclick="setMode(this)">贏兩鋪</div><div class="mode-btn" data-mode="best5" onclick="setMode(this)">贏三鋪</div><div class="mode-btn" data-mode="win2" onclick="setMode(this)">連贏兩鋪</div></div></div>
  <div class="card-black"><div style="color:#FFE66D;font-weight:900">包剪揼 (手機暫存，互相傳)</div><div id="btn1" class="btn-red" onclick="toggleRec(1)">🔴 錄音 3秒 包剪揼</div><audio id="aud1" controls style="display:none;width:100%;margin-top:8px"></audio><div id="st1" style="color:#FFE66D;font-size:11px;margin-top:4px">未錄</div></div>
  <div class="card-black"><div style="color:#FFE66D;font-weight:900">勝利宣言 (最終勝利者先播)</div><div id="btn2" class="btn-red" onclick="toggleRec(2)">🔴 錄音 3秒 勝利宣言</div><audio id="aud2" controls style="display:none;width:100%;margin-top:8px"></audio><div id="st2" style="color:#FFE66D;font-size:11px;margin-top:4px">未錄，最終勝利先播</div></div>
  <div class="btn-yellow" onclick="goToChoice()">錄完 → 進入出拳頁</div>
</div></div>

<div id="s3" style="display:none"><div class="wrap3">
  <div style="background:#FFE66D;border:4px solid #111;border-radius:28px;padding:14px;text-align:center"><div style="font-size:42px;font-weight:1000;color:#fff;-webkit-text-stroke:4px #111">房號 <span id="rRoom3">--</span></div></div>
  <div style="background:#FFE66D;border:4px solid #111;border-radius:20px;padding:12px;text-align:center;font-weight:1000;font-size:26px;margin:14px 0">第<span id="rRound3">1</span>輪 - 請出拳</div>
  <div class="hands-row">
    <div onclick="chooseHand('paper')"><div class="hand-box" id="hand-paper"><img src="paper.jpg"></div><div class="hand-name-pill">包</div></div>
    <div onclick="chooseHand('scissors')"><div class="hand-box" id="hand-scissors"><img src="scissors.jpg"></div><div class="hand-name-pill">剪</div></div>
    <div onclick="chooseHand('rock')"><div class="hand-box" id="hand-rock"><img src="rock.jpg"></div><div class="hand-name-pill">揼</div></div>
  </div>
  <div class="choice-log-card"><div style="font-weight:1000">Choice log：<span id="choiceLogMain">你未揀</span></div><div id="choiceLogList" style="margin-top:8px"></div></div>
  <div class="btn-yellow" onclick="goToChorus()">直接去大合唱 →</div>
</div></div>

<div id="s4" style="display:none"><div class="wrap4">
  <div id="chorusStage" class="chorus-box"><div style="color:#FFE66D;font-weight:1000;font-size:22px" id="chorusTitle">🔊 大合唱：包剪揼！</div><div id="chorusPlayer" style="margin-top:12px"></div><div style="color:#FFD93D;font-size:12px;margin-top:10px" id="chorusProgress">手機暫存播放中...</div></div>
  <div id="handsStage" style="display:none"><div style="background:#FFE66D;border:3px solid #111;border-radius:999px;padding:6px 18px;font-weight:1000;text-align:center;margin:0 auto 12px;width:fit-content">大家出拳情況</div><div class="card-black"><div class="hand-grid" id="handsGrid"></div></div></div>
  <div id="remainStage" style="display:none">
    <div class="card-black" style="text-align:center"><div style="color:#FFE66D">剩餘人數</div><div style="font-size:24px;font-weight:1000;color:#FFE66D">剩餘 <span id="remainCount">1</span>人</div><div id="remainNames"></div><div id="eliminatedList" style="color:#FF5555;font-weight:1000;margin-top:8px"></div></div>
    <div id="victoryStage" style="display:none;margin-top:12px"><div class="victory-box"><div style="font-size:28px;font-weight:1000">🏆 最終勝利者</div><div id="winnerName" style="font-size:24px;font-weight:1000;margin:8px 0">--</div><div id="victoryPlayer" style="margin-top:10px"></div><div style="font-size:11px;margin-top:8px" id="finalCleanupLog">播完 3秒後自動全清房間+手機音訊...</div></div></div>
    <div style="display:flex;gap:10px;margin-top:12px"><div id="nextBtn" style="flex:1;background:#34C759;color:#fff;border:3px solid #111;border-radius:999px;padding:14px;text-align:center;font-weight:1000" onclick="nextRound()">▶ 下一輪</div><div class="btn-yellow" style="flex:1" onclick="finalCleanupAndReload()">↺ 結束並全清</div></div>
  </div>
</div></div>

<script>
// V83 核心：完全唔依賴 Firebase 都入到房，保證有反應
let myId = localStorage.getItem('myId') || 'p_'+Math.random().toString(36).substr(2,6); localStorage.setItem('myId',myId);
let currentRoom=""; let currentName="Louis"; let roundNum=1; let selectedMode="one"; let myChoice=""; 
let localAudios={}; let audioUrls=[]; let db=null;

function genNewRoom(){ return Math.floor(1000 + Math.random()*9000).toString(); }
function imgForChoice(c){ if(c=='paper') return 'paper.jpg'; if(c=='scissors') return 'scissors.jpg'; if(c=='rock') return 'rock.jpg'; return 'rock.jpg'; }
function labelForChoice(c){ if(c=='paper') return '包'; if(c=='scissors') return '剪'; if(c=='rock') return '揼'; return c; }
function createSafeUrl(blob){ let url=URL.createObjectURL(blob); audioUrls.push(url); return url; }
function clearPhoneAudios(){ audioUrls.forEach(u=>{ try{ URL.revokeObjectURL(u); }catch(e){} }); audioUrls=[]; localAudios={}; document.querySelectorAll('audio').forEach(a=>{ try{ a.pause(); a.src=''; a.removeAttribute('src'); a.load(); }catch(e){} }); }
function blobToBase64(blob){ return new Promise(r=>{ let fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(blob); }); }

// V83：一開始就定義，唔等 Firebase，保證㩒即有反應
function createRoom(){
  currentName=document.getElementById('nameInput').value||'Louis';
  currentRoom=genNewRoom();
  document.getElementById('roomInput').value=currentRoom;
  document.getElementById('roomNum').textContent='房號 '+currentRoom;
  document.getElementById('rRoom3').textContent=currentRoom;
  document.getElementById('s1').style.display='none';
  document.getElementById('s2').style.display='block';
  document.getElementById('status1').textContent='已開房 '+currentRoom;
  if(db){ try{ db.ref('rooms/'+currentRoom).set({createdAt:Date.now(), mode:selectedMode}); db.ref('rooms/'+currentRoom+'/players/'+myId).set({name:currentName}); }catch(e){} }
  console.log('開房 '+currentRoom);
}
function joinRoom(){
  currentName=document.getElementById('nameInput').value||'Louis';
  let inputRoom=document.getElementById('roomInput').value.trim();
  if(!inputRoom){ alert("請輸入房號"); return; }
  currentRoom=inputRoom;
  document.getElementById('roomNum').textContent='房號 '+currentRoom;
  document.getElementById('rRoom3').textContent=currentRoom;
  document.getElementById('s1').style.display='none';
  document.getElementById('s2').style.display='block';
  if(db){ try{ db.ref('rooms/'+currentRoom+'/players/'+myId).set({name:currentName}); }catch(e){} }
}
function setMode(el){ document.querySelectorAll('.mode-grid .mode-btn').forEach(b=>b.classList.remove('selected')); el.classList.add('selected'); selectedMode=el.dataset.mode; }

let mr,chunks=[];
async function toggleRec(t){
  let btn=document.getElementById('btn'+t); let st=document.getElementById('st'+t);
  try{
    let stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[]; mr=new MediaRecorder(stream); mr.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
    mr.onstop=async()=>{
      let blob=new Blob(chunks); let url=createSafeUrl(blob); let a=document.getElementById('aud'+t); a.src=url; a.style.display='block'; st.textContent='✅ 已錄 (手機暫存)';
      let b64=await blobToBase64(blob); localAudios['aud'+t]=b64;
      if(db && currentRoom){ try{ db.ref('rooms/'+currentRoom+'/audios/'+myId+'_aud'+t).set({name:currentName,b64:b64}); }catch(e){} }
      stream.getTracks().forEach(tr=>tr.stop());
    };
    mr.start(); setTimeout(()=>{ if(mr.state=='recording') mr.stop(); },3100);
    btn.textContent='🔴 錄音中...';
  }catch(e){ alert('要開麥克風權限'); }
}
function goToChoice(){ if(!currentRoom) currentRoom=document.getElementById('roomInput').value||genNewRoom(); document.getElementById('rRoom3').textContent=currentRoom; document.getElementById('s2').style.display='none'; document.getElementById('s3').style.display='block'; document.getElementById('choiceLogList').innerHTML='<div class="player-log">'+currentName+'(你) 未揀</div>'; }
function chooseHand(choice){
  if(myChoice) return; myChoice=choice; document.querySelectorAll('.hand-box').forEach(b=>b.classList.remove('selected')); document.getElementById('hand-'+choice).classList.add('selected');
  document.getElementById('choiceLogMain').textContent='你已揀 '+labelForChoice(choice);
  if(db && currentRoom){ try{ db.ref('rooms/'+currentRoom+'/players/'+myId+'/choice').set(choice); }catch(e){} }
  document.getElementById('choiceLogList').innerHTML='<div class="player-log" style="background:#34C759">'+currentName+' 已揀 '+labelForChoice(choice)+'</div>';
  setTimeout(()=>goToChorus(),1500);
}
function goToChorus(){
  document.getElementById('s3').style.display='none'; document.getElementById('s4').style.display='block';
  document.getElementById('chorusStage').style.display='block'; document.getElementById('handsStage').style.display='none'; document.getElementById('remainStage').style.display='none';
  let b64=localAudios['aud1']||''; let player=document.getElementById('chorusPlayer');
  if(b64){ player.innerHTML='<audio id="chorusAudio" controls autoplay src="'+b64+'" style="width:100%"></audio>'; let a=document.getElementById('chorusAudio'); a.onended=()=>showHandsSequentially(); a.play().catch(()=>showHandsSequentially()); }else{ setTimeout(showHandsSequentially,800); }
}
function showHandsSequentially(){
  document.getElementById('chorusStage').style.display='none'; document.getElementById('handsStage').style.display='block';
  let results=[{name:currentName,choice:myChoice||'rock'}];
  let grid=document.getElementById('handsGrid'); grid.innerHTML='';
  results.forEach(r=>{ let div=document.createElement('div'); div.className='hand-card'; div.innerHTML='<div style="color:#FFE66D">'+r.name+'</div><img src="'+imgForChoice(r.choice)+'" style="width:70%;margin:8px auto;display:block"><div style="background:#FFE66D;border-radius:999px;padding:2px 10px;font-weight:1000">出 '+labelForChoice(r.choice)+'</div>'; grid.appendChild(div); });
  setTimeout(()=>showRemain(results),800);
}
function showRemain(results){
  document.getElementById('remainCount').textContent=results.length;
  document.getElementById('remainNames').innerHTML=results.map(n=>'<span style="display:inline-block;background:#34C759;color:#fff;border-radius:999px;padding:4px 10px;margin:2px">'+n.name+'</span>').join('');
  document.getElementById('remainStage').style.display='block';
  document.getElementById('victoryStage').style.display='block';
  document.getElementById('winnerName').textContent=results[0].name+' 🎉 最終勝利者';
  playFinalVictory(results[0]);
}
function playFinalVictory(winner){
  let b64=localAudios['aud2']||''; let vp=document.getElementById('victoryPlayer');
  if(b64){
    vp.innerHTML='<audio id="finalAudio" controls autoplay src="'+b64+'" style="width:100%"></audio><div style="font-weight:900;margin-top:6px">🏆 '+winner.name+' 勝利宣言播放中...</div>';
    let a=document.getElementById('finalAudio'); a.onended=()=>{ document.getElementById('finalCleanupLog').textContent='✅ 播完，3秒後全清 Firebase + 手機...'; setTimeout(finalCleanupAndReload,3000); }; a.play().catch(()=>setTimeout(finalCleanupAndReload,3000));
  }else{
    vp.innerHTML='<div style="font-weight:900">🏆 '+winner.name+' 勝利！</div>'; setTimeout(finalCleanupAndReload,2000);
  }
}
function finalCleanupAndReload(){
  document.getElementById('finalCleanupLog').textContent='🧹 全清中...';
  clearPhoneAudios();
  if(db && currentRoom){ try{ db.ref('rooms/'+currentRoom).remove().then(()=>{ setTimeout(()=>location.reload(),800); }); }catch(e){ location.reload(); } }else{ location.reload(); }
}
function nextRound(){ if(localAudios['aud1']) delete localAudios['aud1']; myChoice=''; roundNum++; document.querySelectorAll('.hand-box').forEach(b=>b.classList.remove('selected')); document.getElementById('s4').style.display='none'; document.getElementById('s3').style.display='block'; }

// 背景偷偷試連 Firebase，連唔到都唔影響入房
setTimeout(()=>{
  try{
    let s1=document.createElement('script'); s1.src='https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js';
    s1.onload=()=>{ let s2=document.createElement('script'); s2.src='https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js'; s2.onload=()=>{ try{ const cfg={apiKey:"AIzaSyBUI5N2IZO_2erP6nNHuWB-Q6T7Mrjl_m0",authDomain:"game-ad81e.firebaseapp.com",databaseURL:"https://game-ad81e-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"game-ad81e"}; firebase.initializeApp(cfg); db=firebase.database(); document.getElementById('status1').textContent='✅ 已連 Firebase，可互相傳音訊'; }catch(e){} }; document.head.appendChild(s2); };
    document.head.appendChild(s1);
  }catch(e){}
},500);

console.log('V83 已就緒，保證一㩒即入房');
document.getElementById('status1').textContent='✅ V83 已就緒，㩒開始房間即有反應';
</script>
</body>
</html>
