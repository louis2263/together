<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>包剪揼多人同步遊戲</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{overflow:hidden}
.page{display:none;width:100vw;height:100vh;background-size:cover;background-position:center;padding:16px;padding-bottom:140px}
.page.active{display:block}
#page1{background-image:url('background01.jpg')}
#page2{background-image:url('background02.jpg')}
#page3{background-image:url('background03.jpg')}
#page4{background-image:url('background04.jpg')}
#page5{background-image:url('background05.jpg')}
h2{text-align:center;margin:20px 0;color:#fff;text-shadow:2px 2px 4px #000}
.room-title{
    text-align:center;
    font-size:24px;
    color:#fff;
    text-shadow:2px 2px 4px #000;
    margin:12px 0;
    font-weight:bold;
}
input{width:90%;padding:12px;font-size:18px;margin:8px auto;display:block;border-radius:8px;border:1px solid #aaa}
button{padding:14px 18px;font-size:17px;border-radius:10px;border:none;margin:6px;cursor:pointer;background:#fff;color:#222}
.btn-row{display:flex;flex-wrap:wrap;justify-content:center}
#debug{position:fixed;bottom:0;left:0;width:100%;height:120px;background:rgba(0,0,0,0.85);color:#3f3;font-size:12px;overflow-y:auto;padding:8px;z-index:9999}
.player-item{padding:8px;background:rgba(255,255,255,0.7);margin:4px;border-radius:6px}
.eliminated{opacity:0.4;text-decoration:line-through}
</style>
</head>
<body>
<!-- 頁1：輸入名字 + 房間號 -->
<div id="page1" class="page active">
<input id="nameInput" placeholder="輸入玩家名稱">
<input id="roomInput" placeholder="4位數房間號碼">
<div class="btn-row">
<button onclick="genRoom()">開啟房間</button>
<button onclick="joinRoom()">進入房間</button>
</div>
</div>

<!-- 頁2：錄音 + 規則選擇 + 玩家列表 -->
<div id="page2" class="page">
<div class="room-title">房間號碼：<span id="showRoomId"></span></div>
<h2>錄製音訊 & 設定遊戲</h2>
<div class="player-item">玩家ID：<span id="myUid"></span></div>
<div style="margin:12px 0;text-align:center">
<h3>第一段：包剪揼（大合唱用）</h3>
<div class="btn-row">
<button onclick="startRec1()">開始錄第一段</button>
<button onclick="stopRec1()">停止錄第一段</button>
</div>
<h3 style="margin-top:12px">第二段：勝利宣言</h3>
<div class="btn-row">
<button onclick="startRec2()">開始錄第二段</button>
<button onclick="stopRec2()">停止錄第二段</button>
</div>
</div>
<h3>房主選擇遊戲規則</h3>
<div class="btn-row">
<button onclick="setRule('one')">一鋪定勝負</button>
<button onclick="setRule('win2')">贏兩鋪</button>
<button onclick="setRule('win3')">贏三鋪</button>
<button onclick="setRule('con2')">連贏兩鋪</button>
</div>
<h3>在線玩家狀態</h3>
<div id="playerList"></div>
</div>

<!-- 頁3：出拳頁面 -->
<div id="page3" class="page">
<h2>請選擇包 / 剪 / 揼</h2>
<div class="btn-row">
<button onclick="play('rock')"><img src="rock.png" style="width:80px"></button>
<button onclick="play('scissors')"><img src="scissors.png" style="width:80px"></button>
<button onclick="play('paper')"><img src="paper.png" style="width:80px"></button>
</div>
</div>

<!-- 頁4：結果 + 5秒倒數 -->
<div id="page4" class="page">
<h2>出拳狀況</h2>
<div id="resultView"></div>
<h2>勝利排行</h2>
<div id="rankView"></div>
<div style="font-size:60px;text-align:center;color:#ff0000;margin:20px" id="countdown">5</div>
</div>

<!-- 頁5：最終勝利畫面 -->
<div id="page5" class="page">
<h2>遊戲完結！</h2>
<h2 id="winnerText"></h2>
</div>

<!-- Debug視窗 -->
<div id="debug"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>
<script>
// ========== Firebase 設定，換返你自己嘅 config ==========
const firebaseConfig = {
  apiKey: "你的apiKey",
  authDomain: "你的authDomain",
  databaseURL: "你的databaseURL",
  projectId: "你的projectId",
  storageBucket: "你的storageBucket",
  messagingSenderId: "你的senderId",
  appId: "你的appId"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let roomId = "";
let myName = "";
let myUid = "user_" + Math.random().toString(36).slice(2,10);
let mediaRecorder1,mediaRecorder2;
let audio1Blob,audio2Blob;
let players = {};
let gameState = "wait";
let ruleType = "one";
let countdownTimer = null;
let heartbeatTimer = null;

// Debug 函數
function log(msg){
  const d = new Date();
  const line = `[${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${d.getMinutes()}:${d.getSeconds()}] ${msg}\n`;
  document.getElementById("debug").innerText += line;
  document.getElementById("debug").scrollTop = document.getElementById("debug").scrollHeight;
}

// 切頁
function switchPage(n){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("page"+n).classList.add("active");
}

// 房主：開啟房間（隨機4位房號，自動入房跳去第二頁）
function genRoom(){
  myName = document.getElementById("nameInput").value.trim();
  if(!myName){alert("請輸入玩家名稱");return}
  const r = String(Math.floor(Math.random()*9000)+1000);
  document.getElementById("roomInput").value = r;
  roomId = r;
  log("房主開啟房間："+roomId);
  // 第二頁頂部顯示房號
  document.getElementById("showRoomId").innerText = roomId;
  document.getElementById("myUid").innerText = myUid;
  switchPage(2);
  initRoomListen();
  startHeartbeat();
}

// 房客：進入房間
function joinRoom(){
  roomId = document.getElementById("roomInput").value.trim();
  myName = document.getElementById("nameInput").value.trim();
  if(!roomId || !myName){alert("請輸入名稱同4位房間號");return}
  if(!/^[0-9]{4}$/.test(roomId)){alert("房號必須4個數字");return}
  log("房客進入房間："+roomId+"｜玩家："+myName+"｜UID："+myUid);
  // 第二頁頂部顯示房號
  document.getElementById("showRoomId").innerText = roomId;
  document.getElementById("myUid").innerText = myUid;
  switchPage(2);
  initRoomListen();
  startHeartbeat();
}

// 心跳
function startHeartbeat(){
  heartbeatTimer = setInterval(()=>{
    if(!roomId) return;
    db.ref("rooms/"+roomId+"/players/"+myUid).update({
      name:myName,uid:myUid,online:true,lastSeen:Date.now(),
      rec1Ready:!!audio1Blob,rec2Ready:!!audio2Blob,
      choice:null,win:0,consec:0,eliminated:false
    })
  },1500)
}

// 監聽房間
function initRoomListen(){
  const roomRef = db.ref("rooms/"+roomId);
  roomRef.on("value",snap=>{
    const data = snap.val() || {};
    players = data.players || {};
    gameState = data.gameState ?? "wait";
    ruleType = data.ruleType ?? "one";
    log("收到房狀態 gameState = "+gameState);
    renderPlayerList();
    routeGameState();
  })
}

// 渲染玩家列表
function renderPlayerList(){
  const wrap = document.getElementById("playerList");
  wrap.innerHTML = "";
  Object.values(players).forEach(p=>{
    const div = document.createElement("div");
    div.className = "player-item"+(p.eliminated?" eliminated":"");
    div.innerText = `${p.name}｜${p.rec1Ready?"✅包剪揼錄好":"❌未錄音"}｜${p.rec2Ready?"✅宣言錄好":"❌未錄宣言"}｜勝：${p.win}`;
    wrap.appendChild(div);
  })
}

// 房主設定規則
function setRule(r){
  db.ref("rooms/"+roomId).update({ruleType:r,gameState:"wait"})
  log("房主設定規則："+r)
}

// 錄音第一段
async function startRec1(){
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  mediaRecorder1 = new MediaRecorder(stream);
  const chunks = [];
  mediaRecorder1.ondataavailable = e=>chunks.push(e.data);
  mediaRecorder1.onstop = ()=>{
    audio1Blob = new Blob(chunks,{type:"audio/webm"});
    log("第一段錄音完成");
    db.ref("rooms/"+roomId+"/players/"+myUid+"/rec1Ready").set(true);
  }
  mediaRecorder1.start();
  log("開始錄第一段");
}
function stopRec1(){mediaRecorder1?.stop();log("停止第一段錄音")}

// 錄音第二段
async function startRec2(){
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  mediaRecorder2 = new MediaRecorder(stream);
  const chunks = [];
  mediaRecorder2.ondataavailable = e=>chunks.push(e.data);
  mediaRecorder2.onstop = ()=>{
    audio2Blob = new Blob(chunks,{type:"audio/webm"});
    log("第二段錄音完成");
    db.ref("rooms/"+roomId+"/players/"+myUid+"/rec2Ready").set(true);
  }
  mediaRecorder2.start();
  log("開始錄第二段");
}
function stopRec2(){mediaRecorder2?.stop();log("停止第二段錄音")}

// 出拳
function play(sel){
  db.ref("rooms/"+roomId+"/players/"+myUid+"/choice").set(sel);
  log("我出："+sel);
}

// 遊戲狀態分流
function routeGameState(){
  if(gameState==="wait") switchPage(2);
  if(gameState==="play") switchPage(3);
  if(gameState==="result") runResult();
  if(gameState==="end") runEnd();
}

// 計算勝負
function calcResult(){
  const arr = Object.values(players).filter(x=>!x.eliminated && x.choice);
  const rock = arr.filter(x=>x.choice==="rock").length;
  const scis = arr.filter(x=>x.choice==="scissors").length;
  const pap = arr.filter(x=>x.choice==="paper").length;
  let winnerChoice = null;
  if(rock>0 && scis>0 && pap===0) winnerChoice="rock";
  else if(scis>0 && pap>0 && rock===0) winnerChoice="scissors";
  else if(pap>0 && rock>0 && scis===0) winnerChoice="paper";
  return winnerChoice;
}

function runResult(){
  switchPage(4);
  const winSel = calcResult();
  const allP = Object.values(players);
  // 大合唱：只播放未淘汰玩家
  log("大合唱：過濾淘汰玩家，剩餘"+allP.filter(x=>!x.eliminated).length+"人");
  // 更新勝場、淘汰邏輯
  allP.forEach(p=>{
    if(p.eliminated) return;
    if(p.choice === winSel){
      p.win +=1;
      p.consec +=1;
    }else{
      p.consec =0;
    }
    // 判斷淘汰
    let out = false;
    if(ruleType==="win2" && p.win>=2) out=true;
    if(ruleType==="win3" && p.win>=3) out=true;
    if(ruleType==="con2" && p.consec>=2) out=true;
    p.eliminated = out;
  })
  // 畫面顯示
  document.getElementById("resultView").innerText = allP.map(x=>`${x.name}:${x.choice} ${x.eliminated?"【淘汰】":""}`).join("\n");
  document.getElementById("rankView").innerText = allP.sort((a,b)=>b.win-a.win).map(x=>`${x.name}｜勝${x.win}｜連勝${x.consec}`).join("\n");
  // 5秒倒數
  let c = 5;
  document.getElementById("countdown").innerText = c;
  clearInterval(countdownTimer);
  countdownTimer = setInterval(()=>{
    c--;
    document.getElementById("countdown").innerText = c;
    if(c<=0){
      clearInterval(countdownTimer);
      const remain = allP.filter(x=>!x.eliminated);
      if(remain.length <=1){
        db.ref("rooms/"+roomId).update({gameState:"end",winner:remain[0]?.name})
      }else{
        db.ref("rooms/"+roomId).update({gameState:"play"})
      }
    }
  },1000)
}

function runEnd(){
  switchPage(5);
  db.ref("rooms/"+roomId).once("value",s=>{
    const d = s.val();
    document.getElementById("winnerText").innerText = "勝利者："+d.winner;
  })
}
</script>
</body>
</html>
