<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方包包包剪揼</title>
<style>
body{
  margin:0;
  background:#FFE66D url('background01.jpg') no-repeat top center;
  background-size:cover;
  font-family:-apple-system, "PingFang HK", sans-serif;
}
.title{
  font-size:46px; font-weight:1000; text-align:center; margin-top:22px;
  color:#fff; -webkit-text-stroke:4px #111;
  text-shadow:5px 5px 0 #111; letter-spacing:2px;
}
.sub{ text-align:center; margin:6px auto; background:#fff; border:2.5px solid #111; 
  border-radius:999px; padding:4px 14px; font-weight:900; display:table; }
.black-card{
  background:#111; border-radius:26px; padding:16px; margin:16px;
  border:3px solid #111; min-height:200px; color:#FFE66D;
}
</style>
</head>
<body>
  <div class="title">方包包包剪揼</div>
  <div class="sub">Rock • Paper • Scissors • Party</div>
  
  <!-- 三隻手用返你repo嗰三張 -->
  <div style="display:flex;justify-content:center;gap:10px;margin:20px">
    <img src="rock.jpg" style="width:28%;border:3px solid #111;border-radius:18px">
    <img src="paper.jpg" style="width:28%;border:3px solid #111;border-radius:18px">
    <img src="scissors.jpg" style="width:28%;border:3px solid #111;border-radius:18px">
  </div>

  <div class="black-card">
    <div style="color:#FFE66D;font-size:13px;font-weight:900">
      與朋友一起對決！準備好了嗎？<br><br>
      <span style="color:#FFE66D">輸入你個名</span>
      <!-- 呢度之後放你input -->
    </div>
  </div>
</body>
</html>
