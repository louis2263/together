<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial‑scale=1.0"/>
<title>包剪揼多人同步 v2.2</title>
<style>
*{box-sizing:border-box;font-family:system‑ui}
body{margin:0;padding:12px;background:#ffe666;font-size:17px}
.page{display:none}
.page.active{display:block}
button{padding:12px 16px;margin:6px;font-size:16px;border‑radius:8px;border:none;background:#fff}
input{padding:11px;width:100%;margin:6px 0;font‑size:17px;border‑radius:6px;border:1px solid #aaa}
#eventLogBox{width:100%;min‑height:140px;background:#fff;padding:10px;border‑radius:8px;white‑space:pre‑wrap;overflow‑y:auto;margin‑bottom:12px}
#debugWindow{position:fixed;left:0;right:0;bottom:0;background:#000c;color:#4f4;padding:8px;font‑size:12px;max‑height:160px;overflow‑y:auto}
.versionTag{position:fixed;top:8px;right:8px;background:#444;color:#fff;padding:4px 8px;border‑radius:6px}
</style>
</head>
<body>
<div class="versionTag">v2.2</div>

<!-- Page1 -->
<div id="page1" class="page active">
<h2>第一頁：輸入姓名 / 建立或加入房間</h2>
<input id="playerNameInput" placeholder="輸入你的名字"/>
<br/>
<button id="btnCreateRoom">房主：開啟全新房間</button>
<br/>
<input id="roomIdJoinInput" placeholder="輸入4位數房間號碼"/>
<button id="btnJoinRoom">房客：進入房間</button>
</div>

<!-- Page2 -->
<div id="page2" class="page">
<h2>房間號碼：<span id="roomTitleShow"></span></h2>
<div id="eventLogBox"></div>

<h3>錄製音訊 & 設定遊戲</h3>
<input id="p2PlayerName" readonly/>

<h4>第一段：包剪揼（大合唱用）</h4>
<button id="rec1Start">開始錄第一段</button>
<button id="rec1Stop">停止錄第一段</button>

<h4>第二段：勝利宣言</h4>
<button id="rec2Start">開始錄第二段</button>
<button id="rec2Stop">停止錄第二段</button>

<h4>房主選擇遊戲規則</h4>
<div>
<button data‑rule="oneRound">一鋪定勝負</button>
<button data‑rule="win2">贏兩鋪</button>
<button data‑rule="win3">贏三鋪</button>
<button data‑rule="consec2">連贏兩鋪</button>
</div>
</div>

<div id="debugWindow"></div>

<script type="module">
const VERSION = "v2.2";
const debugDiv = document.querySelector("#debugWindow");
const log = (txt)=>{
  const t = new Date().toLocaleString("zh‑HK");
  debugDiv.innerText += `[${t}] ${txt}\n`;
  debugDiv.scrollTop = debugDiv.scrollHeight;
};

// ---- Firebase 動態載入
let fbDb, roomRef, playersRef, roomEventsRef;
const initFirebase = async ()=>{
  log("Step0：動態 Import Firebase");
  const {initializeApp} = await import("https://www.gstatic.com/firebasejs/11.4.0/firebase‑app.js");
  const {getDatabase, ref, set, push, onValue, off} = await import("https://www.gstatic.com/firebasejs/11.4.0/firebase‑database.js");
  log("Step1 Firebase 初始化成功");
  const cfg = {
    apiKey:"你的key",
    authDomain:"xxx.firebaseapp.com",
    databaseURL:"https://xxx‑default‑rtdb.firebaseio.com",
    projectId:"xxx",
    storageBucket:"xxx.appspot.com"
  };
  const app = initializeApp(cfg);
  fbDb = getDatabase(app);
  window.$fb = {ref,set,push,onValue,off};
};

// 頁面切換
const setPage = (id)=>{
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
};

// 全域狀態
let myName = "";
let currentRoomId = "";
let unsubPlayer, unsubEvent;

// 寫入一條房間全域事件
const pushRoomEvent = async (msg)=>{
  const {push} = window.$fb;
  await push(roomEventsRef, {msg, ts:Date.now()});
};

// 渲染事件視窗
const renderRoomEvents = (snap)=>{
  const box = document.querySelector("#eventLogBox");
  box.innerText = "";
  if(!snap.exists()) return;
  const obj = snap.val();
  const arr = Object.values(obj).sort((a,b)=>a.ts‑b.ts);
  arr.forEach(e=>{
    box.innerText += e.msg + "\n";
  })
};

// 建立房間
document.querySelector("#btnCreateRoom").onclick = async ()=>{
  myName = document.querySelector("#playerNameInput").value.trim();
  if(!myName){alert("請輸入姓名");return}
  await initFirebase();
  // 隨機4位數
  currentRoomId = String(Math.floor(1000 + Math.random()*9000));
  log(`Step5：本地生成房號 = ${currentRoomId}`);

  const {ref,set,onValue} = window.$fb;
  roomRef = ref(fbDb,`rooms/${currentRoomId}`);
  playersRef = ref(fbDb,`rooms/${currentRoomId}/players`);
  roomEventsRef = ref(fbDb,`rooms/${currentRoomId}/roomEvents`);

  await set(ref(fbDb,`rooms/${currentRoomId}/host`), myName);
  await set(ref(playersRef, myName),{name:myName, ready:false});
  await pushRoomEvent(`${myName} 進入房間`);

  // 監聽事件串
  unsubEvent = onValue(roomEventsRef, renderRoomEvents);

  document.querySelector("#roomTitleShow").innerText = currentRoomId;
  document.querySelector("#p2PlayerName").value = myName;
  log("➡ 切換到 page2");
  setPage("page2");
};

// 加入房間
document.querySelector("#btnJoinRoom").onclick = async ()=>{
  myName = document.querySelector("#playerNameInput").value.trim();
  currentRoomId = document.querySelector("#roomIdJoinInput").value.trim();
  if(!myName || currentRoomId.length!==4){alert("填寫姓名+4位房號");return}
  await initFirebase();
  const {ref,set,onValue} = window.$fb;

  roomRef = ref(fbDb,`rooms/${currentRoomId}`);
  playersRef = ref(fbDb,`rooms/${currentRoomId}/players`);
  roomEventsRef = ref(fbDb,`rooms/${currentRoomId}/roomEvents`);

  await set(ref(playersRef, myName),{name:myName, ready:false});
  await pushRoomEvent(`${myName} 進入房間`);

  unsubEvent = onValue(roomEventsRef, renderRoomEvents);

  document.querySelector("#roomTitleShow").innerText = currentRoomId;
  document.querySelector("#p2PlayerName").value = myName;
  log("➡ 房客切換 page2");
  setPage("page2");
};

// -------- 錄音臨時存儲，後續接大合唱
let mediaRec1, mediaRec2;
let chunks1=[],chunks2=[];

document.querySelector("#rec1Start").onclick=async ()=>{
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  mediaRec1 = new MediaRecorder(stream);
  chunks1=[];
  mediaRec1.ondataavailable=e=>chunks1.push(e.data);
  mediaRec1.start();
  log("開始錄第一段");
};
document.querySelector("#rec1Stop").onclick=()=>{
  mediaRec1.stop();
  log("停止錄第一段");
};

document.querySelector("#rec2Start").onclick=async ()=>{
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  mediaRec2 = new MediaRecorder(stream);
  chunks2=[];
  mediaRec2.ondataavailable=e=>chunks2.push(e.data);
  mediaRec2.start();
  log("開始錄第二段");
};
document.querySelector("#rec2Stop").onclick=async ()=>{
  mediaRec2.stop();
  // 兩段都錄好就標準準備，寫事件
  if(chunks1.length>0 && chunks2.length>0){
    const {set,ref} = window.$fb;
    await set(ref(playersRef,`${myName}/ready`),true);
    await pushRoomEvent(`${myName} 已準備`);
    log(myName + "標記已準備");
  }
};

// 遊戲規則按鈕（房主用）
document.querySelectorAll("[data‑rule]").forEach(btn=>{
  btn.onclick = async ()=>{
    const rule = btn.dataset.rule;
    const {set,ref} = window.$fb;
    await set(ref(roomRef,"gameRule"), rule);
    log("房主設定規則:"+rule);
  }
})

log(`${VERSION} JS全部載入完畢，等待玩家開房`);
</script>
</body>
</html>
