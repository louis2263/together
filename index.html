<script>

// =========== 全域變數 ===========
let myName = "";

let victoryPlayed = false;

let mediaRecorder = null;
let recChunks = [];
const RECORD_SEC = 3;
let recCountdownTimer = null;
let recCount = 0;
let localAudioCache = {};
let audioCtx = null;
let currentRecType = null;

const MODE_NAMES = {
  oneRound: "大逃殺：一鋪定勝負 (淘汰制)",
  bestOf3: "積分制：贏兩鋪",
  bestOf5: "積分制：贏三鋪",

};

const debugDiv = document.getElementById('debug');
function logDebug(s){
  if(!debugDiv) return;
  debugDiv.innerText += new Date().toLocaleTimeString() + " | " + s + "\n";
  debugDiv.scrollTop = debugDiv.scrollHeight;
}

// 捕捉所有未處理的錯誤並顯示在螢幕下方 Debug 框，方便手機直接除錯
window.onerror = function(msg, url, line) {
  logDebug("❌ 程式錯誤 (第" + line + "行): " + msg);
};
window.addEventListener("unhandledrejection", function(event) {
  logDebug("❌ 非同步/Firebase錯誤: " + (event.reason?.message || event.reason));
});

logDebug("✅ 網頁與腳本載入成功，準備就緒");

// 測試 Firebase 連線狀態
db.ref(".info/connected").on("value", (snap) => {
  if (snap.val() === true) {
    logDebug("🟢 已成功連線至 Firebase 伺服器");
  } else {
    logDebug("🟡 正在連線 Firebase 伺服器...");
  }
});

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function genRoomId(){
  return String(Math.floor(1000 + Math.random()*9000));
}

function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

function sanitizeName(name){
  // 移除 Firebase Key 禁止的字元 . # $ [ ] /
  return name.replace(/[.#$\[\]\/]/g, "").trim();
}

// =========== 音訊工具函數 (相容 iOS Safari 與 Android/PC) ===========
async function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function base64ToBlob(b64Str) {
  const arr = b64Str.split(',');
  const mimeMatch = arr[0].match(/:(.*?);/);
  const mime = mimeMatch ? mimeMatch[1] : 'audio/webm';
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while(n--){ u8arr[n] = bstr.charCodeAt(n); }
  return new Blob([u8arr], {type:mime});
}

function initAudioContext(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
}

function getSupportedMimeType() {
  const types = [
    "audio/webm;codecs=opus",
    "audio/webm",
    "audio/mp4",
    "audio/aac",
    "audio/ogg"
  ];
  for (const t of types) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) {
      return t;
    }
  }
  return "";
}

async function startRecord(recType){
  initAudioContext();
  if(mediaRecorder && mediaRecorder.state !== "inactive"){
    logDebug("正在錄音中，無法重複觸發");
    return;
  }
  currentRecType = recType;
  recChunks = [];
  recCount = RECORD_SEC;

  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(err){
    alert("無法取得麥克風權限，請允許瀏覽器使用麥克風");
    logDebug("麥克風失敗:"+err.message);
    return;
  }

  const mimeType = getSupportedMimeType();
  try {
    mediaRecorder = mimeType 
      ? new MediaRecorder(mediaStream, {mimeType}) 
      : new MediaRecorder(mediaStream);
  }catch(e){
    alert("此瀏覽器不支援錄音功能");
    logDebug("MediaRecorder建立失敗: "+e);
    mediaStream.getTracks().forEach(t=>t.stop());
    return;
  }

  const btnSound = document.getElementById('btnRecSound');
  const btnVic = document.getElementById('btnRecVictory');
  btnSound.disabled = true;
  btnVic.disabled = true;

  mediaRecorder.ondataavailable = e=>{
    if(e.data && e.data.size>0) recChunks.push(e.data);
  };

  mediaRecorder.onstop = async ()=>{
    logDebug("錄音完畢，正在處理音訊...");
    mediaStream.getTracks().forEach(t=>t.stop());
    btnSound.disabled = false;
    btnVic.disabled = false;

    const actualMime = mediaRecorder.mimeType || mimeType || "audio/webm";
    const audioBlob = new Blob(recChunks, {type: actualMime});
    const b64 = await blobToBase64(audioBlob);
    const blobUrl = URL.createObjectURL(audioBlob);

    if(!localAudioCache[myName]) localAudioCache[myName] = {};
    if(currentRecType === "sound"){
      localAudioCache[myName].soundB64 = b64;
      localAudioCache[myName].soundBlobUrl = blobUrl;
    }else{
      localAudioCache[myName].victoryB64 = b64;
      localAudioCache[myName].victoryBlobUrl = blobUrl;
    }
    
    if(playerRef){
      await playerRef.update({
        [currentRecType]: b64,
        readySound: true
      });
      logDebug(currentRecType + " 音訊上傳Firebase完成");
    }
  };

  mediaRecorder.start();
  logDebug(`開始錄音 ${RECORD_SEC}秒 (格式: ${mediaRecorder.mimeType || '預設'})`);

  recCountdownTimer = setInterval(()=>{
    recCount -= 1;
    logDebug(`錄音倒數: ${recCount}`);
    if(recCount <= 0){
      clearInterval(recCountdownTimer);
      if(mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    }
  }, 1000);
}

async function playLocalRecord(recType){
  initAudioContext();
  const cache = localAudioCache[myName];
  if(!cache){ alert("尚未錄音"); return; }
  const url = recType==='sound' ? cache.soundBlobUrl : cache.victoryBlobUrl;
  if(!url){ alert("尚未錄音"); return; }
  const audio = new Audio(url);
  audio.play().catch(e => logDebug("播放失敗: " + e.message));
  logDebug("播放本機錄音:"+recType);
}

async function playChorus(playerList){
  initAudioContext();
  const buffers = [];
  for(const p of playerList){
    if(!p.sound) continue;
    try {
      let blob;
      if(localAudioCache[p.name] && localAudioCache[p.name].soundBlobUrl){
        const resp = await fetch(localAudioCache[p.name].soundBlobUrl);
        blob = await resp.blob();
      }else{
        blob = base64ToBlob(p.sound);
      }
      const arrayBuf = await blob.arrayBuffer();
      const audioBuf = await audioCtx.decodeAudioData(arrayBuf);
      buffers.push(audioBuf);
    } catch (e) {
      logDebug(`解碼 ${p.name} 音訊失敗: ${e.message}`);
    }
  }
  if(buffers.length === 0) return;

  const playAt = audioCtx.currentTime + 0.05;
  buffers.forEach(buf=>{
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.start(playAt);
  });
  logDebug(`大合唱播放，共 ${buffers.length} 條音訊同時播出`);
}

async function playWinnerVictory(winnerPlayer){
  if(!winnerPlayer) return;
  initAudioContext();
  const cache = localAudioCache[winnerPlayer.name];
  if(!cache || !cache.victoryBlobUrl){
    logDebug("勝利者沒有錄製勝利宣言音訊");
    return;
  }
  const audio = new Audio(cache.victoryBlobUrl);
  try {
    await audio.play();
    logDebug("播放勝利者宣言");
  } catch (e) {
    logDebug("播放勝利宣言受阻(需使用者互動): " + e.message);
  }
}

// =========== 第四頁出拳渲染 ===========

async function renderPunchDisplay(roomData){
  const container = document.getElementById("showPunch");
  container.innerHTML = "";
  const playersAll = Object.values(roomData.players || {});
  // 只顯示本回合有出拳（未淘汰）的玩家
  const playersHaveChoice = playersAll.filter(p => !p.eliminated && p.choice && p.choice !== "");

  const mePlayer = playersHaveChoice.find(p => p.name === myName);
  const otherPlayers = playersHaveChoice.filter(p => p.name !== myName);

  if(mePlayer){
    const divMe = document.createElement("div");
    divMe.className = "punch-item";
    divMe.innerHTML = `
      <strong>${mePlayer.name} (自己)</strong> 出【${getPunchName(mePlayer.choice)}】
      <img src="${getPunchImgSrc(mePlayer.choice)}" style="width:55px;height:55px;vertical-align:middle;margin-left:8px;border-radius:6px;">
    `;
    container.appendChild(divMe);
  }

  for(const p of otherPlayers){
    await sleep(600);
    const divOther = document.createElement("div");
    divOther.className = "punch-item";
    divOther.innerHTML = `
      <strong>${p.name}</strong> 出【${getPunchName(p.choice)}】
      <img src="${getPunchImgSrc(p.choice)}" style="width:55px;height:55px;vertical-align:middle;margin-left:8px;border-radius:6px;">
    `;
    container.appendChild(divOther);
  }
}

// =========== 多人包剪揼回合運算邏輯 (已修復) ===========
function calcRoundLocal(roomData){
  const playersRaw = Object.values(roomData.players || {});
  const mode = roomData.mode || "oneRound";
  const alivePlayers = playersRaw.filter(p => !p.eliminated && p.choice && p.choice !== "");

  // 統計場上出現了哪幾種拳
  const distinctChoices = [...new Set(alivePlayers.map(p => p.choice))];

  // 只有1種拳(全同) 或 3種拳齊集(包剪揼都有) -> 全部打和
  if(distinctChoices.length !== 2){
    return {
      winnerNames: [],
      loserNames: [],
      allDraw: true,
      players: playersRaw
    };
  }

  // 當場上剛好有 2 種拳時，判斷哪種拳勝出
  const [c1, c2] = distinctChoices;
  const winMap = { paper: "rock", rock: "scissors", scissors: "paper" };
  const winningChoice = (winMap[c1] === c2) ? c1 : c2;

  const winnerNames = alivePlayers
    .filter(p => p.choice === winningChoice)
    .map(p => p.name);

  const loserNames = alivePlayers
    .filter(p => p.choice !== winningChoice)
    .map(p => p.name);

  const newPlayers = playersRaw.map(p => {
    const np = {...p};
    if(p.eliminated) return np; // 已淘汰者維持原狀

    if(winnerNames.includes(p.name)){
      np.score = (np.score || 0) + 1;
      np.consecWin = (np.consecWin || 0) + 1;
    } else if(loserNames.includes(p.name)){
      np.consecWin = 0;
      // 只有在「大逃殺(oneRound)」模式下，輸家才會被淘汰
      if(mode === "oneRound"){
        np.eliminated = true;
      }
    }
    return np;
  });

  return {
    winnerNames,
    loserNames,
    allDraw: false,
    players: newPlayers
  };
}

function checkGameWinCondition(mode, playerArr){
  const aliveArr = playerArr.filter(p => !p.eliminated);

  switch(mode){
    case "oneRound":
      // 大逃殺模式：場上只剩最後 1 名存活者即為總冠軍
      if(aliveArr.length === 1) return aliveArr[0].name;
      break;
    case "bestOf3":
      // 先贏 2 鋪者勝 (若有同分則先達到者)
      const w3 = aliveArr.find(p => (p.score || 0) >= 2);
      if(w3) return w3.name;
      break;
    case "bestOf5":
      // 先贏 3 鋪者勝
      const w5 = aliveArr.find(p => (p.score || 0) >= 3);
      if(w5) return w5.name;
      break;
    case "consec2":
      // 連贏 2 鋪者勝
      const wc = aliveArr.find(p => (p.consecWin || 0) >= 2);
      if(wc) return wc.name;
      break;
  }
  return null;
}

async function runCountdown(){
  let cd = 3;
  const el = document.getElementById('countDownText');
  el.innerText = cd;
  return new Promise(res=>{
    const t = setInterval(()=>{
      cd--;
      el.innerText = cd > 0 ? cd : 0;
      if(cd <= 0){
        clearInterval(t);
        res();
      }
    }, 1000);
  });
}

async function runRoundProcess(roomSnapshotData){
  isProcessingRound = true;
  const currentRound = roomSnapshotData.round || 1;
  lastProcessedRound = currentRound;

  logDebug(`==== 開始處理第 ${currentRound} 回合 ====`);
  showPage("page4");

  const alivePlayersWithSound = Object.values(roomSnapshotData.players || {})
    .filter(x => !x.eliminated && x.sound);
  playChorus(alivePlayersWithSound);

  await renderPunchDisplay(roomSnapshotData);

  const roundResult = calcRoundLocal(roomSnapshotData);
  const elimDiv = document.getElementById("showElim");
  
  if(roundResult.allDraw){
    elimDiv.innerHTML = `<div style="color:#ffd54f;">🤝 本回合打和！無人淘汰/得分，準備下一回合...</div>`;
  } else {
    const isElimMode = (roomSnapshotData.mode === "oneRound");
    elimDiv.innerHTML = `
      <div style="color:#00e676;">🏆 本回合勝出：<strong>${roundResult.winnerNames.join(", ")}</strong></div>
      <div style="color:#ff5252;">${isElimMode ? "❌ 本回合淘汰" : "💔 本回合落敗"}：<strong>${roundResult.loserNames.join(", ") || "無"}</strong></div>
    `;
  }

  await runCountdown();

  // 統一由「房主 (Host)」負責計算結果並更新 Firebase 資料庫，避免多人同時寫入衝突
  if(isHost){
    const finalWinnerName = checkGameWinCondition(roomSnapshotData.mode, roundResult.players);
    const updatePayload = {};

    roundResult.players.forEach(p => {
      // 將出拳重設為空字串 "" (避免使用 null 導致 Firebase 刪除欄位)
      p.choice = "";
      updatePayload[`players/${p.name}`] = p;
    });

    if(finalWinnerName){
      updatePayload["gameState"] = "finished";
      updatePayload["winner"] = finalWinnerName;
      logDebug("房主判定遊戲結束，總勝利者：" + finalWinnerName);
    } else {
      updatePayload["round"] = currentRound + 1;
      logDebug("房主推進至第 " + (currentRound + 1) + " 回合");
    }

    await roomRef.update(updatePayload);
  }

  // 解除本機狀態鎖，等待 Firebase 狀態推進到下一回合或結束畫面
  isProcessingRound = false;
}

// =========== Firebase 事件綁定 ===========
document.getElementById('btnCreateRoom').onclick = async ()=>{
  try {
    logDebug("👉 點擊了【開新房間】...");
    myName = sanitizeName(document.getElementById('myName').value);
    if(!myName){ logDebug("⚠️ 名字為空"); return; }
    
    roomId = genRoomId();
    isHost = true;
    roomRef = db.ref(`rooms/${roomId}`);
    
    logDebug("⏳ 正在寫入房間資料至 Firebase (" + roomId + ")...");
    // 若房主意外斷線，自動清理房間避免殘留垃圾資料
    roomRef.onDisconnect().remove();

    await roomRef.set({
      host: myName,
      gameState: "waiting",
      mode: "oneRound",
      round: 1,
      winner: "",
      players: {}
    });

    playerRef = roomRef.child(`players/${myName}`);
    await playerRef.set({
      name: myName,
      readySound: false,
      choice: "",
      eliminated: false,
      score: 0,
      consecWin: 0
    });

    logDebug("✅ 建立房間成功: " + roomId);
    enterRoomUI();
  } catch (err) {
    logDebug("❌ 開房失敗: " + err.message);
  }
};

document.getElementById('btnJoinRoom').onclick = async ()=>{
  try {
    logDebug("👉 點擊了【進房間】...");
    myName = sanitizeName(document.getElementById('myName').value);
    roomId = document.getElementById('roomIdJoin').value.trim();
    if(!myName || roomId.length !== 4){ logDebug("⚠️ 請輸入有效名字及4位房號"); return; }

    isHost = false;
    roomRef = db.ref(`rooms/${roomId}`);
    const snap = await roomRef.once('value');
    if(!snap.exists()){ logDebug("⚠️ 房間不存在或已關閉"); return; }

    const roomData = snap.val();
    if(roomData.gameState !== "waiting"){ logDebug("⚠️ 遊戲已經開始，無法中途加入"); return; }

    const pl = roomData.players || {};
    if(Object.keys(pl).length >= 8){ logDebug("⚠️ 房間已滿 (最多8人)"); return; }
    if(pl[myName]){ logDebug("⚠️ 房間內已有相同名字的玩家"); return; }

    playerRef = roomRef.child(`players/${myName}`);
    await playerRef.set({
      name: myName,
      readySound: false,
      choice: "",
      eliminated: false,
      score: 0,
      consecWin: 0
    });

    logDebug("✅ " + myName + " 進房成功: " + roomId);
    enterRoomUI();
  } catch (err) {
    logDebug("❌ 進房失敗: " + err.message);
  }
};

function enterRoomUI(){
  isProcessingRound = false;
  lastProcessedRound = -1;
  victoryPlayed = false;
  document.getElementById('showRoomId').innerText = roomId;
  document.getElementById('hostControls').style.display = isHost ? "block" : "none";
  showPage('page2');
  listenRoom();
}

function listenRoom(){
  roomRef.off(); // 確保不重複綁定監聽器
  roomRef.on('value', snap => {
    const d = snap.val();
    if(!d){
      // 房間被房主刪除
      alert("房間已關閉，將返回大廳");
      resetLocalState();
      showPage("page1");
      return;
    }

    renderRoomLog(d);

    // 同步快取所有玩家的音訊
    const ps = d.players || {};
    Object.values(ps).forEach(p => {
      if(p.sound){
        if(!localAudioCache[p.name]) localAudioCache[p.name] = {};
        if(localAudioCache[p.name].soundB64 !== p.sound){
          localAudioCache[p.name].soundB64 = p.sound;
          const bl = base64ToBlob(p.sound);
          localAudioCache[p.name].soundBlobUrl = URL.createObjectURL(bl);
        }
      }
      if(p.victory){
        if(!localAudioCache[p.name]) localAudioCache[p.name] = {};
        if(localAudioCache[p.name].victoryB64 !== p.victory){
          localAudioCache[p.name].victoryB64 = p.victory;
          const bl = base64ToBlob(p.victory);
          localAudioCache[p.name].victoryBlobUrl = URL.createObjectURL(bl);
        }
      }
    });

    // 狀態機分流
    if(d.gameState === "playing"){
      // 如果正在播放本回合動畫結算中，忽略中途的資料庫變動
      if(isProcessingRound) return;

      const currentRound = d.round || 1;
      const aliveList = Object.values(ps).filter(pl => !pl.eliminated);
      // 檢查所有存活者是否都已出拳 (choice 為非空字串)
      const allHasChoice = aliveList.length > 0 && aliveList.every(pl => pl.choice && pl.choice !== "");

      if(allHasChoice && lastProcessedRound !== currentRound){
        runRoundProcess(d);
      } else if(!allHasChoice) {
        // 尚有人未出拳，顯示 Page 3 出拳畫面
        showPage("page3");
        renderScore(d);
        updateChoiceButtonsUI(ps[myName]);
      }
    } else if(d.gameState === "finished"){
      showPage("page5");
      const winName = d.winner || "無";
      document.getElementById("winnerName").innerText = winName;
      if(!victoryPlayed && ps[winName]){
        victoryPlayed = true;
        playWinnerVictory(ps[winName]);
      }
    }
  });
}

function updateChoiceButtonsUI(me){
  const actionArea = document.getElementById('actionArea');
  const specMsg = document.getElementById('spectatorMsg');
  const btns = document.querySelectorAll('.choice-btn');

  if(!me || me.eliminated){
    actionArea.style.display = "none";
    specMsg.style.display = "block";
    return;
  }

  actionArea.style.display = "block";
  specMsg.style.display = "none";
  myChoice = me.choice || "";

  btns.forEach(btn => {
    const val = btn.dataset.val;
    btn.classList.toggle('selected', val === myChoice);
    // 一旦出拳後即鎖定按鈕，防止反悔或重複點擊
    btn.disabled = (myChoice !== "");
  });

  document.getElementById('choicePrompt').innerText = myChoice 
    ? `✅ 你已出【${getPunchName(myChoice)}】，等待其他玩家...` 
    : "請選擇你要出的拳：";
}

function renderRoomLog(roomData){
  const logDiv = document.getElementById('roomLog');
  logDiv.innerHTML = "<h4>房間玩家列表：</h4>";
  const ps = roomData.players || {};
  Object.values(ps).forEach(p => {
    const div = document.createElement('div');
    div.style.padding = "4px 0";
    const hostTag = (p.name === roomData.host) ? "👑 " : "";
    div.innerText = `${hostTag}${p.name} ${p.readySound ? "✅已錄音" : "⏳未錄音"}`;
    logDiv.appendChild(div);
  });
}

document.getElementById('btnStartGame').onclick = async ()=>{
  if(!isHost) return;
  const snap = await roomRef.once('value');
  const d = snap.val();
  const playerCount = Object.keys(d.players || {}).length;
  if(playerCount < 2){
    alert("至少需要 2 位玩家才能開始遊戲！");
    return;
  }

  const sel = document.getElementById('gameModeSel').value;
  await roomRef.update({
    gameState: "playing",
    mode: sel,
    round: 1,
    winner: ""
  });
  logDebug("房主啟動遊戲，模式=" + sel);
};

document.querySelectorAll('.choice-btn').forEach(btn => {
  btn.onclick = async function(){
    if(this.disabled || myChoice !== "") return;
    initAudioContext(); // 趁使用者點擊按鈕時解鎖手機音訊播放權限
    const val = this.dataset.val;
    myChoice = val;
    
    // 立即鎖定 UI 防止連點
    document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
    this.classList.add('selected');

    await playerRef.update({ choice: val });
    logDebug(myName + " 出拳: " + val);
  };
});

function renderScore(roomData){
  document.getElementById('curModeText').innerText = `${MODE_NAMES[roomData.mode] || roomData.mode} (第 ${roomData.round || 1} 回合)`;
  const sb = document.getElementById('scoreBox');
  sb.innerHTML = "<h4>📊 即時戰況</h4>";
  Object.values(roomData.players || {}).forEach(p => {
    const statusHtml = p.eliminated 
      ? `<span class="status-badge badge-elim">已淘汰</span>` 
      : (p.choice ? `<span class="status-badge badge-alive">已出拳</span>` : `<span style="color:#aaa;font-size:0.85rem;">思考中...</span>`);
    
    sb.innerHTML += `
      <div style="margin:6px 0;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,0.1);">
        <strong>${p.name}</strong> | 勝場: ${p.score || 0} | 連勝: ${p.consecWin || 0} ${statusHtml}
      </div>
    `;
  });
}

function resetLocalState(){
  if(roomRef) roomRef.off();
  Object.values(localAudioCache).forEach(item => {
    if(item.soundBlobUrl) URL.revokeObjectURL(item.soundBlobUrl);
    if(item.victoryBlobUrl) URL.revokeObjectURL(item.victoryBlobUrl);
  });
  localAudioCache = {};
  roomRef = null;
  playerRef = null;
  myChoice = "";
  isProcessingRound = false;
  lastProcessedRound = -1;
}

document.getElementById('btnEndGame').onclick = async ()=>{
  if(roomRef && isHost){
    await roomRef.remove();
  }
  resetLocalState();
  if(audioCtx) { await audioCtx.close(); audioCtx = null; }
  logDebug("結束遊戲並清除快取");
  showPage("page1");
};

document.getElementById('btnRecSound').onclick = ()=> startRecord("sound");
document.getElementById('btnPlaySound').onclick = ()=> playLocalRecord("sound");
document.getElementById('btnRecVictory').onclick = ()=> startRecord("victory");
document.getElementById('btnPlayVictory').onclick = ()=> playLocalRecord("victory");
</script>
